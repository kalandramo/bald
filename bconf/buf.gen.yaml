version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/kalandramo/bald/bconf/gen/go
# 对照路径，不是入库产出的真相源：BSR 容器里的 protoc-gen-go 与本机**同一个版本号**
# 的二进制在中文注释的 `//` 后多一个空格（实测 `bootstrap/v1/log.pb.go`），因此
# 用本模板重出的产物与 gen/go 有一处排版差异、会被 proto-contract-check 判红。
# 成因不是「远端 vs 本机」这一类玄学：插件用 stdlib go/printer 重排产物，容器里
# 编译该插件的 Go 与本机那把不同，注释口味就不同（见风险登记册 §7.9 第四轮）。
# 产出走 buf.gen.local.yaml（= `task proto-contract`），本模板只用于与 BSR 侧
# 对齐。插件版本显式钉到产物头部声明的那一版，否则「latest」会随 BSR 发布漂移。
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/go
    opt: paths=source_relative
