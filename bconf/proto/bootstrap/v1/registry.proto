syntax = "proto3";

package bootstrap.v1;

option go_package = "github.com/kalandramo/bald/bconf/gen/go/bootstrap/v1";

// Registry 描述服务注册中心配置。
message Registry {
  enum Type {
    TYPE_UNSPECIFIED = 0;

    CONSUL = 1;
    ETCD = 2;
    NACOS = 3;
    KUBERNETES = 7;

    // 2026-09-17 瘦身：zookeeper/polaris/eureka/service_comb 无 provider
    // 实现，枚举值直接删除；枚举号与枚举名 reserved 防复用（与
    // config.proto 死源瘦身同口径：契约只为已实现的后端承诺形状）。
    reserved 4, 5, 6, 8;
    reserved "ZOOKEEPER", "POLARIS", "EUREKA", "SERVICE_COMB";
  }

  message Consul {
    string address = 1;
    string scheme = 2;
    string token = 3;
    // 健康检查间隔（秒）。
    int32 health_check_interval = 4;
    // 健康检查超时（秒）。
    int32 health_check_timeout = 5;
    // 是否启用健康检查。
    bool enable_health_check = 6;
    // 是否启用心跳。
    bool heartbeat = 7;
    // 服务注销临界时间（秒）。
    int32 deregister_critical_service_after = 8;
    string datacenter = 9;
  }

  message Etcd {
    repeated string endpoints = 1;
    string username = 2;
    string password = 3;
    // 键前缀/命名空间。
    string prefix = 4;
    // 注册 TTL（秒）。
    int32 ttl = 5;
    // 最大重试次数。
    int32 max_retry = 6;
  }

  message Nacos {
    repeated string server_addrs = 1;
    string namespace = 2;
    string group = 3;
    string cluster_name = 4;
    double weight = 5;
    // 配置前缀路径。
    string prefix = 6;
    // 默认服务类型。
    string default_kind = 7;
    // 鉴权用户名（Nacos 开启 auth 时必填；namespace 须填 namespace ID 而非显示名）。
    string username = 8;
    // 鉴权密码。
    string password = 9;
  }

  message Kubernetes {
    string namespace = 1;
  }

  string type = 1;

  optional Consul consul = 2;
  optional Etcd etcd = 3;
  optional Nacos nacos = 4;
  optional Kubernetes kubernetes = 8;

  // 2026-09-17 瘦身：zookeeper/polaris/eureka/service_comb 四段是契约预留
  // 但无任何实现（枚举里也无对应 provider），删除；字段号与名字 reserved
  // 防复用。新增后端时先写 registry/<backend> 实现，需要新配置段再以新
  // 字段号追加。
  reserved 5, 6, 7, 9;
  reserved "zookeeper", "polaris", "eureka", "service_comb";
}
