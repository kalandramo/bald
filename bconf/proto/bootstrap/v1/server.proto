syntax = "proto3";

package bootstrap.v1;

option go_package = "github.com/kalandramo/bald/bconf/gen/go/bootstrap/v1";

// Server 描述一个传输层实例，对应 wind.WithServer。
// 同一 Server 消息中可同时包含多种传输层配置，bootstrap 会分别创建对应的实例。
message Server {
  message TLS {
    message File {
      optional string cert_path = 1;
      optional string key_path = 2;
      optional string ca_path = 3;
    }
    message Config {
      optional bytes cert_pem = 1;
      optional bytes key_pem = 2;
      optional bytes ca_pem = 3;
    }

    optional File file = 1;
    optional Config config = 2;

    bool insecure_skip_verify = 3;
  }

  // HTTP 传输层。
  message Http {
    // HTTP 中间件配置。
    message Middleware {
      // Recovery 中间件：捕获 panic 并返回 500。
      message Recovery {
        // 是否记录堆栈跟踪。默认 true。
        optional bool stack_trace = 1;
      }

      // CORS 跨域中间件。
      message Cors {
        // 允许的源列表，为空表示允许所有源（*）。
        repeated string allowed_origins = 1;
        // 允许的 HTTP 方法，为空使用默认值。
        repeated string allowed_methods = 2;
        // 允许的请求头。
        repeated string allowed_headers = 3;
        // 暴露给浏览器的响应头。
        repeated string exposed_headers = 4;
        // 是否允许携带凭证（Cookie 等）。
        bool allow_credentials = 5;
        // 预检请求缓存时间（秒）。
        int32 max_age = 6;
      }

      // Logging 请求日志中间件。
      message Logging {
        // 跳过日志记录的路径（如 /healthz）。
        repeated string skip_paths = 1;
      }

      // RequestID 请求 ID 中间件。
      message RequestId {
        // 请求 ID 请求头名称，默认 X-Request-Id。
        optional string header_name = 1;
      }

      // Tracing OpenTelemetry 链路追踪中间件。无需额外配置，自动使用全局 TracerProvider。
      message Tracing {}

      // RateLimit 限流中间件。
      message RateLimit {
        // 每秒允许的请求数。
        double rate = 1;
        // 突发容量。
        int32 burst = 2;
        // 是否使用等待模式（平滑限流）。
        bool wait = 3;
      }

      // Timeout 请求超时中间件。
      message Timeout {
        // 默认超时时间（毫秒）。
        int64 default_timeout_ms = 1;
        // 超时后返回的 HTTP 状态码，默认 503。
        int32 status_code = 2;
      }

      // CircuitBreaker 熔断中间件（服务端入口的自我防护，**opt-in**：本段缺在
      // 那里就等于不挂这一层，现有部署行为不变）。
      //
      // 算法：`circuitbreaker/hystrix`——滑窗失败率 + 最小样本量 + 固定休眠窗，
      // 字段与本段一一对应。sres/vegas/sentinel 三种没有各自的契约段：sres 无
      // 请求量下限（单次失败就开始概率性拒流，低流量服务不可用）、vegas 按出站
      // RTT 膨胀判定（入口面没有「下游」可测）、sentinel 要引第三方规则中心。
      // 它们照常发布，换算法属代码级注入（见《Bald 熔断设计》的接线节）。
      //
      // 链序：限流之后、超时之前。三个判据决定它不能更外也不能更内：
      //   - 必须在认证/授权之后：否则匿名流量就能把失败率打满、替所有人开窗；
      //   - 必须限流之后：配额先拒（便宜），熔断只判「这次还值不值得真做」；
      //   - 必须超时之外：内层 Timeout 写出的 503 要被记成失败——「handler 总是
      //     超时」正是熔断该抓的形状，挂在超时内侧就只能看到成功返回的 handler。
      //
      // 失败口径（HTTP 面）：响应状态码 >= 500 记失败，其余（含 4xx 与被本层自己
      // 拒掉的 503）记成功或不上报。4xx 是调用方的错，计入会让一个坏客户端替全体
      // 用户开窗；本层自己的拒绝发生在 Allow 之前，按契约不欠上报。
      // handler panic 也记失败：上报在 defer 里，panic 沿链向外层 Recovery 传播时
      // 仍然完成上报——少了那次上报，半开态的「在途探针」标记永不复位，熔断会
      // 永久拒绝（契约里「放行即欠一次上报」这条义务的失效点）。
      // 0 的读法（proto3 没有字段存在性，「写 0」与「没写」不可区分）：一律
      // 按「未设置」取下面注明的默认值。因此本段可以只写一两个字段、其余留
      // 默认；负值、error_threshold > 1、status_code 非 5xx 才是配置错误，
      // 启动期 fail-fast（显式配了熔断却静默不生效是最坏结果）。
      message CircuitBreaker {
        // 开窗的失败率阈值，取值 (0,1]（0.2 = 两成失败）。0 → 默认 0.5。
        double error_threshold = 1;
        // 参与判定的最小样本量：滑窗内请求数低于它就不开窗。这是低流量服务
        // 不被一次失败打穿的地板。0 → 默认 20。
        int32 min_requests = 2;
        // 开窗时长（毫秒），到期后半开、只放一个探针。0 → 默认 5000。
        int64 open_duration_ms = 3;
        // 失败率统计滑窗长度（毫秒）。0 → 默认 10000。
        int64 window_ms = 4;
        // 开态（含半开被拒）返回的 HTTP 状态码。0 → 默认 503；给非 0 值时
        // 必须是 5xx——用 4xx 表达「我坏了」会让客户端库把它当业务错误处理。
        int32 status_code = 5;
      }

      optional Recovery recovery = 1;
      optional Cors cors = 2;
      optional Logging logging = 3;
      optional RequestId request_id = 4;
      optional Tracing tracing = 5;
      optional RateLimit rate_limit = 6;
      optional Timeout timeout = 7;
      optional CircuitBreaker circuit_breaker = 8;
    }

    // 监听地址，如 ":8080"。
    string addr = 1;
    // HTTP 驱动：net/http / chi / gin / fiber。留空默认 net/http。
    string driver = 2;
    TLS tls = 3;
    // 中间件配置，按字段顺序注册。
    Middleware middleware = 4;
  }

  // HTTP/3 (QUIC) 传输层。
  message Http3 {
    // 监听地址，如 ":443"。
    string addr = 1;
    TLS tls = 2;
  }

  // gRPC 传输层。
  message Grpc {
    // gRPC 中间件配置。
    message Middleware {
      // Recovery 中间件：捕获 panic 并返回 Internal 错误。
      message Recovery {}

      // Logging 请求日志中间件。
      message Logging {}

      // Tracing OpenTelemetry 链路追踪中间件。
      message Tracing {}

      // Validate 参数校验中间件。
      message Validate {}

      // RateLimit 限流中间件。与 HTTP 侧同字段，但配额是**这一面自己的**：
      // 只写 server.http.middleware.rate_limit 时，gRPC 沿用 HTTP 那个限流器
      // （共用一个桶）；本段存在时 gRPC 换用自己的桶，HTTP 面不受影响。
      // 见 pkg/middleware/bundle 的 GRPCRateLimit。
      message RateLimit {
        // 每秒允许的请求数。
        double rate = 1;
        // 突发容量。
        int32 burst = 2;
        // 是否使用等待模式（平滑限流）。
        bool wait = 3;
      }

      // Timeout 服务端默认超时（毫秒）。
      //
      // 语义与 HTTP 侧不同，别当同一个东西：gRPC 只给 handler 一个会到期的
      // ctx（不缩短调用方已带的 deadline），也不会硬性提前返回响应；且**只
      // 作用于 unary**——流式调用不挂默认超时，否则这里会变成「流的最大存活
      // 时长」，长订阅到点被砍且没有可区分的错误。
      //
      // 没有 status_code 字段：那是 HTTP 专属概念，gRPC 用 status code。
      message Timeout {
        // 默认超时时间（毫秒）。
        int64 default_timeout_ms = 1;
      }

      // CircuitBreaker 熔断中间件（服务端入口的自我防护，**opt-in**：本段缺在
      // 那里就等于不挂这一层）。算法、字段含义与链序理由同 HTTP 侧的
      // Server_Http_Middleware.CircuitBreaker（见 pkg/middleware/bundle 的
      // GRPCCircuitBreaker），差别只在下面两条这一面独有的口径：
      //
      // 失败口径：按 handler 返回的 status code 判，只有服务侧的错才算失败——
      // Internal / Unknown / Unavailable / DeadlineExceeded / DataLoss。客户端
      // 侧的错（InvalidArgument、NotFound、PermissionDenied……）记成功：一个坏
      // 客户端反复提交非法参数不该替所有人开窗。ResourceExhausted 也不算——那是
      // 本服务自己的限流答案，把它计入失败等于让熔断消费自己的拒流。
      //
      // 拒绝码：开态返回 Unavailable（客户端库按可重试处理），没有 status_code
      // 字段可调，理由与 Timeout 那节相同。
      //
      // **只作用于 unary**，且不是漏掉：一条流的「失败」没有一致答案——建流成功
      // 之后流还能跑十分钟，按建流算则开窗与真实退化无关，按流终态算则一条长流
      // 会长期占用半开探针。要这一语义请自己组 ChainStreamInterceptor。
      // 字段的 0 读法同 HTTP 侧（0 = 未设置，取注释里的默认值）。
      //
      // 与 HTTP 段的覆盖关系同 rate_limit：只写 server.http.middleware
      // .circuit_breaker 时，gRPC 沿用 HTTP 那一个熔断器（同一份滑窗，HTTP 的
      // 5xx 与 gRPC 的服务侧错误一起计入）；本段存在时 gRPC 换用自己的实例，
      // HTTP 面不受影响。
      message CircuitBreaker {
        // 开窗的失败率阈值，取值 (0,1]（0.2 = 两成失败）。0 → 默认 0.5。
        double error_threshold = 1;
        // 参与判定的最小样本量：滑窗内请求数低于它就不开窗。这是低流量服务
        // 不被一次失败打穿的地板。0 → 默认 20。
        int32 min_requests = 2;
        // 开窗时长（毫秒），到期后半开、只放一个探针。0 → 默认 5000。
        int64 open_duration_ms = 3;
        // 失败率统计滑窗长度（毫秒）。0 → 默认 10000。
        int64 window_ms = 4;
      }

      optional Recovery recovery = 1;
      optional Logging logging = 2;
      optional Tracing tracing = 3;
      optional Validate validate = 4;
      optional RateLimit rate_limit = 5;
      optional Timeout timeout = 6;
      optional CircuitBreaker circuit_breaker = 7;
    }

    // 监听地址，如 ":9000"。
    string addr = 1;
    // 是否启用 gRPC 反射。
    bool reflection = 2;
    TLS tls = 3;
    // 中间件配置。
    Middleware middleware = 4;
  }

  // GraphQL 传输层（基于 gqlgen，运行在 HTTP 之上）。
  message Graphql {
    // 监听地址，如 ":8080"。
    string addr = 1;
    TLS tls = 2;
  }

  // SSE (Server-Sent Events) 传输层。
  message Sse {
    // 监听地址，如 ":8080"。
    string addr = 1;
    // SSE 事件路径，默认 "/events"。
    string path = 2;
    TLS tls = 3;
    // 是否自动订阅流（对应 sse.WithAutoStream）。不表态时保留实现默认值。
    optional bool auto_stream = 4;
    // 是否自动重放历史事件（对应 sse.WithAutoReplay）。不表态时保留实现默认值
    // ——实现默认是开启，所以要关掉必须显式写 false，靠 presence 区分。
    optional bool auto_replay = 5;
  }

  // WebSocket 传输层。
  message Websocket {
    // 监听地址，如 ":8080"。
    string addr = 1;
    // WebSocket 路径，默认 "/ws"。
    string path = 2;
    TLS tls = 3;
  }

  // TCP 传输层。
  message Tcp {
    // 报文字段（uint32 类型头）的字节序。只作用于本 server 实例：
    // 同进程的多台 tcp server 可各用各的，不再共享包级默认。
    enum ByteOrder {
      // 小端——与历史包级默认一致，缺省即此档。
      BYTE_ORDER_UNSPECIFIED = 0;
      LITTLE = 1;
      BIG = 2;
    }

    // 监听地址，如 ":9000"。
    string addr = 1;
    TLS tls = 2;
    ByteOrder byte_order = 3;
  }

  // UDP 传输层。
  message Udp {
    // 监听地址，如 ":9000"。
    string addr = 1;
  }

  // KCP 传输层（基于 UDP 的可靠传输）。
  message Kcp {
    // 监听地址，如 ":9000"。
    string addr = 1;
    // 加密密码。
    string block_crypt_password = 2;
    // 加密盐值。
    string block_crypt_salt = 3;
    // 前向纠错数据分片数。
    int32 data_shards = 4;
    // 前向纠错校验分片数。
    int32 parity_shards = 5;
  }

  // Thrift RPC 传输层。
  message Thrift {
    // 监听地址，如 ":7700"。
    string addr = 1;
    // 协议类型：binary / compact / json。默认 binary。
    string protocol = 2;
    // 是否启用缓冲传输。
    bool buffered = 3;
    // 是否启用帧传输。
    bool framed = 4;
    // 缓冲区大小（字节），默认 8192。
    int32 buffer_size = 5;
    TLS tls = 6;
  }

  // tRPC 传输层（腾讯 tRPC 框架）。
  message Trpc {
    // 监听地址。
    string addr = 1;
  }

  // WebTransport 传输层（基于 HTTP/3）。
  message Webtransport {
    // 监听地址，如 ":443"。
    string addr = 1;
    TLS tls = 2;
  }

  // Cron 定时任务调度器。
  //
  // 布尔字段用 optional 表达三态：未设置（nil）→ 用实现默认值；显式
  // false/true → 覆盖。**不能**用普通 bool——proto3 零值为 false，而
  // cron 实现默认启用秒级，空段会导致「配了 cron: {} 反而关掉秒级」的
  // 反向行为（D11 的镜像陷阱：配了无效 → 配了反向生效）。
  message Cron {
    // 是否启用秒级精度（6 字段表达式）。未设置 → 实现默认（启用）。
    optional bool seconds = 1;
    // 是否启用优雅关闭（Stop 等待运行中任务完成）。未设置 → 实现默认（启用）。
    optional bool gracefully_shutdown = 2;
    // 调度器时区（如 "Asia/Shanghai"）。留空使用本地时区。
    string location = 3;
  }

  // 高精度定时器。
  message Hptimer {
    // 是否优雅关闭。默认 false。
    bool gracefully_shutdown = 1;
  }

  // MCP (Model Context Protocol) 传输层。
  message Mcp {
    // 服务名称。
    string name = 1;
    // 服务版本。
    string version = 2;
    // 监听地址。
    string address = 3;
  }

  // SignalR 传输层。
  message Signalr {
    // 监听地址，如 ":8080"。
    string addr = 1;
    // 网络类型，如 "tcp"。
    string network = 2;
    TLS tls = 3;
    // 编解码器：json / proto。
    string codec = 4;
  }

  // Socket.IO 传输层。
  message Socketio {
    // 监听地址，如 ":8080"。
    string addr = 1;
    // 网络类型，如 "tcp"。
    string network = 2;
    TLS tls = 3;
    // 编解码器：json / proto。
    string codec = 4;
    // Socket.IO 路径，默认 "/socket.io/"。
    string path = 5;
  }

  // WebRTC 传输层。
  message Webrtc {
    // 监听地址，如 ":8080"。
    string addr = 1;
    // 网络类型，如 "tcp"。
    string network = 2;
    TLS tls = 3;
    // 编解码器。
    string codec = 4;
    // WebSocket 路径。
    string path = 5;
  }

  // Asynq 任务队列（基于 Redis）。
  //
  // 布尔字段用 optional 表达三态（同 message Cron 的理由）；concurrency /
  // shutdown_timeout_ms 用 0 表示「未设置 → 用实现默认」（有符号数域内 0
  // 非合法配置值，故可作哨兵）。
  message Asynq {
    // Redis 连接地址。
    string redis_address = 1;
    string redis_password = 2;
    int32 redis_db = 3;
    // 并发消费的 worker 数量。0 = 未设置（用 asynq 实现默认）。
    int32 concurrency = 4;
    // 消费队列名列表（按优先级从高到低）。为空使用 asynq 默认队列。
    repeated string queues = 5;
    // 载荷编解码器名（如 "json"、"msgpack"）。留空默认 json。
    string codec = 6;
    // 是否对多队列启用严格优先级（否则加权轮询）。未设置 → 实现默认。
    optional bool strict_priority = 7;
    // 优雅关闭超时（毫秒）。0 = 未设置（用实现默认）。
    int64 shutdown_timeout_ms = 8;
    // 是否启用优雅关闭。未设置 → 实现默认。
    optional bool gracefully_shutdown = 9;
    // 是否启用定时调度器（crontab 式周期任务）。未设置 → 实现默认（启用）。
    optional bool scheduler_enabled = 10;
  }

  // Machinery 分布式任务队列。
  message Machinery {
    // Broker 地址。
    string broker_address = 1;
    // Result backend 地址。
    string result_backend_address = 2;
    // Broker 类型：redis / amqp / sqs。默认 redis。
    string broker_type = 3;
    // DB 编号（用于 Redis）。
    int32 db = 4;
  }

  optional Http http = 1;
  optional Http3 http3 = 2;
  optional Grpc grpc = 3;
  optional Graphql graphql = 4;
  optional Sse sse = 5;
  optional Websocket websocket = 6;
  optional Tcp tcp = 7;
  optional Udp udp = 8;
  optional Kcp kcp = 9;
  optional Thrift thrift = 10;
  optional Trpc trpc = 11;
  optional Webtransport webtransport = 12;
  optional Cron cron = 13;
  optional Hptimer hptimer = 14;
  optional Mcp mcp = 15;
  optional Signalr signalr = 16;
  optional Socketio socketio = 17;
  optional Webrtc webrtc = 18;
  optional Asynq asynq = 19;
  optional Machinery machinery = 20;

  // Kafka 消息队列 Server。
  message Kafka {
    // Broker 地址列表。
    repeated string addrs = 1;
    // 编解码器：json / proto。
    string codec = 2;
  }

  // RabbitMQ 消息队列 Server。
  message Rabbitmq {
    // Broker 地址列表。
    repeated string addrs = 1;
    // 编解码器：json / proto。
    string codec = 2;
  }

  // Redis 消息队列 Server。
  message RedisServer {
    // Redis 地址。
    string addr = 1;
    // 编解码器：json / proto。
    string codec = 2;
  }

  // NATS 消息队列 Server。
  message Nats {
    // Broker 地址列表。
    repeated string addrs = 1;
    // 编解码器：json / proto。
    string codec = 2;
  }

  // MQTT 消息队列 Server。
  message Mqtt {
    // Broker 地址列表。
    repeated string addrs = 1;
    // 编解码器：json / proto。
    string codec = 2;
  }

  // Pulsar 消息队列 Server。
  message Pulsar {
    // Broker 地址列表。
    repeated string addrs = 1;
    // 编解码器：json / proto。
    string codec = 2;
  }

  // ActiveMQ 消息队列 Server。
  message Activemq {
    // Broker 地址列表。
    repeated string addrs = 1;
    // 编解码器：json / proto。
    string codec = 2;
  }

  // Azure Service Bus 消息队列 Server。
  message Azuresb {
    // 连接字符串。
    string connection_string = 1;
    // 编解码器：json / proto。
    string codec = 2;
  }

  // NSQ 消息队列 Server。
  message Nsq {
    // NSQd 地址列表。
    repeated string addrs = 1;
    // Lookupd 地址列表。
    repeated string lookupd_addrs = 2;
    // 编解码器：json / proto。
    string codec = 3;
  }

  // RocketMQ 消息队列 Server。
  message Rocketmq {
    // NameServer 地址列表。
    repeated string name_server_addrs = 1;
    // 编解码器：json / proto。
    string codec = 2;
    // 驱动类型：v2 / v5 / aliyun。默认 v5。
    string driver_type = 3;
  }

  // SQS 消息队列 Server。
  message Sqs {
    // AWS 区域。
    string region = 1;
    // SQS 端点。
    string endpoint = 2;
    // 队列 URL。
    string queue_url = 3;
    // 编解码器：json / proto。
    string codec = 4;
  }

  optional Kafka kafka = 21;
  optional Rabbitmq rabbitmq = 22;
  optional RedisServer redis_server = 23;
  optional Nats nats = 24;
  optional Mqtt mqtt = 25;
  optional Pulsar pulsar = 26;
  optional Activemq activemq = 27;
  optional Azuresb azuresb = 28;
  optional Nsq nsq = 29;
  optional Rocketmq rocketmq = 30;
  optional Sqs sqs = 31;

  // grpc-gateway REST 转码面（独立端口）。
  //
  // 与 server.http.driver = "grpc-gateway" 的区别：后者是「同一端口二选一」
  // 模式（HTTP 端口即转码面）；本段描述「独立转码面与主 HTTP/gin 面并存」的
  // 拓扑——gateway 监听自己的 addr，连到 backend_grpc_addr 指向的 gRPC 服务。
  // 需要独立端口的场景用本段，而非 WithExtraServerFunc 逃生舱。
  message Gateway {
    // 网关监听地址，如 ":8081"。
    string addr = 1;
    // 后端 gRPC 服务地址（须可连接，不能是 ":0"）。留空使用 server.grpc.addr。
    //
    // 两种形态：host:port 直连（原生 dns 解析）；或 discovery:///<服务名>，
    // 由注册中心解析端点（transport/gateway 的 discovery resolver，段驱动装配
    // 自动取本次装配的注册中心，无需代码）。discovery:// 形态下若装配里没有
    // 注册中心、或其实现不含 registry.Discovery，Start 直接失败而不是静默回落。
    string backend_grpc_addr = 2;
    // TLS 配置。
    TLS tls = 3;
  }

  optional Gateway gateway = 32;

  // 统一中间件段（方案 S）：双协议一份声明。规则按 operation 选择器匹配
  // （Transporter.Operation()：gRPC 完整方法名或 "METHOD /路由模板"），命中的
  // 策略经统一链在**双面链头**生效——先于 server.http.middleware /
  // server.grpc.middleware 两个面段的中间件；统一链中间件短路时面段不执行。
  //
  // 本段只承载「双协议同形」的策略（recovery/request_id/rate_limit/
  // timeout_ctx/validate）：面特有的语义（HTTP 硬返回超时、CORS/安全头、
  // 熔断的面特有失败口径与 status_code）仍归属两面各自的 middleware 段。
  // 认证/授权/审计是代码依赖（Authenticator/Authorizer/Auditor 实例注入），
  // 不经本段配置——由 bundle 的构造器 Option 承载。
  //
  // 与两面段的关系是**叠加不是替代**：本段规则先执行，面段中间件随后；两面
  // 段在本段存在的部署里继续有效。语义冲突（如两面 timeout 与本段 timeout_ctx
  // 同时声明）按声明组合叠加——各管各的预算，不静默合并。
  message UnifiedMiddleware {
    // Rule 是一条路由级策略声明。
    message Rule {
      // operation 选择器：精确（"/pkg.Service/Method"、"GET /v1/x"）、前缀
      // （"/pkg.Service/*"、"GET /v1/admin/*"）、"*" 全部。前缀按声明长度
      // 降序匹配，长前缀优先。
      string selector = 1;

      oneof policy {
        // panic 兜底（统一 Recovery）。
        Recovery recovery = 2;
        // 请求 ID（统一 RequestID）。
        RequestId request_id = 3;
        // 限流（统一 RateLimit，快速失败口径；wait=true 平滑）。
        RateLimit rate_limit = 4;
        // ctx-deadline 语义超时（统一 Timeout）：双协议同形——只保证 handler
        // 拿到会到期的 ctx，不保证响应按时返回。与两面 timeout 段（HTTP 硬
        // 返回 / gRPC unary-only）语义都不同，字段名刻意区分。
        TimeoutCtx timeout = 5;
        // 请求校验（统一 Validator，回调注入）。
        Validate validate = 6;
      }
    }

    repeated Rule rules = 1;

    // Recovery 策略参数（统一 Recovery 无字段，占位保扩展）。
    message Recovery {}

    // RequestId 策略参数。
    message RequestId {
      // 请求 ID 头名，默认 X-Request-ID。
      optional string header_name = 1;
    }

    // RateLimit 策略参数（与两面 rate_limit 段同字段；配额独立于两面）。
    message RateLimit {
      // 每秒允许的请求数。
      double rate = 1;
      // 突发容量。
      int32 burst = 2;
      // 是否使用等待模式（平滑限流）。
      bool wait = 3;
    }

    // TimeoutCtx 策略参数。
    message TimeoutCtx {
      // 默认超时时间（毫秒）。已有 deadline 的调用原样放过。
      int64 default_timeout_ms = 1;
    }

    // Validate 策略参数（校验回调经 Validator 注入，占位保扩展）。
    message Validate {}
  }

  // 双协议一份声明的中间件段（见 UnifiedMiddleware 注释）。opt-in：段缺省
  // 时不挂统一链，两面段行为不变（现有部署零影响）。
  optional UnifiedMiddleware unified_middleware = 33;
}
