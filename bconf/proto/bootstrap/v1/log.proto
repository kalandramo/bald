syntax = "proto3";

package bootstrap.v1;

option go_package = "github.com/kalandramo/bald/bconf/gen/go/bootstrap/v1";

// Logger 描述日志系统配置。
message Logger {
  // 后端清单：至少一项。装配层逐项构造后经 log.MultiLogger 广播合并
  //（每条日志复制分流到全部后端）；任一项失败 fail-fast 并回滚已构造项。
  repeated Backend backends = 1;

  // 全局脱敏 key 清单：命中 key 的属性值统一替换为 ***（属性保留不丢弃）。
  // 覆盖调用参数、With 派生属性、ctx 属性流三类来源；全部后端统一生效
  //（合规需求宁全勿漏，不做按后端差异化——远端可检索平台恰是外泄风险
  // 最高处）。留空零开销直通。
  repeated string filter_keys = 2;

  // Backend 是一个后端声明：type 选后端 + 对应参数段。
  message Backend {
    string type = 1;

    // 本地日志库。
    optional Slog slog = 2;
    optional Charm charm = 3;
    // 远程/云端日志服务。
    optional Loki loki = 4;
    optional Sentry sentry = 5;
    optional Aliyun aliyun = 6;
    optional Tencent tencent = 7;
  }

  // Slog（Go 标准库）日志配置。
  message Slog {
    string level = 1;
    string format = 2;
    // 输出目标（单值便捷字段）：stdout / stderr 或文件路径。
    // output_paths 非空时优先生效；两者都空时装配层回退默认 stdout。
    string output_path = 3;
    // 多输出目标：同时写多个目标（如 stdout + 文件），复制分流（每目标收全量）。
    repeated string output_paths = 4;
    // 文件轮转配置（仅对文件路径目标生效）。
    Rotate rotate = 5;

    // Rotate 日志文件轮转配置（lumberjack）：按大小切割，按份数/天数清理，
    // 可选 gzip 压缩；不支持按时间（每日/每小时）切割。
    message Rotate {
      // 是否启用轮转；关闭时文件路径按 os.OpenFile 直写（不切割）。
      bool enabled = 1;
      // 单个日志文件最大体积（MB），超过即触发切割。默认 100；0 = 默认。
      int32 max_size = 2;
      // 保留的历史文件份数（不含当前）。默认 7；0 = 保留全部。
      int32 max_backups = 3;
      // 历史文件最长保留天数。默认 30；0 = 不按时间清理。
      int32 max_age = 4;
      // 是否对历史文件 gzip 压缩。默认 true。
      bool compress = 5;
    }
  }

  // Charm（Charmbracelet）日志配置。
  message Charm {
    string level = 1;
    string format = 2;
    string output_path = 3;
  }

  // Grafana Loki 日志配置。
  message Loki {
    // Loki HTTP Push 端点，如 http://loki:3100/loki/api/v1/push。
    string endpoint = 1;
    // 流标签，如 app=my-service, env=production。
    map<string, string> labels = 2;
    // 批量推送阈值（条数）。默认 100。
    int32 batch_size = 3;
    // HTTP 推送请求超时（毫秒），非定时冲刷间隔——缓冲仅按 batch_size
    // 触发冲刷与 Close 兑现尾批，无后台定时器。默认 5000。
    int32 flush_interval = 4;
  }

  // Sentry 日志配置。
  message Sentry {
    // Sentry 项目 DSN。
    string dsn = 1;
    // 运行环境标签，如 production / staging / development。
    string environment = 2;
    // 发布版本标签，如 myapp@1.0.0。
    string release = 3;
    // 服务器名称标签。
    string server_name = 4;
  }

  // 阿里云 SLS 日志配置。
  message Aliyun {
    // SLS Endpoint，如 cn-hangzhou.log.aliyuncs.com。
    string endpoint = 1;
    // Project 名称。
    string project = 2;
    // Logstore 名称。
    string logstore = 3;
    // AccessKey ID。
    string access_key = 4;
    // AccessKey Secret。
    string access_secret = 5;
    // Security Token（STS 临时凭证）。
    string security_token = 6;
  }

  // 腾讯云 CLS 日志配置。
  message Tencent {
    // CLS Endpoint。
    string endpoint = 1;
    // 日志主题 ID。
    string topic_id = 2;
    // AccessKey ID。
    string access_key = 3;
    // AccessKey Secret。
    string access_secret = 4;
  }
}
