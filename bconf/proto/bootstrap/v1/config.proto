syntax = "proto3";

package bootstrap.v1;

option go_package = "github.com/kalandramo/bald/bconf/gen/go/bootstrap/v1";

// Config 描述配置中心来源。
// 配置可以混合使用，同一 Config 中可同时设置多种配置源。
//
// 2026-09-05 瘦身：移除未实现 provider 的死源（fs/redis/zookeeper/vault/
// oss/polaris，字段号 2/8/9/10/13/14 已 reserved 防复用）。fs 源的 fsys 是
// 编译期资源无法经契约表达（bconfig/fs 走代码 API）；redis/zookeeper/vault/
// oss/polaris 后续按需实现时以新字段号追加。
message Config {
  // 文件配置源。
  message File {
    // 配置文件路径。
    string path = 1;
    // 文件格式：json / yaml / toml。留空则按扩展名推断。
    string format = 2;
    // 是否启用文件变更监听（基于 fsnotify）。
    bool watch = 3;
  }

  // Etcd 配置源。
  message Etcd {
    repeated string endpoints = 1;
    // 配置键路径。
    string path = 2;
    string username = 3;
    string password = 4;
    // 是否使用前缀模式（监听一个目录而非单个键）。
    bool prefix = 5;
  }

  // Nacos 配置源。
  message Nacos {
    repeated string server_addrs = 1;
    string namespace = 2;
    string group = 3;
    string data_id = 4;
    string format = 5;
  }

  // Consul 配置源。
  message Consul {
    string address = 1;
    // 配置键路径。
    string path = 2;
    string token = 3;
    string scheme = 4;
  }

  // Apollo 配置源。
  message Apollo {
    string app_id = 1;
    string cluster = 2;
    // Apollo 命名空间名称。
    string namespace = 3;
    // 预留： Apollo 配置中心 IP（endpoint 优先）。
    string ip = 4;
    // Apollo 配置中心地址。
    string endpoint = 5;
    // 应用密钥。
    string secret = 6;
    // 是否备份配置到本地。
    bool is_backup_config = 7;
    // 本地备份路径。
    string backup_path = 8;
    // 结构化命名空间（yaml/yml/json）返回原始文档（推荐整文档消费开启）。
    bool original_config = 9;
  }

  // Kubernetes ConfigMap 配置源。
  message Kubernetes {
    string namespace = 1;
    string config_map_name = 2;
    string key = 3;
    // 标签选择器，如 app=test。
    string label_selector = 4;
    // 字段选择器。
    string field_selector = 5;
    // KubeConfig 文件路径（集群外使用）。
    string kube_config = 6;
    // Master URL。
    string master = 7;
  }

  // HTTP 配置源。
  message Http {
    string url = 1;
    string method = 2;
    map<string, string> headers = 3;
    string format = 4;
    // 轮询间隔（毫秒）。默认 30000。使用 ETag 条件请求优化。
    int32 poll_interval = 5;
  }

  // Vault 配置源（KV v1/v2）。
  message Vault {
    // 服务地址；空则回退 VAULT_ADDR 环境变量或本机默认。
    string address = 1;
    // 认证 token；空则回退 VAULT_TOKEN 环境变量。
    string token = 2;
    // secret 路径（如 secret/data/myapp/config）。
    string path = 3;
    // secret Data 中承载原始配置的字段名（默认 content）。
    string data_key = 4;
    // 轮询间隔（毫秒）。Vault 无原生推送，默认 30000。
    int32 poll_interval = 5;
  }

  // 环境变量配置源。
  message Env {
    // 环境变量前缀，如 "APP_"。
    string prefix = 1;
    // 环境变量分隔符。
    string separator = 2;
    // 默认环境变量名。
    string key = 3;
  }

  // 2026-09-05 瘦身：fs/redis/zookeeper/oss/polaris 无 provider 实现且暂无
  // 接入计划（字段号 2/8/9/13/14 reserved 防复用）。fs 源的 fsys 是编译期
  // 资源无法经契约表达（bconfig/fs 走代码 API）；其余按需实现时以新字段号追加。
  reserved 2, 8, 9, 13, 14;
  reserved "fs", "redis", "zookeeper", "oss", "polaris";

  optional File file = 1;
  optional Etcd etcd = 3;
  optional Nacos nacos = 4;
  optional Consul consul = 5;
  optional Apollo apollo = 6;
  optional Kubernetes kubernetes = 7;
  optional Vault vault = 10;
  optional Http http = 11;
  optional Env env = 12;
}
