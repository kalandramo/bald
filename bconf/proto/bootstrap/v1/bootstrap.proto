syntax = "proto3";

package bootstrap.v1;

import "bootstrap/v1/app.proto";
import "bootstrap/v1/server.proto";
import "bootstrap/v1/config.proto";
import "bootstrap/v1/registry.proto";
import "bootstrap/v1/log.proto";
import "bootstrap/v1/tracer.proto";
import "bootstrap/v1/metrics.proto";
import "bootstrap/v1/broker.proto";
import "bootstrap/v1/storage.proto";
import "bootstrap/v1/workflow.proto";
import "bootstrap/v1/cache.proto";
import "bootstrap/v1/script.proto";
import "bootstrap/v1/database.proto";
import "bootstrap/v1/audit.proto";
import "bootstrap/v1/instrumentation.proto";
import "bootstrap/v1/client.proto";

option go_package = "github.com/kalandramo/bald/bconf/gen/go/bootstrap/v1";

// BootstrapConfig 是应用的顶层配置契约，
// 声明式描述一个应用的完整拓扑：传输层、配置中心、注册中心、日志、追踪、指标、消息代理。
// 装配层把它解码为各契约段（server/config/registry/...）后交给段驱动 Provider 消费。
message BootstrapConfig {
  // 应用元数据。
  App app = 1;

  // 传输层，支持通过 optional 字段同时配置多种传输协议。
  Server server = 2;

  // 配置中心，支持通过 optional 字段同时配置多种配置源（混合配置）。
  Config config = 3;

  // 服务注册发现。
  Registry registry = 4;

  // 日志系统。
  Logger logger = 5;

  // 分布式追踪。
  Tracer tracer = 6;

  // 指标监控。
  Metrics metrics = 7;

  // 消息代理，支持通过 optional 字段同时配置多种消息中间件。
  Broker broker = 8;

  // 对象存储，支持 MinIO / S3。
  Storage storage = 9;

  // ai 段已随 ai/{openai,langchaingo,eino} 模块整体下线（2026-11）。字段号 10 与
  // 段名双双保留，禁止复用——历史配置里的 ai 段不得被新字段静默解释。
  reserved 10;
  reserved "ai";

  // 工作流引擎，支持 Temporal / Argo / Conductor / GoWorkflows。
  Workflow workflow = 11;

  // 缓存，支持 Local（内存）/ Redis。
  Cache cache = 12;

  // 脚本引擎，支持 Lua / JavaScript / Python / CEL / Expr 等。
  Script script = 13;

  // 数据库，支持 GORM / MongoDB / ClickHouse / Doris / ES / OpenSearch / InfluxDB / Cassandra。
  Database database = 14;

  // 审计后端：log（结构化日志）/ store（落库）/ stream（Redis Stream）。
  Audit audit = 15;

  // 传输级埋点后端：prometheus / otlp / datadog（metrics.Metrics 三原语）。
  // 与 metrics 段的分工见 instrumentation.proto——那个是请求级 Recorder，
  // 这个是 TCP/MQ 这类无「请求」概念路径的手工埋点。
  Instrumentation instrumentation = 16;

  // 出站连接：按名字声明本进程要连的外部服务（grpc / http）。
  // 与 server 段对称——契约写地址，业务按名字取连接，代码里不出现地址字面量。
  Client client = 17;
}
