syntax = "proto3";

package bald.appspec.v1;

import "bootstrap/v1/bootstrap.proto";

option go_package = "github.com/kalandramo/bald/bconf/gen/go/bald/appspec/v1;appspecv1";

// AppSpec 是 bald 应用的「声明式拓扑方言」：用一个 proto message
// 描述一个微服务的装配形态——开通哪些 server、挂载哪些组件、声明哪些能力依赖、
// 启用哪些审计后端。代码生成器（gen app --spec）读取 AppSpec，据此吐出目标
// 目录树（D2-target-codegen.md §2.1）。
//
// 唯一真相源纪律：框架契约段的真相源是
// bootstrap.v1.BootstrapConfig（字段 7），AppSpec 不复制它的字段。旧快捷
// 方式 server / audit_backends / bundle_normalized（字段 2/5/6）已移除
// （Q6）——传输面与审计后端必须声明在 bootstrap 段，归一化与双真相源
// 校验随之删除；字段号与名字永久保留，禁止复用。
message AppSpec {
  reserved 2, 5, 6;
  reserved "server", "audit_backends", "bundle_normalized";

  // 应用元信息（生成代码的标识；契约 app.name 缺省取 meta.name）。
  AppMeta meta = 1;

  // 挂载的组件（生命周期受 C1 五阶段停机管理）。
  repeated ComponentSpec components = 3;

  // 能力依赖（S1 启动期 fail-fast 校验；生成期 Gate1 先校验 requires⊆provides）。
  CapabilitySpec capability = 4;

  // 框架契约段：唯一真相源 = bconf（15 段一次带入，不复制字段）。生成物
  // configs/<app>.yaml 由本段经 protoreflect 派生——加一个 bconf 段 = 0 处
  // 生成器改动（D2 §3.4）。
  bootstrap.v1.BootstrapConfig bootstrap = 7;

  // 生成期布局声明（输出根 / apiserver 目录 / Gate3 开关）。
  LayoutSpec layout = 8;

  // 装配期 bundle 声明（bundle 是装配期概念不是契约段，故不在 bootstrap）。
  BundleSpec bundle = 9;

  // 显式域清单（域声明值经生成物 domains.gen.go 变参直传
  // MustServe；name 唯一由 Gate1 校验）。
  repeated DomainSpec domains = 10;

  // 构建期变体声明（Q7）：每个变体声明一条 Go 构建约束表达式与命中时的
  // 装配增量；生成物把声明恒投影进计划（未命中也可审计），命中由 appkit
  // 按当前二进制实际的构建约束求值，增量成为普通计划实体（不再产 ambient
  // 诊断）。
  repeated Variant variants = 11;
}

// Variant 声明一个构建期变体（build tag 分叉进声明）。
message Variant {
  // 变体名（全应用唯一；须匹配 ^[a-z][a-z0-9_]*$——生成物用它命名实现
  // 文件 variant_<name>.gen.go，诊断 Subject 为 "variant:<name>"）。
  string name = 1;
  // 生效所需的 build tag（全部满足才命中）。迁移糖：与 when 互斥，等价于
  // 用 && 连接；新声明请直接写 when。
  repeated string build_tags = 2;
  // 人读说明（进声明面 Detail；为空时生成器给默认说明）。
  string description = 3;
  // 生效条件：Go 构建约束表达式（`//go:build` 行语法，如
  // "grpcgw && !nacos"）。与 build_tags 互斥、二者必须声明一个；Gate1
  // 用 go/build/constraint 同一解析器校验，命中判据与 go build 同源。
  string when = 4;
  // 命中时的装配增量（声明式数据；未命中也随声明进计划，供 --plan/doctor
  // 审计「命中会加什么」）。生成物把它投影为 appkit.VariantEffect，并按
  // components 逐项在 //go:build 文件里生成实现——声明与实现同一真相源。
  VariantEffect effects = 5;
}

// VariantEffect 是变体命中时的装配增量。组件与契约补丁是纯数据；REST
// 路由的实现是闭包（WrapHTTP），不在 AppSpec 声明面——命中路由由手写
// VariantImpl 提供，appkit 在计划期做声明/实现对账（I12）。
message VariantEffect {
  // 变体新增的托管组件。kind 与全局 components 共用白名单；name 跨全局
  // 与所有变体唯一（component.<name> 是计划节点身份）。
  repeated ComponentSpec components = 1;
  // 变体对 bootstrap 契约的改写：点路径 + 字符串值。路径必须指向契约里
  // 已存在的字符串字段；覆盖非空值须给 reason（appkit 计划期校验）。
  repeated VariantPatch patches = 2;
}

// VariantPatch 是变体对 bootstrap 契约单字段的改写。
message VariantPatch {
  // 契约字段点路径（如 "app.env"）；须在 bootstrap schema 里可解析。
  string path = 1;
  // 目标值（被改写字段必须是 string）。
  string value = 2;
  // 覆盖非空现有值时的理由（进 variant-patch 诊断；填空值可省略）。
  string reason = 3;
}

// LayoutSpec 声明生成期布局。
message LayoutSpec {
  // 产出根目录（gen app 相对它落盘），默认 "."。
  string root = 1;
  // apiserver 目录名（internal/<apiserver_dir>），默认 "apiserver"。
  string apiserver_dir = 2;
  // 生成物是否 emit appkit.StrictContract（Gate3 运行期契约门）。
  // 默认 true（proto3 optional 保 presence：未声明 = true，显式 false 才关闭）。
  optional bool strict_contract = 3;
}

// BundleSpec 声明装配期 bundle（P10 横切链；P9 归一化）。链序由框架固化、
// 无显式覆盖 API，故本消息只保留有消费者的字段（YAGNI——声明面不允许
// 无消费者字段，见 internal/codegen 的字段消费机器守卫）。
message BundleSpec {
  // 是否启用归一化（audit object/action 双传输同源）。
  bool normalized = 1;
}

// DomainSpec 声明一个业务域（域清单进 AppSpec）。
message DomainSpec {
  // 域名（全应用唯一；域装配次序 = 声明序）。
  string name = 1;
  // 域的 proto 包名（如 "greet.v1"）。
  string proto_package = 2;
  // 域的 gRPC service 全名（如 "greet.v1.GreetService"；gen domain
  // 校验其与实际 proto 匹配并派生路由/授权策略）。
  string service = 3;
  // 域模型文件（如 "internal/apiserver/model/greet.go"）。
  string model = 4;
  // 域声明值所在的 Go import 路径（该包须导出 appkit.Domain 值，
  // 对照 _example/bald/domains.gen.go）。
  string go_package = 5;
}

// AppMeta 生成代码的标识信息。
message AppMeta {
  // 应用/命令名（如 go-bald-admin），决定 cmd/<name>/main.go 路径与包名。
  string name = 1;
  // Go module 路径（如 github.com/you/app），生成文件 import 前缀。
  string module = 2;
  // 服务中文/英文短描述，落在 command.go 的 Short 与文件头注释。
  string desc = 3;
  // 角色划分（多角色部署：api / runner 各起一个进程）。为空 = 单角色，
  // 生成器走既有单 cmd/ 路径（零迁移）；非空时 Gate1 校验角色名唯一、
  // 各角色 domains 并集等于 domains 全集。
  repeated RoleSpec roles = 4;
}

// RoleSpec 声明一个进程角色（元素类型紧跟引用者，同 Requirement 的约定）。
message RoleSpec {
  // 角色名（api | runner）：决定 cmd/<meta.name>-<role>/main.go 与
  // configs/<app>-<role>.yaml 的命名；非空且在全应用唯一。
  string name = 1;
  // 该角色承载的业务域（引用 AppSpec.domains[].name）。所有角色的并集
  // 必须恰好等于 domains 全集——缺域 = 有域无人服务，多域 = 引用了不存在的域。
  repeated string domains = 2;
  // 该角色的传输面：configs/<app>-<role>.yaml 的 server 段依据（runner
  // 通常不开 HTTP/gRPC 面）。
  ServerSpec server = 3;
}

// ServerSpec 声明一个角色的传输面（RoleSpec.server）。单角色或未声明
// 角色时传输面由 bootstrap.server 派生；多角色时本段覆盖该角色
// configs/<app>-<role>.yaml 的 server 段投影（空 ServerSpec = 该角色不
// 开任何传输面）。
message ServerSpec {
  // 是否开通 HTTP。
  bool http = 1;
  // 是否开通 gRPC。
  bool grpc = 2;
  // 是否开通 gRPC-Gateway（REST transcoding）。投影 = 该角色
  // server.http.driver == "grpc-gateway"（同端口单面）。
  bool gateway = 3;
  // HTTP 监听地址。
  string http_addr = 4;
  // gRPC 监听地址。
  string grpc_addr = 5;
}

// ComponentSpec 声明一个托管组件。
message ComponentSpec {
  // 组件类型；生成器据此挑选对应组件工厂。
  // 取值 = Gate1 白名单（生成器已实现工厂的 kind 集合）：heartbeat。
  // 其余 kind 生成期即报错（此前 db/redis/... 到运行期才炸 unknown kind）。
  string kind = 1;
  // 组件名（写入 ReconcileCtx/Registry 的标识，须唯一）。
  string name = 2;
  // 组件所需的配置键前缀（组件工厂消费，落到组件自身的配置读取）。
  string config_prefix = 3;
  // 组件工厂参数（k/v 原样透传给组件工厂，声明面不再有未消费字段）。
  map<string, string> params = 4;
}

// CapabilitySpec 声明能力依赖（S1 Provides/Requires 校验源）。
message CapabilitySpec {
  // 应用对外提供的能力（Provides）。
  repeated string provides = 1;
  // 组件对能力的依赖声明（Requires(component, caps...) 的 proto 对应）。
  // 注意：requires 是「组件声明依赖」，不是扁平能力名——否则无法表达
  // 「audit.store 需要 db」的归属关系。
  repeated Requirement requires = 2;
}

// Requirement 一个组件对能力的依赖声明。
message Requirement {
  // 依赖方组件标识（如 "audit.store"），用于缺失时定位。
  string component = 1;
  // 依赖的能力列表（须被 Provides 覆盖，否则生成期 Gate1 / 启动期 S1 fail-fast）。
  repeated string caps = 2;
}