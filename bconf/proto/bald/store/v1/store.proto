syntax = "proto3";

package bald.store.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/kalandramo/bald/bconf/gen/go/bald/store/v1";

// ---------------------------------------------------------------------------
// 存储层契约：分页 / 过滤 / 排序（单一真相源）。
//
// 形状以 bald-crud 的 pagination/v1 为准（彻底归一：bald-crud 引擎层直接依赖
// 本契约），剥离 gnostic OpenAPI 注解，仅依赖 protobuf WKT。
//
// 安全规约（服务端必须遵守）：
//   1. 过滤/排序的字段名必须经白名单校验后再翻译为查询语句，禁止直接拼接。
//   2. 值一律参数化绑定，杜绝字符串拼接 SQL。
//   3. 分页参数设置合理上限（最大页大小、最大偏移量），防恶意大页请求。
//   4. 复杂过滤表达式（filter_expr）优先于字符串 DSL（query/filter）；
//      字符串 DSL 仅作为前端便捷通道，服务端必须严格校验。
//   5. 排序规则建议必传，确保分页结果稳定。
// ---------------------------------------------------------------------------

// 排序规则（分页场景通常需配合排序保证结果稳定）。
message Sorting {
  // 排序方向（ASC/DESC，默认ASC）
  enum Direction {
    ASC = 0;  // 升序
    DESC = 1; // 降序
  }

  // 排序字段（如"id"、"create_time"）
  string field = 1;

  // 排序方向
  Direction direction = 2;
}

// 过滤操作符（覆盖常见 SQL / NoSQL 语义）。
enum Operator {
  // 未指定
  OPERATOR_UNSPECIFIED = 0;

  // 基本比较
  EQ = 1;        // =
  NEQ = 2;       // !=
  GT = 3;        // >
  GTE = 4;       // >=
  LT = 5;        // <
  LTE = 6;       // <=

  // 模糊 / 大小写不敏感模糊 / 非模糊
  LIKE = 7;      // SQL LIKE
  ILIKE = 8;     // 大小写不敏感的 LIKE（如 Postgres ILIKE）
  NOT_LIKE = 9;  // NOT LIKE

  // 集合操作
  IN = 10;       // IN (v1, v2, ...)
  NIN = 11;      // NOT IN

  // 空值判断
  IS_NULL = 12;      // IS NULL
  IS_NOT_NULL = 13;  // IS NOT NULL

  // 范围与正则
  BETWEEN = 14;   // BETWEEN a AND b（或服务端映射为 >=a AND <=b）
  REGEXP = 15;    // 正则匹配（DB/引擎支持）
  IREGEXP = 16;   // 不区分大小写的正则匹配

  // 语义化的字符串操作
  CONTAINS = 17;     // 包含（等价于 LIKE %v%）
  STARTS_WITH = 18;  // 前缀（等价于 LIKE v%）
  ENDS_WITH = 19;    // 后缀（等价于 LIKE %v）
  ICONTAINS = 20;    // 不区分大小写的包含
  ISTARTS_WITH = 21; // 不区分大小写的前缀匹配
  IENDS_WITH = 22;   // 不区分大小写的后缀匹配

  // JSON / 数组 / 集合相关（按需在服务端映射为具体 DB 运算）
  JSON_CONTAINS = 23;   // JSON 包含（如 Postgres/ MySQL 的 JSON 包含）
  ARRAY_CONTAINS = 24;  // 数组包含某元素
  EXISTS = 25;          // 子查询 / 存在性（按需实现）

  // 全文检索与精确匹配
  SEARCH = 26;   // 全文搜索（服务端按需实现）
  EXACT = 27;    // 精确匹配（完全相等）
  IEXACT = 28;   // 不区分大小写的精确匹配
}

// 日期时间部分枚举。
enum DatePart {
  DATE_PART_UNSPECIFIED = 0;

  DATE = 1;         // 日期
  YEAR = 2;         // 年
  ISO_YEAR = 3;     // ISO 8601 年
  QUARTER = 4;      // 季度
  MONTH = 5;        // 月
  WEEK = 6;         // ISO 8601 周编号
  WEEK_DAY = 7;     // 星期几
  ISO_WEEK_DAY = 8; // ISO 8601 星期几
  DAY = 9;          // 日
  TIME = 10;        // 时间（小时:分钟:秒）
  HOUR = 11;        // 小时
  MINUTE = 12;      // 分钟
  SECOND = 13;      // 秒
  MICROSECOND = 14; // 微秒
}

// 单条过滤条件。
message FilterCondition {
  // 过滤字段名（DTO 字段名）
  string field = 1;

  // 过滤操作符
  Operator op = 2;

  oneof value_oneof {
    // 过滤值（单值）
    string value = 3;

    // 当需要使用非字符串类型的比较值（对象/数组/数字/布尔）时使用此字段，
    // 使用 google.protobuf.Value 能表达任意 JSON 值。
    google.protobuf.Value json_value = 7;
  }

  // 过滤值（多值，如IN操作符）
  repeated string values = 4;

  // 日期时间部分（可选，仅在字段为日期时间类型时使用）
  optional DatePart date_part = 5;

  // 当字段为 JSON/JSONB 类型时，可指定要抽取的子路径（例如: "meta.user.name" 或 JSONPath）
  // 服务端应把此路径用于 JSON_EXTRACT / -> 操作，再对抽取结果应用 op。
  optional string json_path = 6;
}

// 过滤表达式类型。
enum ExprType {
  EXPR_TYPE_UNSPECIFIED = 0;

  AND = 1;
  OR = 2;
}

// 过滤表达式（AND / OR 组合，可嵌套）。
//
// 语义规约（布尔代数）：
//   - AND 节点对 conditions 与 groups 求 AND；
//   - OR 节点对 conditions 与 groups 求 OR；
//   - 空 AND 节点为恒真，空 OR 节点为恒假（用于「禁止访问」类语义）。
message FilterExpr {
  // 过滤表达式类型
  ExprType type = 1;

  // 条件列表
  repeated FilterCondition conditions = 2;

  // 子表达式列表
  repeated FilterExpr groups = 3;
}

// 页码-页大小分页（Page-PageSize）。
message PageBasedPagination {
  // 当前页码（从1开始，默认1）
  uint32 page = 1 [json_name = "page"];

  // 每页条数（默认10，建议设置上限如100）
  uint32 page_size = 2 [json_name = "pageSize"];
}

// 偏移量-限制分页（Offset-Limit）。
message OffsetBasedPagination {
  // 跳过的记录数（从0开始，默认0）
  uint64 offset = 1 [json_name = "offset"];

  // 最多返回的记录数（默认10，建议设置上限如100）
  uint32 limit = 2 [json_name = "limit"];
}

// 令牌分页（Token-Based）。
message TokenBasedPagination {
  // 上一页最后一条记录的游标（如ID/时间戳+ID，首次请求为空）
  string token = 1 [json_name = "token"];

  // 每页条数（默认10，建议设置上限如100）
  uint32 page_size = 2 [json_name = "pageSize"];
}

// 不分页。
message NoPaging {}

// 分页通用请求（扁平风格：三类分页参数共存，由服务端按优先级择一）。
message PagingRequest {
  // 当前页码（从1开始，默认1）
  optional uint32 page = 1 [json_name = "page"];

  // 每页条数（默认10，建议设置上限如100）
  optional uint32 page_size = 2 [json_name = "pageSize"];

  // 跳过的记录数（从0开始，默认0）
  optional uint64 offset = 3 [json_name = "offset"];

  // 最多返回的记录数（默认10，建议设置上限如100）
  optional uint32 limit = 4 [json_name = "limit"];

  // 上一页最后一条记录的游标（如ID/时间戳+ID，首次请求为空）
  optional string token = 5 [json_name = "token"];

  // 是否不分页，如果为true，则page和pageSize参数无效。
  optional bool no_paging = 6 [json_name = "noPaging"];

  oneof filtering_type {
    // JSON字符串过滤条件，基础语法：{"field1":"val1", "field2___icontains":"val2"}。
    string query = 10 [json_name = "query"];

    // Google AIP规范字符串过滤条件。
    string filter = 11 [json_name = "filter"];

    // 复杂过滤表达式（优先使用）。服务端应以此为准并执行严格校验与参数化。
    FilterExpr filter_expr = 12 [json_name = "filterExpr"];
  }

  // 排序条件（"val1,-val2" 风格，- 前缀表示降序；与 sorting 二选一）
  optional string order_by = 20 [json_name = "orderBy"];

  // 排序规则
  repeated Sorting sorting = 21 [json_name = "sorting"];

  // 字段掩码，其作用为SELECT中的字段，其语法为使用逗号分隔字段名，例如：id,realName,userName。
  // 如果为空则选中所有字段，即SELECT *。
  optional google.protobuf.FieldMask field_mask = 30 [json_name = "fieldMask"];
}

// 分页响应元数据。
message PaginationResponseMeta {
  // 总记录数（仅Page/Offset分页有效，Token分页通常不返回总数）
  optional google.protobuf.UInt64Value total = 1 [json_name = "total"];

  // 总页数（仅Page分页有效）
  optional google.protobuf.UInt32Value total_pages = 2 [json_name = "totalPages"];

  // 当前页码（仅Page分页有效）
  optional google.protobuf.UInt32Value current_page = 3 [json_name = "currentPage"];

  // 当前偏移量（仅Offset分页有效）
  optional google.protobuf.UInt64Value current_offset = 4 [json_name = "currentOffset"];

  // 下一页令牌（仅Token分页有效，无更多数据时为空）
  optional string next_token = 5 [json_name = "next_token"];

  // 每页实际条数
  optional uint32 page_size = 6 [json_name = "pageSize"];

  // 当前页实际返回条数
  optional uint32 current_size = 7 [json_name = "currentSize"];
}

// 分页通用结果（items 为编码后的业务数据，实际业务建议替换为具体 message）。
message PagingResponse {
  // 总记录数
  optional google.protobuf.UInt64Value total = 1 [json_name = "total"];

  // 分页数据
  repeated bytes items = 2;
}

// 通用分页请求（oneof 风格：三类分页方式互斥，必须选其一）。
message PaginationRequest {
  // 分页类型（三种方式互斥，必须选其一）
  oneof pagination_type {
    // 基于页码的分页方式
    PageBasedPagination page_based = 1 [json_name = "pageBased"];

    // 基于偏移量的分页方式
    OffsetBasedPagination offset_based = 2 [json_name = "offsetBased"];

    // 基于令牌的分页方式
    TokenBasedPagination token_based = 3 [json_name = "tokenBased"];

    // 不分页
    NoPaging no_paging = 4 [json_name = "noPaging"];
  }

  oneof filtering_type {
    // JSON字符串过滤条件，基础语法：{"field1":"val1", "field2___icontains":"val2"}。
    string query = 10 [json_name = "query"];

    // Google AIP规范字符串过滤条件。
    string filter = 11 [json_name = "filter"];

    // 复杂过滤表达式（优先使用）。服务端应以此为准并执行严格校验与参数化。
    FilterExpr filter_expr = 12 [json_name = "filterExpr"];
  }

  // 排序条件（"val1,-val2" 风格，- 前缀表示降序；与 sorting 二选一）
  optional string order_by = 20 [json_name = "orderBy"];

  // 排序规则
  repeated Sorting sorting = 21 [json_name = "sorting"];

  // 字段掩码，其作用为SELECT中的字段，其语法为使用逗号分隔字段名。
  optional google.protobuf.FieldMask field_mask = 30 [json_name = "fieldMask"];
}

// 通用分页响应。
message PaginationResponse {
  // 分页元数据
  PaginationResponseMeta meta = 2;

  // 业务数据列表（示例用Any，实际业务需替换为具体message，如repeated User users = 1）
  repeated google.protobuf.Any data = 1;
}
