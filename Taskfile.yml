# bald 顶层构建入口（Taskfile 版，跨平台兼容 Windows/macOS/Linux）
#
# 替代原 Makefile，使用 go-task（https://taskfile.dev）。安装：
#   go install github.com/go-task/task/v3/cmd/task@latest
# 用法：
#   task help            列出全部任务
#   task verify          CI 全量验证
#   task example-e2e     运行 _example 的 REST+gRPC e2e 回归
#
# 说明：
# - 所有跨目录命令改用 `dir:` 字段而非 `cd`，避免 Windows cmd/pwsh 的 cd/shell 差异。
#   **`dir` 只能写在任务级**：go-task 不认 `cmds` 条目里的 `dir`（实测 3.52.0，
#   `- cmd: pwd` 配 `dir: sub` 打印的仍是任务目录）。写成 per-cmd 形式时它不报错，
#   只是静默按任务的目录跑——`go test ./...` 这类命令因此变成「把根 module 跑两遍」，
#   覆盖当场消失且全绿（§8 记的正是这一类）。跨目录一律拆成带 task 级 `dir`
#   的 internal 子任务，由 `task: <名字>` 调用。internal/docscheck 有一条闸门
#   （TestTaskfileNoPerCommandDir）盯住这个形状，防止再写回去。
# - 平台相关检测（如「命令是否在 PATH」）用 `task` 内置的 `sh`/`bash` 平台判定，
#   而非 Make 的 `@command -v`，从而 Windows 下也能跑。
# - 模块清单不在这里手写：`scripts/list-modules.sh` 是全仓唯一派生，CI
#   （.github/workflows/ci.yml）与本文件的 lint/vuln/race/verify 都消费它，
#   本地与 CI 的覆盖范围因此不会再漂移（§1.2）。派生需要 POSIX shell，
#   Windows 下这些 sweep 显式失败（不是静默跳过），逐模块请用
#   `task verify-module MOD=<dir>`。
# - protoc-gen-defaults 的版本 pin 在下方 vars.PROTOC_GEN_DEFAULTS_VERSION（唯一真相源；
#   升级时改这里，勿再散落 .bingo 之类的旁支文件）。

version: "3"

# B-iii（risk-review.md §3.4）：`cli/` 与 `bconf/` 的联合开发靠**本地不提交**的
# go.work（见 .gitignore）。这些任务代表 CI 口径，必须按「发布形态」判，所以在此
# 显式关掉工作区——否则一次 `go work use ./cli ./bconf` 就让 tidy/build/vet 全部
# 改吃磁盘代码，§3.3 那类 published-form 判据当场失效且不留痕迹。
# 仓库里没有 go.work 时 GOWORK=off 是无害 no-op；CI 的检出永远没有它。
env:
  GOWORK: "off"

vars:
  PROTOC_GEN_DEFAULTS_VERSION: v0.0.2 # protoc-gen-defaults pin（原 .bingo 记录的 commit pin 无效，已核实取 v0.0.2）
  GOLANGCI_LINT_VERSION: v2.15.0 # lint 规则集升级是显式动作，避免上游新检查静默漂移
  GOVULNCHECK_VERSION: v1.9.0
  ACTIONLINT_VERSION: v1.7.12 # 作业文件 schema/shellcheck 闸门（与 .github/workflows/workflow-lint.yml 的 pin 一致）
  # 全仓 module 清单（与 CI 同一条派生）。空格分隔便于 `for: { var: }`。
  MODULES:
    sh: sh scripts/list-modules.sh | tr '\n' ' '

# Windows 下用 pwsh，其余用 bash；命令缺省走 bash 即可，需 shell 特性时显式指定。
tasks:
  help:
    desc: 显示帮助
    cmds:
      - task --list

  tools-protoc-gen-defaults:
    desc: 确保 protoc-gen-defaults 在 PATH；缺失则按 pin 版本安装到 GOBIN
    cmds:
      - cmd: command -v protoc-gen-defaults >/dev/null 2>&1 || go install github.com/onexstack/protoc-gen-defaults@{{.PROTOC_GEN_DEFAULTS_VERSION}}
        platforms: [linux, darwin]
      - cmd: where protoc-gen-defaults >nul 2>nul || go install github.com/onexstack/protoc-gen-defaults@{{.PROTOC_GEN_DEFAULTS_VERSION}}
        platforms: [windows]

  tools:
    desc: 安装生成期工具链（protoc-gen-defaults 等）
    deps: [tools-protoc-gen-defaults]

  tools-golangci-lint:
    desc: 确保 golangci-lint 在 PATH；缺失则按 pin 版本安装到 GOBIN
    cmds:
      - cmd: command -v golangci-lint >/dev/null 2>&1 || go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        platforms: [linux, darwin]
      - cmd: where golangci-lint >nul 2>nul || go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        platforms: [windows]

  tools-govulncheck:
    desc: 确保 govulncheck 在 PATH；缺失则按 pin 版本安装到 GOBIN
    cmds:
      - cmd: command -v govulncheck >/dev/null 2>&1 || go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}
        platforms: [linux, darwin]
      - cmd: where govulncheck >nul 2>nul || go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}
        platforms: [windows]

  tools-actionlint:
    desc: 确保 actionlint 在 PATH；缺失则按 pin 版本安装到 GOBIN
    cmds:
      - cmd: command -v actionlint >/dev/null 2>&1 || go install github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}}
        platforms: [linux, darwin]
      - cmd: where actionlint >nul 2>nul || go install github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}}
        platforms: [windows]

  proto:
    desc: 生成全部 Protobuf 代码
    deps: [proto-contract]

  proto-contract:
    desc: 生成契约层代码（bconf/proto → bconf/gen/go；bootstrap 配置 + appspec + store 契约）
    dir: bconf
    cmds:
      - buf generate

  # BSR 远端插件的离线等价物：同一份 managed mode 配置，只把插件换成本机
  # protoc-gen-go。产物与入库 gen/go 逐字节一致（由 proto-contract-check 守住），
  # 无 BSR 登录也能复现/校验契约层生成。
  proto-contract-local:
    desc: 用本机 buf + protoc-gen-go 重新生成契约层（与 BSR 产物逐字节一致）
    dir: bconf
    cmds:
      - buf generate --template buf.gen.local.yaml

  proto-contract-check:
    desc: 校验契约层生成物与 proto 一致（工具链缺失时测试自动跳过）
    dir: bconf
    cmds:
      - go test . -run TestGeneratedMatchesProto -count=1

  bconf-verify:
    desc: bconf 契约层模块验证（build + vet + test；含生成物与 proto 一致性）
    dir: bconf
    cmds:
      - go build ./...
      - go vet ./...
      - go test ./...

  # 生成示例的 gRPC 服务代码（buf remote 插件：go / go-grpc / grpc-gateway）。
  # 与 _example/bald 的 `task proto` 等效，不再递归调用子 Makefile。
  proto-example:
    desc: 生成示例的 gRPC/gRPC-Gateway 服务代码（buf remote 插件）
    dir: _example/bald/api
    cmds:
      - cmd: buf dep update || true
        platforms: [linux, darwin]
      - cmd: (buf dep update || exit /b 0)
        platforms: [windows]
      - buf generate

  # ---------------------------------------------------------------------------
  # _example/bald 是独立 module（module github.com/kalandramo/bald/example/bald），
  # 且目录以下划线开头 —— Go 工具链会忽略它，因此核心 module 的
  # `go build ./...` / `go test ./...` / `go mod tidy` 都**不会**覆盖示例。
  # 这里提供显式任务供 CI 使用。检查用 `go vet`：`go build ./...` 会把每个
  # package main 的可执行文件写进源码目录。
  # ---------------------------------------------------------------------------

  example-tidy:
    desc: 整理示例模块依赖（重依赖只进该模块，不进核心）
    dir: _example/bald
    cmds:
      - go mod tidy

  example-bald-vet:
    desc: 静态检查 _example/bald（默认 tag，覆盖两个角色入口）
    dir: _example/bald
    cmds:
      - go vet ./...

  # grpcgw 路径需要 proto 生成产物（api/gen，已 gitignore），故先生成再检查。
  # 这是唯一能验证 register_grpcgw.go 的任务 —— 该文件带 build tag，平时不参与编译。
  example-bald-vet-grpcgw:
    desc: 静态检查 _example/bald（grpcgw tag，需 buf）
    deps: [proto-example]
    dir: _example/bald
    cmds:
      - go vet -tags grpcgw ./...

  # e2e：启动**真实的**应用（MustServe 装配，HTTP + gRPC + 校验链路），
  # 默认构建走生成的 REST 绑定（BindGreet），grpcgw 构建走网关转码面；
  # 两种形态共用同一套 gRPC 客户端用例与校验断言。
  # 这是长期保留的回归测试，改校验链路/proto 注解/拦截器接线后都应重跑。
  # 依赖 proto 生成产物，故 depend on proto-example。
  example-e2e:
    desc: 运行 _example 的 e2e 回归测试（默认 gin 绑定 + grpcgw 转码面）
    deps: [proto-example]
    dir: _example/bald
    cmds:
      - go test ./... -v
      - go test -tags grpcgw ./... -v

  # ---------------------------------------------------------------------------
  # cobramcp 是独立 module（github.com/kalandramo/bald/cobramcp，与 transport/mcp
  # 平级），其 examples/ 下另有 3 个独立 module（task / positional-args /
  # positional-args-mcp-server）。嵌套 module 不在根模块的 `go build ./...` /
  # `go test ./...` 范围内 —— 与 _example 同一个坑（见上），故这里显式给出入口；
  # 清单本身仍由 scripts/list-modules.sh 派生，CI 的同一条派生已覆盖它们。
  # ---------------------------------------------------------------------------

  cobramcp-build:
    desc: 编译 cobramcp 主模块（不含 examples）
    dir: cobramcp
    cmds:
      - go build ./...

  cobramcp-vet:
    desc: 静态检查 cobramcp 主模块（不含 examples）
    dir: cobramcp
    cmds:
      - go vet ./...

  cobramcp-test:
    desc: 运行 cobramcp 主模块测试（不含 examples）
    dir: cobramcp
    cmds:
      - go test ./...

  # 单示例 module 的验证走派生清单（与其余 module 同一条谓词），不再手写三个
  # 名字。**目录切换只能靠任务级 dir**：实测 Task 3.52 下「逐命令 dir」和
  # 「for 循环内的 dir」都会被静默忽略（命令会在 Taskfile 所在目录执行，看起来
  # 「通过」其实检查错了 module），故 verify-module 用 vars 传参 + 任务级 dir。
  cobramcp-example-verify:
    desc: 校验 cobramcp 的示例 module（派生 cobramcp/examples/ 下全部 module）
    cmds:
      - task: verify-scope
        vars: { PREFIX: cobramcp/examples }

  cobramcp-verify:
    desc: cobramcp 全量验证（主模块 + 3 个示例 module）
    deps: [cobramcp-build, cobramcp-vet, cobramcp-test, cobramcp-example-verify]

  # ---------------------------------------------------------------------------
  # 按目录前缀的验证组。清单同样从 scripts/list-modules.sh 派生（按前缀过滤），
  # 不再手写「根 + 各后端」的 module 名单——原来 broker-verify 少列一个后端、
  # encoding-verify 少列一个格式就会本地假绿（§1.2）。
  # 这些 module 不在根模块 `go build ./...` 范围内（嵌套独立 module，与 _example、
  # cobramcp 同一个坑），所以本地要么用这一组、要么直接 task verify-modules。
  # 注意 Task 3.52：跨目录只能用任务级 `dir:`（见 verify-module）。
  # ---------------------------------------------------------------------------

  verify-scope:
    desc: 验证指定目录前缀下的全部 module（PREFIX=<dir>，例：task verify-scope PREFIX=transport）
    vars:
      MODS:
        sh: sh scripts/list-modules.sh | grep -E '^\./{{.PREFIX | default ""}}(/|$)' | tr '\n' ' '
    cmds:
      - cmd: '[ -n "{{trim (.PREFIX | default "")}}" ] || { echo "verify-scope: 需要 PREFIX=<dir>，例：task verify-scope PREFIX=broker"; exit 1; }'
      # 前缀下派生为空 = 目录改名了或谓词被改坏，必须响而不是「通过」。
      - cmd: '[ -n "{{trim .MODS}}" ] || { echo "verify-scope: {{.PREFIX | default ""}} 下未派生出任何 module"; exit 1; }'
      - for: { var: MODS }
        task: verify-module
        vars:
          MOD: '{{.ITEM}}'

  retry-verify:
    desc: retry 全量验证（派生 retry/ 下全部 module）
    cmds:
      - task: verify-scope
        vars: { PREFIX: retry }

  encoding-verify:
    desc: encoding 全量验证（派生 encoding/ 下全部 module：根 + 各格式）
    cmds:
      - task: verify-scope
        vars: { PREFIX: encoding }

  ratelimit-verify:
    desc: ratelimit 全量验证（派生 ratelimit/ 下全部 module：根 + 各后端）
    cmds:
      - task: verify-scope
        vars: { PREFIX: ratelimit }

  broker-verify:
    desc: broker 全量验证（派生 broker/ 下全部 module：根 + 各后端）
    cmds:
      - task: verify-scope
        vars: { PREFIX: broker }

  circuitbreaker-verify:
    desc: circuitbreaker 全量验证（派生 circuitbreaker/ 下全部 module：根 + 各后端）
    cmds:
      - task: verify-scope
        vars: { PREFIX: circuitbreaker }

  test:
    desc: 运行根与 cli 两个 module 的全部测试（非 -short；全仓用 task verify-modules）
    cmds:
      - go test ./...
      # codegen/release 自 B-iii 起在 cli module 里：这条腿不能省，否则
      # 生成物端到端用例（TestTree_*）与发布工具测试在本任务里静默消失。
      - task: test-cli

  test-cli:
    internal: true
    desc: cli module 的全部测试（test 的跨目录腿）
    dir: cli
    cmds:
      - go test ./...

  # 静态检查与漏洞扫描：范围 = scripts/list-modules.sh 派生的全部 module，与 CI 的
  # lint/vuln 作业逐模块同口径（原来只跑核心 module，是 §1.2 的假绿来源之一）。
  # 只想要单模块的快速检查用 task lint-module MOD=<dir> / task vuln-module MOD=<dir>。
  lint:
    desc: golangci-lint 检查全部 module（与 CI lint 作业同范围；单模块用 task lint-module）
    deps: [tools-golangci-lint]
    vars:
      MODS: "{{.MODULES}}"
    cmds:
      - cmd: '[ -n "{{trim .MODS}}" ] || { echo "lint: 清单派生为空，未覆盖任何 module"; exit 1; }'
        platforms: [linux, darwin]
      # 派生要 POSIX shell。Windows 下显式失败，绝不能「跳过并打印 OK」。
      - cmd: 'echo "lint: 模块清单派生需要 POSIX shell；Windows 下逐模块跑 task lint-module MOD=<dir>"; exit 1'
        platforms: [windows]
      - for: { var: MODS }
        task: lint-module
        vars:
          MOD: '{{.ITEM}}'

  lint-module:
    desc: golangci-lint 检查单个 module（MOD=<dir>）
    dir: "{{.MOD}}"
    cmds:
      - golangci-lint run ./...

  # 作业文件自身的闸门（本地侧；CI 侧是 .github/workflows/workflow-lint.yml）。
  # GitHub 在编译期解析 .github/workflows/*.yml，未登记的键会让整个文件被拒且
  # 只报「workflow file issue、0 个 job」——通用 YAML 解析器看不出问题，所以
  # 这一层只能靠 actionlint 的 schema 校验。run 脚本的 shellcheck 结论只有本机
  # 装了 shellcheck 时才有（runner 预装，故 CI 侧口径更严）。
  ci-workflow-lint:
    desc: 校验 .github/workflows/*.yml 自身（schema；本机有 shellcheck 时连 run 脚本一起查）
    deps: [tools-actionlint]
    platforms: [linux, darwin]
    cmds:
      # 清单为空 = 闸门静默失效，必须响（与 lint/vuln/race 同一口径）。
      - cmd: 'files=$(find .github/workflows -type f \( -name "*.yml" -o -name "*.yaml" \) | sort); [ -n "$files" ] || { echo "ci-workflow-lint: 未发现作业文件，闸门未覆盖任何东西"; exit 1; }; actionlint -no-color $files'

  vuln:
    desc: govulncheck 扫描全部 module（代码可达漏洞；需访问 vuln.go.dev）
    deps: [tools-govulncheck]
    vars:
      MODS: "{{.MODULES}}"
    cmds:
      - cmd: '[ -n "{{trim .MODS}}" ] || { echo "vuln: 清单派生为空，未覆盖任何 module"; exit 1; }'
        platforms: [linux, darwin]
      - cmd: 'echo "vuln: 模块清单派生需要 POSIX shell；Windows 下逐模块跑 task vuln-module MOD=<dir>"; exit 1'
        platforms: [windows]
      - for: { var: MODS }
        task: vuln-module
        vars:
          MOD: '{{.ITEM}}'

  vuln-module:
    dir: "{{.MOD}}"
    cmds:
      - govulncheck ./...

  # 逐模块验证，命令与 CI 的 test 作业同口径：tidy -diff（依赖面漂移）+ build +
  # vet + go test -short。两处本地专属的差别：
  # - build 的产物落到临时目录而不是源码树——派生清单里有 package main
  #   （cli/cmd/bald、cobramcp/examples/*），CI 用的是用完即弃的 runner，本地会把
  #   可执行文件直接吐进仓库（.gitignore 只挡 bald.exe）。
  # - 根模块的 vet 同样带 -copylocks=false（见 ci.yml 文件头对 appkit 顶层浅拷贝
  #   的说明），否则本地比 CI 更严、假红。
  verify-module:
    desc: 验证单个 module（tidy -diff + build + vet + test -short；MOD=<dir>）
    dir: "{{.MOD}}"
    cmds:
      - go mod tidy -diff
      # 有 package main 时把可执行文件丢到临时目录：`go build ./...` 对纯库包
      # 不产出文件，但对 main 包会吐在源码目录里（cli/cmd/bald、cobramcp/examples/*），
      # .gitignore 只挡 bald.exe。`-o <dir>` 只在确有 main 包时合法，
      # 纯库包会报 "no main packages to build"，故分支。
      # （判据用 go list -json 而不是 -f '{{.Name}}'：花括号会被 go-task 当模板渲染。）
      - cmd: |
          if go list -json ./... | grep -q '"Name": "main"'; then
            go build -o "$(mktemp -d)" ./...
          else
            go build ./...
          fi
      - cmd: |
          if [ "{{.MOD}}" = "." ] || [ "{{.MOD}}" = "./" ]; then
            go vet -copylocks=false ./...
          else
            go vet ./...
          fi
      - go test -short -timeout 5m ./...

  verify-modules:
    desc: 逐模块验证派生出的全部 module（与 CI test 作业同范围，不含 _example）
    vars:
      MODS: "{{.MODULES}}"
    cmds:
      # 发布形态前置（见文件头 env.GOWORK）：那条注入一旦被删而本地还留着
      # go.work，逐模块的 tidy/build/vet 会静默改吃磁盘代码。让它当场响，
      # 而不是绿到发版才发现。
      - cmd: '[ "$(go env GOWORK)" = "off" ] || { echo "verify-modules: GOWORK 未关，逐模块判据不再是发布形态"; exit 1; }'
        platforms: [linux, darwin]
      - cmd: '[ -n "{{trim .MODS}}" ] || { echo "verify: 清单派生为空，未覆盖任何 module"; exit 1; }'
        platforms: [linux, darwin]
      - cmd: 'echo "verify: 模块清单派生需要 POSIX shell；Windows 下逐模块跑 task verify-module MOD=<dir>"; exit 1'
        platforms: [windows]
      - for: { var: MODS }
        task: verify-module
        vars:
          MOD: '{{.ITEM}}'

  # 竞态检测：普通 test 不启用 race detector。范围与 CI 的 race job 同源——
  # 同一条 find 派生流水线 + 同一份 .github/race-skip.txt，默认值是「跑」而不是
  # 「不跑」，新增 module 无需改这里。不进 `verify`：全量 -race 需 cgo 且明显变慢。
  race-module:
    internal: true
    dir: "{{.MOD}}"
    cmds:
      - go test -short -race -timeout 10m ./...

  # 派生用 POSIX shell（find/xargs/grep/tr），故限制 linux/darwin；Windows 下整个
  # 任务跳过——-race 本身要 cgo，且 Windows 周界作业（windows.yml）不跑 race。
  # 「逐命令 dir」和「for 循环内的 dir」都会被 go-task 3.52 静默忽略，所以覆盖
  # 必须走 race-module 这条 task 级 dir 的内部任务。
  race:
    desc: 竞态检测（scripts/list-modules.sh 派生的全部 module，需 cgo + POSIX shell；与 CI race job 同源）
    platforms: [linux, darwin]
    vars:
      MODS:
        sh: sh scripts/list-modules.sh | grep -vxF -f .github/race-skip.txt | tr '\n' ' '
    cmds:
      # 派生为空 = 闸门静默失效（脚本谓词或排除清单被改坏），必须响。
      - cmd: '[ -n "{{trim .MODS}}" ] || { echo "race: 清单派生为空，未覆盖任何 module"; exit 1; }'
      - for: { var: MODS }
        task: race-module
        vars:
          MOD: '{{.ITEM}}'

  deps-multi-major:
    desc: 只读报告——同一库两个 major 并存的 module（go mod edit -json 解析，不改 go.mod、不作闸门）
    platforms: [linux, darwin]
    cmds:
      - sh scripts/multi-major.sh

  build:
    desc: 编译核心模块全部包（根 + cli；不含 _example，见 example-bald-vet）
    cmds:
      - go build ./...
      - task: build-cli

  build-cli:
    internal: true
    desc: 编译 cli module 全部包（build 的跨目录腿）
    dir: cli
    cmds:
      - go build ./...

  # 设计 §7.2「验收脚本」的可执行形态（声明性指标的主门）。
  # 只跑 go test，跨平台；参考工程的计划口径在 _example 独立 module 内断言。
  acceptance:
    desc: 声明式装配验收（§7.2：计划纯净/顺序无关/停机序与回滚/漂移/计划缓存与变体（含 -tags 两态）/生成确定性/API 守卫/参考工程计划/真实示例的生成树 --check）
    cmds:
      - task: acceptance-appkit
      - task: acceptance-codegen
      - task: acceptance-example-check
      - task: acceptance-bconf
      - task: acceptance-example-plan

  # 下面五个是 acceptance 的跨目录腿，分属不同 module，只能拆成带任务级 dir 的
  # internal 子任务（原因见文件头）。appkit 这五条曾经写的是根目录下的
  # `go test ./pkg/appkit`——`pkg/` 独立成 module（`96582bf`）之后就一直 setup failed，
  # 红了一整轮没人发现，因为没有任何任务或作业调用 acceptance。
  acceptance-appkit:
    internal: true
    desc: 验收：pkg/appkit 的计划/停机/漂移/缓存与变体/API 守卫
    dir: pkg
    cmds:
      - go test ./appkit -run 'TestPlan_(NoSideEffects|OrderInvariant|SegmentCoverage|Conflict|DomainRoutes|CustomRoutesWarning)|TestRouteShapeConflict'
      - go test ./appkit -run 'TestTeardownOrder_|TestProviderPlan_StdTeardownOrder|TestComponent_StartFailureRollback|TestMountComponent_MountFailureRollback'
      - go test ./appkit -run 'TestDrift'
      - go test ./appkit -run 'TestPlanCache_|TestVariantProjection_|TestVariantEffects_|TestOption_OnRoleScoping|TestDoctor_'
      - go test ./appkit -run 'TestAPI_'

  acceptance-codegen:
    internal: true
    desc: 验收：cli/internal/codegen 的生成确定性与清单判定（合成声明）
    dir: cli
    cmds:
      - go test ./internal/codegen -run 'TestGen_(Deterministic|CheckClean)|TestGenDomain_(Bind|Proto|NoRoutes|CheckDoesNotRunProtoStage)|TestGenApp_Variants|TestTree_Variants|TestPruneStaleOwned|TestCheckTree_'

  acceptance-example-check:
    internal: true
    desc: 验收：_example/bald 的真实声明与生成树/清单不漂移（与 CI 的 test 作业同口径，不需 buf）
    dir: cli
    cmds:
      # 骨架那半边整树重算比对（gen app 不碰 proto，干净检出也能跑）。
      - go run ./cmd/bald gen app --spec ../_example/bald/appspec.json --out ../_example/bald --check
      # 域那半边在 CI 只能退成「清单 vs 磁盘字节」的比对（测试里），因为 bind 的
      # 前置是 gitignore 的 proto 产物；重算级校验见 acceptance-example-domain-check。
      - go test ./internal/codegen -run TestExampleManifestsMatchSpecAndDisk -count=1

  # 需要 buf 与 proto 产物（_example/bald/api/gen 已 gitignore），所以不进 CI、
  # 也不被 acceptance 默认调用；改域声明或 proto 注解后本地跑一次。
  acceptance-example-domain-check:
    desc: 验收：对真实示例重算 gen domain 全量产物（含 bind，需 buf）
    deps: [proto-example]
    dir: cli
    cmds:
      - go run ./cmd/bald gen domain --spec ../_example/bald/appspec.json --out ../_example/bald --check

  acceptance-bconf:
    internal: true
    desc: 验收：bconf 的生成物与 proto 契约一致
    dir: bconf
    cmds:
      - go test . -run TestGeneratedMatchesProto

  acceptance-example-plan:
    internal: true
    desc: 验收：参考工程的装配计划（含 grpcgw 两态）
    dir: _example/bald
    cmds:
      - go test ./internal/bootstrap -run TestPlan_ReferenceProject
      - go test -tags grpcgw ./internal/bootstrap -run TestPlan_ReferenceProject

  # 多模块发布：先提交业务改动，再按 plan → sync → changelog → tag 顺序执行。
  # 计划文件写在 .bald/（已忽略）；各任务默认 dry-run，写操作经 {{.CLI_ARGS}} 传入
  # （例：task release-sync -- --write）。规则见 docs/devel/zh-CN/多模块发布与变更日志.md。
  # 四步都带绝对计划路径：`bald release` 自 B-iii 起住在 cli module 里，任务必须
  # 在 cli/ 下执行 go 命令，而计划路径默认相对 cwd——不写绝对路径的话中间产物会
  # 落到 cli/.bald/，与文档承诺的仓库根 .bald/ 漂移。
  release-plan:
    desc: 计算待发布模块与下一版本，写入 .bald/release-plan.json
    dir: cli
    cmds:
      - go run ./cmd/bald release plan --out {{.ROOT_DIR}}/.bald/release-plan.json {{.CLI_ARGS}}

  release-sync:
    desc: 归位计划内模块的内部依赖（默认只看；加 -- --write 写入）
    dir: cli
    cmds:
      - go run ./cmd/bald release sync --plan {{.ROOT_DIR}}/.bald/release-plan.json {{.CLI_ARGS}}

  release-changelog:
    desc: 把计划写入 CHANGELOG.md（默认只看；加 -- --write 写入）
    dir: cli
    cmds:
      - go run ./cmd/bald release changelog --plan {{.ROOT_DIR}}/.bald/release-plan.json {{.CLI_ARGS}}

  release-tag:
    desc: 按计划打 tag（默认 dry-run；加 -- --apply 创建，--push 推送）
    dir: cli
    cmds:
      - go run ./cmd/bald release tag --plan {{.ROOT_DIR}}/.bald/release-plan.json {{.CLI_ARGS}}

  # 全量验证：派生出的**全部** module（与 CI 的 test/lint/vuln 同范围）+ _example
  # + 根/bconf/cobramcp 的非 -short 全量测试（旧 verify 就有，保留不降级）。
  # 原来这里是手写清单，只覆盖 bconf/cobramcp/retry/ratelimit/broker/
  # circuitbreaker/encoding/example —— contrib/*、registry/*、transport/*、oss/*、
  # ai/*、log/* 等约 40 个 module 被静默跳过（§1.2）。
  verify:
    desc: 全量验证（scripts/list-modules.sh 派生的全部 module + _example）
    deps: [verify-modules, test, bconf-verify, cobramcp-verify, example-bald-vet]
    cmds:
      - cmd: 'echo "verify: 派生清单全部 module + example OK（grpcgw 需 buf，见 example-bald-vet-grpcgw）"'
