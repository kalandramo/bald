# bald 顶层构建入口（Taskfile 版，跨平台兼容 Windows/macOS/Linux）
#
# 替代原 Makefile，使用 go-task（https://taskfile.dev）。安装：
#   go install github.com/go-task/task/v3/cmd/task@latest
# 用法：
#   task help            列出全部任务
#   task verify          CI 全量验证
#   task example-e2e     运行 _example 的 REST+gRPC e2e 回归
#
# 说明：
# - 所有跨目录命令改用 `dir:` 字段而非 `cd`，避免 Windows cmd/pwsh 的 cd/shell 差异。
# - 平台相关检测（如「命令是否在 PATH」）用 `task` 内置的 `sh`/`bash` 平台判定，
#   而非 Make 的 `@command -v`，从而 Windows 下也能跑。
# - protoc-gen-defaults 的版本 pin 在下方 vars.PROTOC_GEN_DEFAULTS_VERSION（唯一真相源；
#   升级时改这里，勿再散落 .bingo 之类的旁支文件）。

version: "3"

vars:
  PROTOC_GEN_DEFAULTS_VERSION: v0.0.2 # protoc-gen-defaults pin（原 .bingo 记录的 commit pin 无效，已核实取 v0.0.2）

# Windows 下用 pwsh，其余用 bash；命令缺省走 bash 即可，需 shell 特性时显式指定。
tasks:
  help:
    desc: 显示帮助
    cmds:
      - task --list

  tools-protoc-gen-defaults:
    desc: 确保 protoc-gen-defaults 在 PATH；缺失则按 pin 版本安装到 GOBIN
    cmds:
      - cmd: command -v protoc-gen-defaults >/dev/null 2>&1 || go install github.com/onexstack/protoc-gen-defaults@{{.PROTOC_GEN_DEFAULTS_VERSION}}
        platforms: [linux, darwin]
      - cmd: where protoc-gen-defaults >nul 2>nul || go install github.com/onexstack/protoc-gen-defaults@{{.PROTOC_GEN_DEFAULTS_VERSION}}
        platforms: [windows]

  tools:
    desc: 安装生成期工具链（protoc-gen-defaults 等）
    deps: [tools-protoc-gen-defaults]

  proto:
    desc: 生成全部 Protobuf 代码
    deps: [proto-contract]

  proto-contract:
    desc: 生成契约层代码（bconf/proto → bconf/gen/go；bootstrap 配置 + appspec + store 契约）
    dir: bconf
    cmds:
      - buf generate

  # BSR 远端插件的离线等价物：同一份 managed mode 配置，只把插件换成本机
  # protoc-gen-go。产物与入库 gen/go 逐字节一致（由 proto-contract-check 守住），
  # 无 BSR 登录也能复现/校验契约层生成。
  proto-contract-local:
    desc: 用本机 buf + protoc-gen-go 重新生成契约层（与 BSR 产物逐字节一致）
    dir: bconf
    cmds:
      - buf generate --template buf.gen.local.yaml

  proto-contract-check:
    desc: 校验契约层生成物与 proto 一致（工具链缺失时测试自动跳过）
    dir: bconf
    cmds:
      - go test . -run TestGeneratedMatchesProto -count=1

  bconf-verify:
    desc: bconf 契约层模块验证（build + vet + test；含生成物与 proto 一致性）
    dir: bconf
    cmds:
      - go build ./...
      - go vet ./...
      - go test ./...

  # 生成示例的 gRPC 服务代码（buf remote 插件：go / go-grpc / grpc-gateway）。
  # 与 _example/bald 的 `task proto` 等效，不再递归调用子 Makefile。
  proto-example:
    desc: 生成示例的 gRPC/gRPC-Gateway 服务代码（buf remote 插件）
    dir: _example/bald/api
    cmds:
      - cmd: buf dep update || true
        platforms: [linux, darwin]
      - cmd: (buf dep update || exit /b 0)
        platforms: [windows]
      - buf generate

  # ---------------------------------------------------------------------------
  # _example/bald 是独立 module（module github.com/kalandramo/bald/example/bald），
  # 且目录以下划线开头 —— Go 工具链会忽略它，因此核心 module 的
  # `go build ./...` / `go test ./...` / `go mod tidy` 都**不会**覆盖示例。
  # 这里提供显式任务供 CI 使用。检查用 `go vet`：`go build ./...` 会把每个
  # package main 的可执行文件写进源码目录。
  # ---------------------------------------------------------------------------

  example-tidy:
    desc: 整理示例模块依赖（重依赖只进该模块，不进核心）
    dir: _example/bald
    cmds:
      - go mod tidy

  example-bald-vet:
    desc: 静态检查 _example/bald（默认 tag，覆盖两个角色入口）
    dir: _example/bald
    cmds:
      - go vet ./...

  # grpcgw 路径需要 proto 生成产物（api/gen，已 gitignore），故先生成再检查。
  # 这是唯一能验证 register_grpcgw.go 的任务 —— 该文件带 build tag，平时不参与编译。
  example-bald-vet-grpcgw:
    desc: 静态检查 _example/bald（grpcgw tag，需 buf）
    deps: [proto-example]
    dir: _example/bald
    cmds:
      - go vet -tags grpcgw ./...

  # e2e：启动**真实的**应用（MustServe 装配，HTTP + gRPC + 校验链路），
  # 默认构建走生成的 REST 绑定（BindGreet），grpcgw 构建走网关转码面；
  # 两种形态共用同一套 gRPC 客户端用例与校验断言。
  # 这是长期保留的回归测试，改校验链路/proto 注解/拦截器接线后都应重跑。
  # 依赖 proto 生成产物，故 depend on proto-example。
  example-e2e:
    desc: 运行 _example 的 e2e 回归测试（默认 gin 绑定 + grpcgw 转码面）
    deps: [proto-example]
    dir: _example/bald
    cmds:
      - go test ./... -v
      - go test -tags grpcgw ./... -v

  # ---------------------------------------------------------------------------
  # cobramcp 是独立 module（github.com/kalandramo/bald/cobramcp，与 transport/mcp
  # 平级），其 examples/ 下另有 3 个独立 module（task / positional-args /
  # positional-args-mcp-server）。嵌套 module 不在根模块的 `go build ./...` /
  # `go test ./...` 范围内 —— 与 _example 同一个坑（见上），故这里显式列出。
  # CI（.github/workflows/ci.yml 用 find go.mod 自动发现）已覆盖这些 module，
  # 本组任务供本地/手动验证；其余兄弟 module 需要时按同样方式 cd 进去跑。
  # examples 只跑 vet + test、不跑 `go build ./...`：它们全是 package main，
  # 构建会把 task.exe 之类的可执行文件落到示例目录里（同 _example 的收尾清理问题）。
  # ---------------------------------------------------------------------------

  cobramcp-build:
    desc: 编译 cobramcp 主模块（不含 examples）
    dir: cobramcp
    cmds:
      - go build ./...

  cobramcp-vet:
    desc: 静态检查 cobramcp 主模块（不含 examples）
    dir: cobramcp
    cmds:
      - go vet ./...

  cobramcp-test:
    desc: 运行 cobramcp 主模块测试（不含 examples）
    dir: cobramcp
    cmds:
      - go test ./...

  # 单示例 module 的 vet + test。**目录切换只能靠任务级 dir**：实测 Task 3.52 下
  # 「逐命令 dir」和「for 循环内的 dir」都会被静默忽略（命令会在 Taskfile 所在目录
  # 执行，看起来「通过」其实检查错了 module），故这里用 vars 传参 + 任务级 dir，
  # 由 cobramcp-example-verify 依次调用。
  cobramcp-example-check:
    internal: true
    dir: cobramcp/examples/{{.EXAMPLE}}
    cmds:
      - go vet ./...
      - go test ./...

  cobramcp-example-verify:
    desc: 校验 cobramcp 的 3 个示例 module（vet + test；不跑 go build，避免落可执行文件）
    cmds:
      - task: cobramcp-example-check
        vars: { EXAMPLE: task }
      - task: cobramcp-example-check
        vars: { EXAMPLE: positional-args }
      - task: cobramcp-example-check
        vars: { EXAMPLE: positional-args-mcp-server }

  cobramcp-verify:
    desc: cobramcp 全量验证（主模块 + 3 个示例 module）
    deps: [cobramcp-build, cobramcp-vet, cobramcp-test, cobramcp-example-verify]

  # ---------------------------------------------------------------------------
  # retry / ratelimit / broker 是嵌套独立 module，不在根模块 `go build ./...`
  # 范围内（与 _example、cobramcp 同一个坑），故这里显式列出，否则本地
  # `task verify` 会假绿。CI（.github/workflows/ci.yml 用 find go.mod 自动发现）
  # 已覆盖，本组任务供本地/手动验证。
  # ratelimit 有 4 个 module（根 + tokenbucket/bbr/sentinel）；broker 有 5 个
  # （根 + kafka/rabbitmq/redis/rocketmq，各带 contract 子包）——用 `...` 通配
  # 覆盖子目录，但跨 module 边界时 `./...` 只在当前 module 内生效，故逐 module
  # 列出。注意 Task 3.52：跨目录只能用任务级 `dir:`。
  # ---------------------------------------------------------------------------

  retry-verify:
    desc: retry 全量验证（build + vet + test）
    dir: retry
    cmds:
      - go build ./...
      - go vet ./...
      - go test ./...

  # ---------------------------------------------------------------------------
  # encoding 是「根 module + 12 个格式 module」结构（json/xml/yaml/toml/proto/
  # msgpack/bson/cbor/gob/thrift/avro/flatbuffers），与 ratelimit/broker 同一个
  # 嵌套 module 的坑：子 module 不在根模块 `go build ./...` 范围内，本地
  # `task verify` 不显式列出就会假绿。CI（find go.mod）已覆盖，本组供本地验证。
  # ---------------------------------------------------------------------------

  encoding-verify:
    desc: encoding 全量验证（根 module + 12 个格式 module）
    cmds:
      - task: encoding-module-verify
        vars: { MOD: . }
      - task: encoding-module-verify
        vars: { MOD: json }
      - task: encoding-module-verify
        vars: { MOD: xml }
      - task: encoding-module-verify
        vars: { MOD: yaml }
      - task: encoding-module-verify
        vars: { MOD: toml }
      - task: encoding-module-verify
        vars: { MOD: proto }
      - task: encoding-module-verify
        vars: { MOD: msgpack }
      - task: encoding-module-verify
        vars: { MOD: bson }
      - task: encoding-module-verify
        vars: { MOD: cbor }
      - task: encoding-module-verify
        vars: { MOD: gob }
      - task: encoding-module-verify
        vars: { MOD: thrift }
      - task: encoding-module-verify
        vars: { MOD: avro }
      - task: encoding-module-verify
        vars: { MOD: flatbuffers }

  encoding-module-verify:
    internal: true
    dir: encoding/{{.MOD}}
    cmds:
      - go build ./...
      - go vet ./...
      - go test ./...

  ratelimit-verify:
    desc: ratelimit 全量验证（根 + tokenbucket/bbr/sentinel 四 module）
    cmds:
      - task: ratelimit-module-verify
        vars: { MOD: . }
      - task: ratelimit-module-verify
        vars: { MOD: tokenbucket }
      - task: ratelimit-module-verify
        vars: { MOD: bbr }
      - task: ratelimit-module-verify
        vars: { MOD: sentinel }

  ratelimit-module-verify:
    internal: true
    dir: ratelimit/{{.MOD}}
    cmds:
      - go build ./...
      - go vet ./...
      - go test ./...

  broker-verify:
    desc: broker 全量验证（根 + kafka/rabbitmq/redis/rocketmq 五 module）
    cmds:
      - task: broker-module-verify
        vars: { MOD: . }
      - task: broker-module-verify
        vars: { MOD: kafka }
      - task: broker-module-verify
        vars: { MOD: rabbitmq }
      - task: broker-module-verify
        vars: { MOD: redis }
      - task: broker-module-verify
        vars: { MOD: rocketmq }

  broker-module-verify:
    internal: true
    dir: broker/{{.MOD}}
    cmds:
      - go build ./...
      - go vet ./...
      - go test ./...

  circuitbreaker-verify:
    desc: circuitbreaker 全量验证（根 + hystrix/sentinel/sres/vegas 五 module）
    cmds:
      - task: circuitbreaker-module-verify
        vars: { MOD: . }
      - task: circuitbreaker-module-verify
        vars: { MOD: hystrix }
      - task: circuitbreaker-module-verify
        vars: { MOD: sentinel }
      - task: circuitbreaker-module-verify
        vars: { MOD: sres }
      - task: circuitbreaker-module-verify
        vars: { MOD: vegas }

  circuitbreaker-module-verify:
    internal: true
    dir: circuitbreaker/{{.MOD}}
    cmds:
      - go build ./...
      - go vet ./...
      - go test ./...

  test:
    desc: 运行核心模块全部测试（不含 _example，见 example-* 任务）
    cmds:
      - go test ./...

  # 竞态检测：普通 test 不启用 race detector。范围 = 并发密集模块（session
  # manager / 热重载 / 计划缓存 / 限流器）；新增此类模块时加行，CI 的 race
  # job 用同一份清单。不进 `verify`：本地全量跑会显著变慢。
  race-module:
    internal: true
    dir: "{{.MOD}}"
    cmds:
      - go test -short -race -timeout 10m ./...

  race:
    desc: 竞态检测（root + 并发密集模块，需 cgo）
    cmds:
      - task: race-module
        vars: { MOD: . }
      - task: race-module
        vars: { MOD: transport }
      - task: race-module
        vars: { MOD: transport/grpc }
      - task: race-module
        vars: { MOD: transport/http }
      - task: race-module
        vars: { MOD: transport/http3 }
      - task: race-module
        vars: { MOD: transport/tcp }
      - task: race-module
        vars: { MOD: transport/websocket }
      - task: race-module
        vars: { MOD: transport/sse }
      - task: race-module
        vars: { MOD: transport/web }
      - task: race-module
        vars: { MOD: retry }
      - task: race-module
        vars: { MOD: ratelimit }
      - task: race-module
        vars: { MOD: ratelimit/tokenbucket }
      - task: race-module
        vars: { MOD: ratelimit/bbr }
      - task: race-module
        vars: { MOD: ratelimit/sentinel }
      - task: race-module
        vars: { MOD: bootstrap }
      - task: race-module
        vars: { MOD: registry }
      - task: race-module
        vars: { MOD: cache }
      - task: race-module
        vars: { MOD: cache/redis }
      - task: race-module
        vars: { MOD: broker }
      - task: race-module
        vars: { MOD: broker/redis }
      - task: race-module
        vars: { MOD: log }
      - task: race-module
        vars: { MOD: metrics }
      - task: race-module
        vars: { MOD: health }

  build:
    desc: 编译核心模块全部包（不含 _example，见 example-bald-vet）
    cmds:
      - go build ./...

  # 设计 §7.2「验收脚本」的可执行形态（声明性指标的主门）。
  # 只跑 go test，跨平台；参考工程的计划口径在 _example 独立 module 内断言。
  acceptance:
    desc: 声明式装配验收（§7.2：计划纯净/顺序无关/停机序与回滚/漂移/计划缓存与变体（含 -tags 两态）/生成确定性/API 守卫/参考工程计划）
    cmds:
      - go test ./pkg/appkit -run 'TestPlan_(NoSideEffects|OrderInvariant|SegmentCoverage|Conflict|DomainRoutes|CustomRoutesWarning)|TestRouteShapeConflict'
      - go test ./pkg/appkit -run 'TestTeardownOrder_|TestProviderPlan_StdTeardownOrder|TestComponent_StartFailureRollback|TestMountComponent_MountFailureRollback'
      - go test ./pkg/appkit -run 'TestDrift'
      - go test ./pkg/appkit -run 'TestPlanCache_|TestVariantProjection_|TestVariantEffects_|TestOption_OnRoleScoping|TestDoctor_'
      - go test ./pkg/appkit -run 'TestAPI_'
      - go test ./internal/codegen -run 'TestGen_(Deterministic|CheckClean)|TestGenDomain_(Bind|Proto|NoRoutes|CheckDoesNotRunProtoStage)|TestGenApp_Variants|TestTree_Variants|TestPruneStaleOwned|TestCheckTree_'
      - cmd: go test . -run TestGeneratedMatchesProto
        dir: bconf
      - cmd: go test ./internal/bootstrap -run TestPlan_ReferenceProject
        dir: _example/bald
      - cmd: go test -tags grpcgw ./internal/bootstrap -run TestPlan_ReferenceProject
        dir: _example/bald

  # 全量验证：核心 + example（默认 tag 与 grpcgw tag）+ 嵌套 module。
  # CI 建议跑这个，而不是只跑 `go build ./...`。
  verify:
    desc: 全量验证（核心 + example + bconf + cobramcp + retry/ratelimit/broker/circuitbreaker）
    deps: [build, test, bconf-verify, example-bald-vet, cobramcp-verify, encoding-verify, retry-verify, ratelimit-verify, broker-verify, circuitbreaker-verify]
    cmds:
      - cmd: 'echo "verify: core + example + nested modules OK（grpcgw 需 buf，见 example-bald-vet-grpcgw）"'
