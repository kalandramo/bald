# grpc-gateway 代码生成示例（在 _example/bald 目录下执行）。
#
# 前置工具链（本机需自行安装，bald 仓库不内置）：
#   - buf      https://buf.build/docs/installation
#   - protoc-gen-go            go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
#   - protoc-gen-go-grpc       go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
#   - protoc-gen-grpc-gateway  go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@latest
#   - googleapis 依赖：buf mod update（首次会自动拉取 buf.build/googleapis/googleapis）
#
# 跨平台用法：
#   cd _example/bald && task proto
# 生成产物位于 gen/（*.pb.go / *_grpc.pb.go / *_pb.gw.go）。
#
# 注意：本仓库顶层 Taskfile 的 `proto-example` 已直接复用下方 proto 命令，
# 一般不必单独进此目录执行。

version: "3"

tasks:
  proto:
    desc: 生成示例的 gRPC/gRPC-Gateway 代码（需 protoc-gen-go-grpc 等）
    cmds:
      - cmd: cd proto && buf dep update || true
        platforms: [linux, darwin]
      - cmd: pushd proto && (buf dep update || exit /b 0) && popd
        platforms: [windows]
      # --include-imports 已不再需要：buf.gen.yaml 的 managed.go_package_prefix.except
      # 已让 googleapis / protovalidate 保留官方 go_package，其 Go 代码由官方模块提供。
      # 早期用 --include-imports 把 buf/validate 也生成本地副本，会与 protovalidate 官方库
      # 注册同一 proto 冲突并 panic（proto: file "buf/validate/validate.proto" is already registered）。
      - buf generate proto --template proto/buf.gen.yaml

  # 生成后把 grpc-gateway/v2 等依赖写入 go.mod（首次需执行）。
  tidy:
    desc: 整理本示例模块依赖
    cmds:
      - go mod tidy
