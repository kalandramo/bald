app:
    name: bald-demo
    stop_timeout: 15s
    version: v0.1.0
database:
    sql:
        driver: sqlite
        source: file::memory:?cache=shared&_fk=1
logger:
    backends:
        - slog:
            format: console
            level: info
            output_path: stdout
          type: slog
registry:
    nacos:
        cluster_name: DEFAULT
        default_kind: grpc
        group: DEFAULT_GROUP
        namespace: public
        server_addrs:
            - 127.0.0.1:8848
    type: nacos
server:
    asynq:
        redis_address: 127.0.0.1:6379
    cron:
        location: Asia/Shanghai
    grpc:
        addr: :9091
        middleware:
            rate_limit:
                burst: 200
                rate: 1000
            timeout:
                default_timeout_ms: 5000
