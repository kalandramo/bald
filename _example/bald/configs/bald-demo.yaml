# bald-demo 完整配置示例（示例自带，路径相对运行目录：_example/bald/configs/）
#
# 优先级（高 → 低，viper 默认语义）：
#   命令行 flag > 环境变量 > 本地文件(本文件) > 远程配置中心
#
# 键名即 Protobuf 配置契约（bconf/proto/bootstrap/v1/）中的字段路径：
#   - server.http : bootstrapv1.Server_Http
#   - server.grpc : bootstrapv1.Server_Grpc
#   - logger      : bootstrapv1.Logger（type 选后端，slog 段给参数）
#
# 同一套键路径同时适用于四种配置源：
#   --server.http.addr  ⇔  server.http.addr  ⇔  BALD_DEMO_SERVER_HTTP_ADDR  ⇔  本文件的 server.http.addr

# ---------------------------------------------------------------------------
# HTTP 服务（bootstrapv1.Server_Http，默认明文；Http.Tls 非 nil 即启用 HTTPS）
# ---------------------------------------------------------------------------
server:
  http:
    addr: ":8080"        # 监听地址；":0" 可让系统分配空闲端口
    # HTTP 面模式（bootstrapv1.Server_Http.driver）：仅在代码声明了网关能力
    # （-tags grpcgw 的 WithGatewayRegister）时被消费——
    #   grpc-gateway = 本端口跑 REST→gRPC 转码面（gin 演示路由让位）；
    #   其余值/留空 = 业务 handler（与 driver 无关）。
    driver: "grpc-gateway"
    # TLS（bootstrapv1.Server_TLS）：file（证书路径）或 config（原始 PEM）二选一，
    # 二者都提供时以 file 为准。
    # tls:
    #   file:
    #     cert_path: /etc/certs/tls.crt
    #     key_path: /etc/certs/tls.key

  # -----------------------------------------------------------------------
  # gRPC 服务（bootstrapv1.Server_Grpc）
  # -----------------------------------------------------------------------
  grpc:
    addr: ":9090"        # 监听地址；":0" 可让系统分配空闲端口
    reflection: false    # gRPC Server Reflection（调试工具 grpcurl 需要）

# ---------------------------------------------------------------------------
# 日志（bootstrapv1.Logger：type 选后端 + 各后端参数段）
# type 需与代码里注册的后端一致：默认构建只有 slog；要接 charm/loki/sentry/
# aliyun/tencent 需在 main 里对 LogRegistry 显式注册对应 contract.Provider
# （bald/log/<backend>/contract），再经 appkit.WithLogRegistry 装配。
# ---------------------------------------------------------------------------
logger:
  type: "slog"
  slog:
    level: "info"        # debug | info | warn | error
    format: "console"    # console | json
    output_path: "stdout"  # stdout / stderr 或文件路径
  # 其它后端段示例（仅注册了对应 contract 后才会被消费）：
  # charm:
  #   level: "info"      # 与 slog 段同形状；终端彩色输出（本地开发）
  # loki:
  #   endpoint: "http://loki:3100/loki/api/v1/push"
  #   labels:
  #     app: "bald-demo"
  # sentry:
  #   dsn: "https://<key>@o0.ingest.sentry.io/<project>"
  #   environment: "production"
  # aliyun:
  #   endpoint: "cn-hangzhou.log.aliyuncs.com"
  #   project: "demo"
  #   logstore: "demo-logstore"
  #   access_key: "<AK>"
  #   access_secret: "<SK>"
  # tencent:
  #   endpoint: "ap-guangzhou.cls.tencentcs.com"
  #   topic_id: "<topic-id>"
  #   access_key: "<AK>"
  #   access_secret: "<SK>"

# ---------------------------------------------------------------------------
# 服务注册中心（bootstrapv1.Registry：type 选后端 + 各后端参数段）
# ---------------------------------------------------------------------------
# 语义：契约声明意图（type + 连接参数），代码声明能力（哪个后端可用）。
#   - 默认构建：main.go 显式 WithRegistrar(inmemory.New()) 优先于本段
#     （开发零依赖演示）；
#   - -tags nacos 构建：nacos 契约 provider 已显式注册，本段驱动真实注册
#     （连接参数全契约化，代码零硬编码）；
#   - type 指向未注册后端：构造期 fail-fast（显式注册的天然收益）。
# 注意：registry 段不支持热更新（client 重建侵入性大，变更需重启）。
registry:
  type: "nacos"
  nacos:
    server_addrs: ["127.0.0.1:8848"]
    namespace: "public"
    group: "DEFAULT_GROUP"
    cluster_name: "DEFAULT"
    default_kind: "grpc"
