# ci：全模块 build + vet + test + tidy + lint + vuln 闸门（模块自动发现，零维护）。
# 说明：
# - 多模块仓库：模块清单只有一条派生 —— `scripts/list-modules.sh`（本地 Taskfile
#   的 lint/vuln/race/verify 消费同一个脚本，两侧覆盖范围不可能漂移）。清单为空
#   时脚本自身非零退出，闸门不会静默失效。`_example` 是验证用独立 module
#   （GOFLAGS=-mod=mod 特殊装载），由脚本排除、由 Taskfile 的 example-* 任务覆盖。
# - 根模块 vet 降级 -copylocks=false：appkit hotReload 的 `*cfg = *candidate`
#   proto 顶层浅拷贝是既定设计（字段皆指针、无别名问题，见 bootstrap.go
#   注释），MessageState 含 Mutex 属 vet 误报区。
# - go test -short + -timeout 5m：-short 跳过集成测试（各模块
#   testing.Short() 惯例）；超时防挂死测试拖垮整个 job。
#   「-short 之外」不是没人管：integration 作业按套件点名注入 etcd/redis/mongo 跑
#   非 -short 用例，并以「判据必须出现 PASS」兜住不可达即 Skip 的静默失效（见该 job 注释）。
# - 基准冒烟：每模块追加 go test -bench . -benchtime=1x -run '^$'——编译
#   并单迭代跑一轮基准，拦「基准编译坏/基准 panic」回归；无基准 module
#   空跑零成本。分配剖面回归由各包 alloc_guard_test.go 随 -short 主循环
#   守卫，不经 CI 解析基准输出。
# - 端到端计时（TestTree_EndToEndTimed / TestTree_AuthzClosedLoop：
#   gen→tidy→build→serve→停机）分钟级墙钟且起真实服务，不适合 -short
#   主循环：测试内 testing.Short 跳过，循环后独立 step 全跑。
# - 依赖面闸门：循环内 go mod tidy -diff，go.mod/go.sum 与代码 import
#   漂移即红；-diff 只报告不落盘，不影响后续 build。
# - lint 门禁：golangci-lint 按模块循环（配置在根 .golangci.yml，子模块
#   目录自动向上发现）；只拦正确性/死代码，风格交给 gofmt。
# - 漏洞门禁：govulncheck 按模块扫描「代码可达」漏洞（stdlib 漏洞随
#   setup-go 的补丁版本修复；依赖漏洞升到 fixed 版本）。
# - 依赖预下载 + 3 次重试：proxy.golang.org 偶发 HTTP/2 中流 INTERNAL_ERROR，
#   下载完成后 build/vet/test 全程离线稳定。
# - GOPROXY 主源 goproxy.io：proxy.golang.org 在 GitHub runner（Azure US）
#   上对大依赖包的中流 HTTP/2 错误持续复现，且 | 故障转移不覆盖该错误类；
#   保留 proxy.golang.org 为备源（连接级错误可转移）。sumdb 校验不受
#   proxy 切换影响。
# - 改本文件后先跑 `task ci-workflow-lint`：GitHub 在编译期解析作业文件，未
#   登记的键（如 services 下的 args）整个文件被拒，只留「workflow file
#   issue」+ 0 个 job，通用 YAML 解析器看不出问题。同内容闸门在
#   .github/workflows/workflow-lint.yml（独立文件才可能报告本文件的失败）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 逐模块的 tidy/build/vet/test 全部必须是「发布形态」判据。go.work 会把同仓依赖
# 改吃磁盘代码（§3.3 那类 published-form 判据随之失效），而 B-iii 允许本地放一个
# 不入库的 go.work 用于 cli+bconf 联合开发。这里显式关死：CI 的判据不受工作区影响。
# 检出里没有 go.work 时 GOWORK=off 是无害 no-op。
env:
  GOWORK: "off"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 主源 goproxy.io、备源 proxy.golang.org（理由见文件头）
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: build + vet + test all modules
        run: |
          set -e
          # 失败时在日志中打出所在模块（自诊断）
          trap 'echo "### FAILED AT MODULE: $mod"; echo "::error::FAILED AT MODULE: $mod"' ERR
          for mod in $(sh scripts/list-modules.sh); do
            echo "=== $mod ==="
            # 预下载依赖（重试 3 次防 proxy 瞬断），之后构建/测试离线稳定
            n=0
            while true; do
              if (cd "$mod" && go mod download); then break; fi
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "::error::$mod 依赖下载失败"; exit 1; fi
              echo "::warning::$mod 依赖下载瞬断，15s 后重试（第 $n/2 次）"
              sleep 15
            done
            # 依赖面闸门：漂移即红（前置依赖已 download，解析全图不额外拉网）
            (cd "$mod" && go mod tidy -diff)
            if [ "$mod" = "." ]; then
              (cd . && go build ./... && go vet -copylocks=false ./... && go test -short -timeout 5m ./... && go test -bench . -benchtime=1x -run '^$' ./...)
            else
              (cd "$mod" && go build ./... && go vet ./... && go test -short -timeout 5m ./... && go test -bench . -benchtime=1x -run '^$' ./...)
            fi
          done

      - name: TestTree_EndToEndTimed / TestTree_AuthzClosedLoop (outside -short)
        # codegen 自 B-iii（risk-review.md §3.4）起住在 cli module 里，须在该目录执行。
        working-directory: cli
        run: go test ./internal/codegen/ -run 'TestTree_(EndToEndTimed|AuthzClosedLoop)' -count=1 -timeout 15m

  # 竞态门禁：普通 test 不启用 race detector，session manager / 热重载 /
  # 计划缓存 / 限流器等并发路径的竞争只能在这里被发现（代码注释里的
  # 「-race 可检出」不是保险）。
  # 范围 = `scripts/list-modules.sh` 派生的全部 module 减去 .github/race-skip.txt，
  # 与 test / lint / vuln 作业同源、与本地 `task race` 同一条派生 + 同一份排除清单。
  # 默认值是「跑」而不是「不跑」：新增 module 无需改这里，也不再维护第二份清单。
  # 零测试文件的 module 只多付一次竞态化构建的成本（go test 打 no test files）。
  race:
    runs-on: ubuntu-latest
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: go test -race (all modules)
        run: |
          set -e
          trap 'echo "### FAILED AT MODULE: $mod"; echo "::error::FAILED AT MODULE: $mod"' ERR
          mods=$(sh scripts/list-modules.sh | grep -vxF -f .github/race-skip.txt)
          # 派生为空 = 这个闸门静默失效（find 谓词或排除清单被改坏），必须响。
          if [ -z "$mods" ]; then echo "::error::race 清单派生为空，闸门未覆盖任何 module"; exit 1; fi
          for mod in $mods; do
            echo "=== race: $mod ==="
            (cd "$mod" && go mod download && go test -short -race -timeout 10m ./...)
          done

  # 集成作业（风险 §7.1）：注入真服务，跑「非 -short」的那批用例——registry / store /
  # 队列三条接缝各至少一条。
  #
  # 为什么不是把 test 作业改成非 -short：`transport/{redis,kafka,rabbitmq,rocketmq,tcp,webrtc}`
  # 的 `TestServer`/`TestClient` 是等信号的手动用例（非 -short 会挂到 timeout），主循环必须
  # 留在 -short。这里按套件点名跑，清单外的包一概不碰。
  #
  # 刻意不含 `_example/bald`：那里的 etcd/nacos 服务发现端到端**只在本地跑**（README 有可复制
  # 命令）。原因是 `_example/bald/go.mod` 把两个 kratos contrib 模块 replace 到**仓库外**的
  # 同级检出（`../../kratos/contrib/{config,registry}/nacos`），干净检出上那两条路径不存在，
  # 模块图都装载不出来。要在 CI 跑示例，得先给那两个 replace 找到已发布版本——那是独立一件事。
  #
  # 三档防「静默失效」（这是新增闸门最容易自欺的地方）：
  #   1. **服务探活失败 = 作业失败**。这批用例的写法是「不可达即 Skip」，不探活的话服务起不
  #      来作业照样绿，等于白加一个 job。
  #   2. 逐套件 `-v` 全量输出留档，末尾按 EXPECTED 逐条断言真的出现 `--- PASS`：Skip、改名、
  #      被删都拦得住。EXPECTED 只列「非真服务不可证」的判据，普通单测不在里面（它们已由
  #      -short 主循环覆盖）。
  #   3. EXPECTED 与套件一一对应写在同一个 step 里，加套件忘加判据时至少肉眼在同一屏能看见。
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
      # 三个后端的地址都显式给：测试里的默认值恰好也是这些，但作业不靠默认值成立
      BALD_E2E_ETCD_ADDR: "127.0.0.1:2379"
      BALD_TEST_REDIS_URI: "redis://127.0.0.1:6379"
      BALD_MONGO_URI: "mongodb://127.0.0.1:27017"
    services:
      etcd:
        image: quay.io/coreos/etcd:v3.5.14
        ports: ["2379:2379"]
        # 命令行参数不走 `args`：GitHub 的作业解析器只认 services 的
        # credentials/env/image/options/ports/volumes，多出任何键都在编译期
        # 拒掉整个文件（表现为「0 个 job、瞬间失败」，本地 Psych 看不出来）。
        # etcd 同名的 ETCD_* 环境变量与 flag 等价，镜像 entrypoint 直接读它们。
        env:
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2379
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: 服务探活（探不到即失败，不放行成 Skip）
        run: |
          set -e
          wait_tcp() { # host port 名称
            local host="$1" port="$2" name="$3" tries=60
            while [ "$tries" -gt 0 ]; do
              if (echo > "/dev/tcp/$host/$port") 2>/dev/null; then
                echo "READY $name ($host:$port)"
                return 0
              fi
              tries=$((tries - 1))
              sleep 2
            done
            echo "::error::$name 未就绪（$host:$port）"
            return 1
          }
          wait_tcp 127.0.0.1 2379 etcd
          wait_tcp 127.0.0.1 6379 redis
          wait_tcp 127.0.0.1 27017 mongo

      - name: 集成套件（非 -short，逐条判据留档）
        run: |
          set -e
          mkdir -p /tmp/int
          # registry/etcd/contract 不是独立 module（无自己的 go.mod），./... 已带上它
          (cd registry/etcd       && go mod download && go test -count=1 -timeout 10m -v ./... > /tmp/int/registry-etcd.log 2>&1) || { cat /tmp/int/registry-etcd.log; exit 1; }
          (cd contrib/store-mongo && go mod download && go test -count=1 -timeout 10m -v ./... > /tmp/int/store-mongo.log 2>&1) || { cat /tmp/int/store-mongo.log; exit 1; }
          (cd transport/asynq     && go mod download && go test -count=1 -timeout 10m -v ./... > /tmp/int/asynq.log 2>&1) || { cat /tmp/int/asynq.log; exit 1; }
          cat /tmp/int/*.log

      - name: 判据必须真的跑过（Skip 不算通过）
        run: |
          set -e
          # 每条格式 <日志>|<测试名>；名字来自上面各套件的 -v 输出
          EXPECTED="
          /tmp/int/registry-etcd.log|TestRegisterDiscoverDeregister
          /tmp/int/registry-etcd.log|TestWatch_ReceivesChanges
          /tmp/int/registry-etcd.log|TestProvider_BuildsUsableRegistrar
          /tmp/int/store-mongo.log|TestMongoCRUD
          /tmp/int/asynq.log|TestTaskSubscribe
          "
          miss=0
          for row in $EXPECTED; do
            [ "$row" = "" ] && continue
            log=${row%%|*}
            name=${row##*|}
            if grep -q -- "--- PASS: $name" "$log"; then
              echo "PASS  $name  ($log)"
            else
              echo "::error::判据 $name 没有 PASS 记录（Skip / 改名 / 未编译都会落到这里）"
              miss=$((miss + 1))
            fi
          done
          if [ "$miss" != 0 ]; then
            echo "--- 留档输出（便于看是 Skip 还是没跑）---"
            grep -E '^(--- (SKIP|FAIL|PASS)|ok|FAIL)' /tmp/int/*.log | tail -60
            exit 1
          fi

  # 静态检查：golangci-lint 逐模块运行（清单来自 scripts/list-modules.sh，零维护）。配置在根
  # .golangci.yml，子模块目录会向上发现；新增模块无需改本 job。
  lint:
    runs-on: ubuntu-latest
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      # 版本 pin：升级 lint 规则集是显式动作，避免上游新检查静默漂移。
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: golangci-lint all modules
        run: |
          set -e
          trap 'echo "### FAILED AT MODULE: $mod"; echo "::error::FAILED AT MODULE: $mod"' ERR
          for mod in $(sh scripts/list-modules.sh); do
            echo "=== lint: $mod ==="
            n=0
            while true; do
              if (cd "$mod" && go mod download); then break; fi
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "::error::$mod 依赖下载失败"; exit 1; fi
              echo "::warning::$mod 依赖下载瞬断，15s 后重试（第 $n/2 次）"
              sleep 15
            done
            (cd "$mod" && golangci-lint run ./...)
          done

  # 漏洞门禁：govulncheck 只报告「代码真正可达」的漏洞（非模块级清单），
  # 因此可以 fail-closed；标准库漏洞由 setup-go 的补丁版本修复。
  vuln:
    runs-on: ubuntu-latest
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: govulncheck all modules
        run: |
          set -e
          trap 'echo "### FAILED AT MODULE: $mod"; echo "::error::FAILED AT MODULE: $mod"' ERR
          for mod in $(sh scripts/list-modules.sh); do
            echo "=== vuln: $mod ==="
            n=0
            while true; do
              if (cd "$mod" && go mod download); then break; fi
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "::error::$mod 依赖下载失败"; exit 1; fi
              echo "::warning::$mod 依赖下载瞬断，15s 后重试（第 $n/2 次）"
              sleep 15
            done
            (cd "$mod" && govulncheck ./...)
          done
