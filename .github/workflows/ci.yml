# ci：全模块 build + vet + test + tidy + lint + vuln 闸门（模块自动发现，零维护）。
# 说明：
# - 多模块仓库：模块清单只有一条派生 —— `scripts/list-modules.sh`（本地 Taskfile
#   的 lint/vuln/race/verify 消费同一个脚本，两侧覆盖范围不可能漂移）。清单为空
#   时脚本自身非零退出，闸门不会静默失效。`_example` 是验证用独立 module
#   （GOFLAGS=-mod=mod 特殊装载），由脚本排除；它不进四条主循环，但有自己的
#   `example` 作业判执行证据（见下面那条作业的注释）。
# - 根模块 vet 降级 -copylocks=false：appkit hotReload 的 `*cfg = *candidate`
#   proto 顶层浅拷贝是既定设计（字段皆指针、无别名问题，见 bootstrap.go
#   注释），MessageState 含 Mutex 属 vet 误报区。
# - go test -short + -timeout 5m：-short 跳过集成测试（各模块
#   testing.Short() 惯例）；超时防挂死测试拖垮整个 job。
#   「-short 之外」不是没人管：integration 作业按套件点名注入 etcd/consul/redis/mongo
#   跑非 -short 用例，integration-kubernetes 作业另起真 kind 集群跑 registry 的第三条
#   后端腿，example 作业注入 etcd/nacos 跑示例 module 那批要真后端的判据，三处都以
#   「判据必须出现 PASS」兜住不可达即 Skip 的静默失效（见各 job 注释）。
# - 基准冒烟：每模块追加 go test -bench . -benchtime=1x -run '^$'——编译
#   并单迭代跑一轮基准，拦「基准编译坏/基准 panic」回归；无基准 module
#   空跑零成本。分配剖面回归由各包 alloc_guard_test.go 随 -short 主循环
#   守卫，不经 CI 解析基准输出。
# - 端到端计时（TestTree_EndToEndTimed / TestTree_AuthzClosedLoop：
#   gen→tidy→build→serve→停机）分钟级墙钟且起真实服务，不适合 -short
#   主循环：测试内 testing.Short 跳过，循环后独立 step 全跑。
# - 依赖面闸门：循环内 go mod tidy -diff，go.mod/go.sum 与代码 import
#   漂移即红；-diff 只报告不落盘，不影响后续 build。
# - lint 门禁：golangci-lint 按模块循环（配置在根 .golangci.yml，子模块
#   目录自动向上发现）；只拦正确性/死代码，风格交给 gofmt。
# - 漏洞门禁：govulncheck 按模块扫描「代码可达」漏洞（stdlib 漏洞随
#   setup-go 的补丁版本修复；依赖漏洞升到 fixed 版本）。
# - 依赖预下载 + 3 次重试：proxy.golang.org 偶发 HTTP/2 中流 INTERNAL_ERROR，
#   下载完成后 build/vet/test 全程离线稳定。
# - GOPROXY 主源 goproxy.io：proxy.golang.org 在 GitHub runner（Azure US）
#   上对大依赖包的中流 HTTP/2 错误持续复现，且 | 故障转移不覆盖该错误类；
#   保留 proxy.golang.org 为备源（连接级错误可转移）。sumdb 校验不受
#   proxy 切换影响。
# - 改本文件后先跑 `task ci-workflow-lint`：GitHub 在编译期解析作业文件，未
#   登记的键（如 services 下的 args）整个文件被拒，只留「workflow file
#   issue」+ 0 个 job，通用 YAML 解析器看不出问题。同内容闸门在
#   .github/workflows/workflow-lint.yml（独立文件才可能报告本文件的失败）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发（与 ci-windows.yml 同口径）。它还多承担一件事：新加一条闸门时，
  # 「在分支上按 ref 手动跑一遍再合 main」是唯一能既不把 main 弄红、又拿到真
  # runner 证据的路径——`push` 只认 main，`pull_request` 要建 PR（对外可见）。
  # 例：`gh workflow run ci.yml --ref <branch>`。
  # 实测（2026-11-04）这一条不需要任何前置：main 当时还没有 `workflow_dispatch`，
  # 按分支 ref 触发照样产出 run 41823701064。所以不必先合一个「只加这个键」的使能提交。
  workflow_dispatch:

permissions:
  contents: read

# 逐模块的 tidy/build/vet/test 全部必须是「发布形态」判据。go.work 会把同仓依赖
# 改吃磁盘代码（§3.3 那类 published-form 判据随之失效），而 B-iii 允许本地放一个
# 不入库的 go.work 用于 cli+bconf 联合开发。这里显式关死：CI 的判据不受工作区影响。
# 检出里没有 go.work 时 GOWORK=off 是无害 no-op。
env:
  GOWORK: "off"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 主源 goproxy.io、备源 proxy.golang.org（理由见文件头）
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"

      - name: build + vet + test all modules
        run: |
          # 不 fail-fast：与上面的 vuln 作业同形（§7.29 定下的姿势，§7.40 补上这一条）。
          # fail-fast 时「这次改动让几个模块红」这个信息被整个丢掉——实测 2026-11-06：
          # 远端 run 42199588839 的日志里只有 `FAILED AT MODULE: ./metrics/datadog`
          # 一行（派生清单里它最靠前），另外 12 个同样红的模块从未被打印过。
          # 派生为空即失败：清单脚本吐空时下面这个循环跑零个模块并 exit 0——静默绿。
          failed=""
          failed_count=0
          mods=$(sh scripts/list-modules.sh)
          if [ -z "$mods" ]; then
            echo "::error::test 闸门失败：模块清单派生为空，一个字都没跑"
            exit 1
          fi
          mkdir -p /tmp/cov
          cov_i=0
          for mod in $mods; do
            echo "=== test: $mod ==="
            # 预下载依赖（重试 3 次防 proxy 瞬断），之后构建/测试离线稳定。
            # 下载失败与判据失败分开记账：runner 网络瞬断不能被读成代码坏了。
            n=0
            downloaded=0
            while true; do
              if (cd "$mod" && go mod download); then downloaded=1; break; fi
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "::error::$mod 依赖下载失败"; break; fi
              echo "::warning::$mod 依赖下载瞬断，15s 后重试（第 $n/2 次）"
              sleep 15
            done
            if [ "$downloaded" -ne 1 ]; then failed="$failed $mod:download"; failed_count=$((failed_count+1)); continue; fi
            # 依赖面闸门：漂移即红（前置依赖已 download，解析全图不额外拉网）
            if ! (cd "$mod" && go mod tidy -diff); then failed="$failed $mod:tidy"; failed_count=$((failed_count+1)); continue; fi
            cov_i=$((cov_i+1))
            covf="/tmp/cov/short-m$cov_i.out"
            if [ "$mod" = "." ]; then
              ok=1
              (cd . && go build ./... && go vet -copylocks=false ./... && go test -short -timeout 5m -covermode=atomic -coverprofile="$covf" ./... && go test -bench . -benchtime=1x -run '^$' ./...) || ok=0
            else
              ok=1
              (cd "$mod" && go build ./... && go vet ./... && go test -short -timeout 5m -covermode=atomic -coverprofile="$covf" ./... && go test -bench . -benchtime=1x -run '^$' ./...) || ok=0
            fi
            if [ "$ok" -ne 1 ]; then failed="$failed $mod:build-vet-test"; failed_count=$((failed_count+1)); fi
          done
          if [ -n "$failed" ]; then
            # 计数用显式累加器，不用 `printf '%s\n' $failed | wc -l`（SC2086 会被
            # actionlint 的 shellcheck 腿判红，且 wc 的左补空分 BSD/GNU 两种读数；
            # 同一条教训见本文件 vuln 作业）。
            echo "### FAILED MODULES ($failed_count):$failed"
            echo "::error::test 闸门失败：$failed_count 个模块判红:$failed"
            exit 1
          fi

      - name: 上传 -short 覆盖率 profile（供末尾 coverage 作业合并求并集）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cov-short
          path: /tmp/cov/
          if-no-files-found: warn

      - name: TestTree_EndToEndTimed / TestTree_AuthzClosedLoop (outside -short)
        # codegen 自 B-iii（risk-review.md §3.4）起住在 cli module 里，须在该目录执行。
        working-directory: cli
        run: go test ./internal/codegen/ -run 'TestTree_(EndToEndTimed|AuthzClosedLoop)' -count=1 -timeout 15m

      - name: 真实示例的装配骨架与声明不漂移（gen app --check）
        # 上面那步吃的是合成声明；这条钉的是 _example/bald 这份**真实**声明。
        # 判据是逐字节比对（含清单的 spec 摘要），改声明忘了重生成会当场红。
        # --check 不写文件、不跑 proto 阶段，因此不需要 buf/protoc。
        # 域那半边（gen domain --check）**不在这里**：bind 文件的前置是 proto 的
        # Go 产物，而 _example/bald/api/gen 已 gitignore，干净检出里没有——实跑
        # 红在 `bindings import proto Go package ..., but its generated Go files
        # are missing`。--no-bind 也不是替代（它改期望文件集合，已入库的 bind/路由
        # 被判 stale）。该面拆成两处：清单与磁盘字节的比对在
        # cli/internal/codegen/example_manifest_test.go（随上面的 go test 跑），
        # 重算级校验在需要 buf 的 task acceptance-example-domain-check。见 §8。
        working-directory: cli
        run: go run ./cmd/bald gen app --spec ../_example/bald/appspec.json --out ../_example/bald --check

      - name: 蒸馏卡闸门（bald convention check）
        # AI 规范通道（cli/internal/convention/cards/）的机器闸门：卡集完整性
        # （front-matter/规则 ID 唯一合法）+ 卡声明的确定性检查器。仓库根检出
        # 没有 _example/bald 之外的项目级 appspec.json，gen-app-drift 在这里
        # 会对 cli 目录按 skip 处理——真正盯生成树的是上一步与 acceptance 作业，
        # 这一步守住的是「卡集本身没坏」与「checker 注册表与卡声明一致」。
        # 发现问题时退出码 0 是 MCP 语义（客户端要拿完整结果），CI 拦截必须
        # 显式 --fail-on-findings（onexai convention 第 13 章口径）。
        working-directory: cli
        run: go run ./cmd/bald convention check --fail-on-findings

  # 竞态门禁：普通 test 不启用 race detector，session manager / 热重载 /
  # 计划缓存 / 限流器等并发路径的竞争只能在这里被发现（代码注释里的
  # 「-race 可检出」不是保险）。
  # 范围 = `scripts/list-modules.sh` 派生的全部 module 减去 .github/race-skip.txt，
  # 与 test / lint / vuln 作业同源、与本地 `task race` 同一条派生 + 同一份排除清单。
  # 默认值是「跑」而不是「不跑」：新增 module 无需改这里，也不再维护第二份清单。
  # 零测试文件的 module 只多付一次竞态化构建的成本（go test 打 no test files）。
  race:
    runs-on: ubuntu-latest
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"

      - name: go test -race (all modules)
        run: |
          # 不 fail-fast：与 test/vuln 作业同形（§7.40）。竞争缺陷常成批出现——
          # §1.1 那轮一次就揪出 graphql 自身的竞争；第一个红把后面几十个模块
          # 全部跳过时，「这次改动引入几处竞争」这条信息就没了。
          # 派生为空即失败（find 谓词或排除清单被改坏 → 零个模块 + exit 0 = 静默绿）。
          failed=""
          failed_count=0
          mods=$(sh scripts/list-modules.sh | grep -vxF -f .github/race-skip.txt)
          if [ -z "$mods" ]; then echo "::error::race 清单派生为空，闸门未覆盖任何 module"; exit 1; fi
          for mod in $mods; do
            echo "=== race: $mod ==="
            # 下载与竞争分开记账（同 test/vuln 作业）：runner 网络瞬断不能被读成竞争缺陷。
            n=0
            downloaded=0
            while true; do
              if (cd "$mod" && go mod download); then downloaded=1; break; fi
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "::error::$mod 依赖下载失败"; break; fi
              echo "::warning::$mod 依赖下载瞬断，15s 后重试（第 $n/2 次）"
              sleep 15
            done
            if [ "$downloaded" -ne 1 ]; then failed="$failed $mod:download"; failed_count=$((failed_count+1)); continue; fi
            if ! (cd "$mod" && go test -short -race -timeout 10m ./...); then
              failed="$failed $mod:race"; failed_count=$((failed_count+1))
            fi
          done
          if [ -n "$failed" ]; then
            # 计数用显式累加器，理由同 vuln 作业（SC2086 + wc 读数的平台差）。
            echo "### FAILED MODULES ($failed_count):$failed"
            echo "::error::race 闸门失败：$failed_count 个模块判红:$failed"
            exit 1
          fi

  # 集成作业（风险 §7.1）：注入真服务，跑「非 -short」的那批用例——registry / store /
  # 队列三条接缝各至少一条（registry 现为 etcd + consul + kubernetes 三个后端；前两个
  # 由本作业的 `services:` 注入，第三个要真 apiserver，独立成 `integration-kubernetes`，
  # 理由见那个作业的注释）。
  #
  # 为什么不是把 test 作业改成非 -short：`transport/{redis,kafka,rabbitmq,rocketmq,tcp,webrtc}`
  # 的 `TestServer`/`TestClient` 是等信号的手动用例（非 -short 会挂到 timeout），主循环必须
  # 留在 -short。这里按套件点名跑，清单外的包一概不碰。
  #
  # 本作业也不含 `_example/bald`，但**不是没人管**：那里的 etcd/nacos 服务发现端到端与三态构建
  # 由专职的 `example` 作业判（风险 §7.1 已因此收口）。拆成两条的理由与上面
  # `integration-kubernetes` 同一条：示例要先装 buf 并生成 gitignore 的 `api/gen` 才编译得了，
  # 那条失败面（BSR 拉不到 / 插件版本漂）与本作业四条服务腿无关，混在一起等于让平台抖动
  # 定期作废本作业的取证。
  #
  # 这个「刻意不含」曾经是真的：原先第一条阻塞（go.mod 把两个 kratos contrib 模块 replace 到
  # **仓库外**的同级检出，干净检出连模块图都装载不出来）在 2026-11-04 撤除——示例现在只用仓内
  # 模块，实测干净检出 `go mod download` 与 `go list -m all` 都通过。剩下的两条（要 pin buf 并
  # 放开 BSR 网络；要真 etcd/真 nacos 才有意义）也都由 `example` 作业解决了：工具链与
  # `proto-contract` 同源，服务容器与本作业同镜像同参数。
  #
  # 顺带一条已动过刀的分工：nacos 的**机制**判据（注销走对服务名、契约 cleanup 真关 client）
  # 不依赖 proto 产物，下沉在 registry/nacos/contract 由本作业的 nacos 服务容器判；示例里那条
  # 是**装配**判据（要起整个 api 角色），判的是终态且两条摘除路径是「或」，见 §7.10。
  #
  # 三档防「静默失效」（这是新增闸门最容易自欺的地方）：
  #   1. **服务探活失败 = 作业失败**。这批用例的写法是「不可达即 Skip」，不探活的话服务起不
  #      来作业照样绿，等于白加一个 job。
  #   2. 逐套件 `-v` 全量输出留档，末尾按 EXPECTED 逐条断言真的出现 `--- PASS`：Skip、改名、
  #      被删都拦得住。EXPECTED 只列「非真服务不可证」的判据，普通单测不在里面（它们已由
  #      -short 主循环覆盖）。
  #   3. EXPECTED 与套件一一对应写在同一个 step 里，加套件忘加判据时至少肉眼在同一屏能看见。
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
      # 四个后端的地址都显式给：测试里的默认值恰好也是这些，但作业不靠默认值成立
      BALD_E2E_ETCD_ADDR: "127.0.0.1:2379"
      BALD_E2E_CONSUL_ADDR: "127.0.0.1:8500"
      BALD_TEST_REDIS_URI: "redis://127.0.0.1:6379"
      BALD_MONGO_URI: "mongodb://127.0.0.1:27017"
      BALD_E2E_NACOS_ADDR: "127.0.0.1:8848"
    services:
      etcd:
        image: quay.io/coreos/etcd:v3.5.14
        ports: ["2379:2379"]
        # 命令行参数不走 `args`：GitHub 的作业解析器只认 services 的
        # credentials/env/image/options/ports/volumes，多出任何键都在编译期
        # 拒掉整个文件（表现为「0 个 job、瞬间失败」，本地 Psych 看不出来）。
        # etcd 同名的 ETCD_* 环境变量与 flag 等价，镜像 entrypoint 直接读它们。
        env:
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2379
      consul:
        # 镜像默认 CMD 已经是 `agent -dev -client 0.0.0.0`（本地
        # `docker image inspect hashicorp/consul:1.19.2` 实测 CMD/ENTRYPOINT），
        # 所以这里不需要 args/options——dev agent 自带单节点集群，8500 直接可查。
        # 版本 pin 到 1.19.2 与本地取证用的那一个一致。
        image: hashicorp/consul:1.19.2
        ports: ["8500:8500"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      nacos:
        # 注册中心的第四个后端。版本与本地取证那台一致（v2.3.2）。
        #
        # **9848 必须一起映射**：nacos SDK v2 的 naming 走 gRPC，端口是
        # `8848 + 1000`；只映射 8848 时 HTTP 口活着、注册却静默上不去，
        # 判据会红在「注册后 20s 内不可见」这种看起来像时序问题的地方。
        # MODE=standalone 用内嵌 derby 单库；NACOS_AUTH_ENABLE=false 关掉鉴权，
        # 与用例不带用户名密码的写法一致。
        image: nacos/nacos-server:v2.3.2
        ports: ["8848:8848", "9848:9848"]
        env:
          MODE: standalone
          NACOS_AUTH_ENABLE: "false"
          JVM_XMS: 256m
          JVM_XMX: 512m
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"

      # kubernetes 后端不是「服务容器」能表达的形状（要真 apiserver + kubelet），那条腿
      # 独立成下面的 `integration-kubernetes` 作业；不在这里起集群的理由见那个作业的头注释。
      - name: 服务探活（探不到即失败，不放行成 Skip）
        run: |
          set -e
          wait_tcp() { # host port 名称 [尝试次数，默认 60 次 ×2s]
            local host="$1" port="$2" name="$3" tries="${4:-60}"
            while [ "$tries" -gt 0 ]; do
              if (echo > "/dev/tcp/$host/$port") 2>/dev/null; then
                echo "READY $name ($host:$port)"
                return 0
              fi
              tries=$((tries - 1))
              sleep 2
            done
            echo "::error::$name 未就绪（$host:$port）"
            return 1
          }
          wait_tcp 127.0.0.1 2379 etcd
          wait_tcp 127.0.0.1 8500 consul
          wait_tcp 127.0.0.1 6379 redis
          wait_tcp 127.0.0.1 27017 mongo
          # nacos 是 Java 起的，比另外四个慢一个量级；探不到照样判红（这批用例的写法
          # 是「不可达即 Skip」，不探活就等于白加一个服务）。
          wait_tcp 127.0.0.1 8848 nacos 90

      - name: 集成套件（非 -short，逐条判据留档）
        run: |
          set -e
          mkdir -p /tmp/int
          mkdir -p /tmp/int-cov
          # 两个 registry/*/contract（etcd、consul）都不是独立 module（无自己的
          # go.mod），各自父模块的 ./... 已把它们带上；kubernetes 那个 contract 同理由
          # `integration-kubernetes` 作业的 ./... 带上
          (cd registry/etcd       && go mod download && go test -count=1 -timeout 10m -covermode=atomic -coverprofile=/tmp/int-cov/registry-etcd.out -v ./... > /tmp/int/registry-etcd.log 2>&1) || { cat /tmp/int/registry-etcd.log; exit 1; }
          (cd registry/consul     && go mod download && go test -count=1 -timeout 10m -covermode=atomic -coverprofile=/tmp/int-cov/registry-consul.out -v ./... > /tmp/int/registry-consul.log 2>&1) || { cat /tmp/int/registry-consul.log; exit 1; }
          (cd contrib/store-mongo && go mod download && go test -count=1 -timeout 10m -covermode=atomic -coverprofile=/tmp/int-cov/store-mongo.out -v ./... > /tmp/int/store-mongo.log 2>&1) || { cat /tmp/int/store-mongo.log; exit 1; }
          (cd transport/asynq     && go mod download && go test -count=1 -timeout 10m -covermode=atomic -coverprofile=/tmp/int-cov/asynq.out -v ./... > /tmp/int/asynq.log 2>&1) || { cat /tmp/int/asynq.log; exit 1; }
          (cd registry/nacos      && go mod download && go test -count=1 -timeout 10m -covermode=atomic -coverprofile=/tmp/int-cov/registry-nacos.out -v ./... > /tmp/int/registry-nacos.log 2>&1) || { cat /tmp/int/registry-nacos.log; exit 1; }
          (cd contrib/database/mongodb && go mod download && go test -count=1 -timeout 10m -covermode=atomic -coverprofile=/tmp/int-cov/contrib-database-mongodb.out -v ./... > /tmp/int/contrib-database-mongodb.log 2>&1) || { cat /tmp/int/contrib-database-mongodb.log; exit 1; }
          cat /tmp/int/*.log

      - name: 判据必须真的跑过（Skip 不算通过）
        run: |
          set -e
          # 每条格式 <日志>|<测试名>；名字来自上面各套件的 -v 输出。
          # **这个字符串里只能放判据行**：循环按空白拆词，注释混进来会被当成一堆
          # 假判据（实测把 `grep` 指到不存在的文件上），整个作业判红且报错难懂。
          # 下面那条 case 分支是给这种写法兜底的：它直接点名「非判据项」。
          EXPECTED="
          /tmp/int/registry-etcd.log|TestRegisterDiscoverDeregister
          /tmp/int/registry-etcd.log|TestRegister_MissingNameIsRejected
          /tmp/int/registry-etcd.log|TestRegister_MissingIDIsRejected
          /tmp/int/registry-etcd.log|TestGetService_NotFound
          /tmp/int/registry-etcd.log|TestNamespacePrefix
          /tmp/int/registry-etcd.log|TestWatch_ReceivesChanges
          /tmp/int/registry-etcd.log|TestProvider_BuildsUsableRegistrar
          /tmp/int/registry-consul.log|TestRegisterDiscoverDeregister
          /tmp/int/registry-consul.log|TestWatch_ReceivesChanges
          /tmp/int/registry-consul.log|TestHeartbeat_DeregisterKeepsOtherInstances
          /tmp/int/registry-consul.log|TestGetService_HealthCheckFiltersNonPassing
          /tmp/int/registry-consul.log|TestProvider_BuildsUsableRegistrar
          /tmp/int/store-mongo.log|TestMongoCRUD
          /tmp/int/asynq.log|TestTaskSubscribe
          /tmp/int/registry-nacos.log|TestNacosDeregisterRemovesInstanceWithClientOpen
          /tmp/int/registry-nacos.log|TestNacosContractCleanupClosesClient
          /tmp/int/registry-nacos.log|TestMappingBackend_GroupLandsInRegistration
          /tmp/int/registry-nacos.log|TestMappingBackend_ClusterNameLandsInRegistration
          /tmp/int/registry-nacos.log|TestMappingBackend_WeightLandsInRegistration
          /tmp/int/registry-nacos.log|TestMappingBackend_ZeroWeightFallsBackToDefault
          /tmp/int/registry-nacos.log|TestMappingBackend_NamespaceIsolatesInstance
          /tmp/int/registry-nacos.log|TestMappingBackend_DefaultKindLandsInEndpointScheme
          /tmp/int/contrib-database-mongodb.log|TestMappingBackend_DatabaseSelectsNamespace
          /tmp/int/contrib-database-mongodb.log|TestMappingBackend_CredentialsReachAuthHandshake
          /tmp/int/contrib-database-mongodb.log|TestMappingBackend_UsernameWithoutPasswordIsNoAuth
          /tmp/int/contrib-database-mongodb.log|TestMappingBackend_HeartbeatIntervalDrivesMonitorTraffic
          /tmp/int/contrib-database-mongodb.log|TestMappingBackend_MaxConnIdleTimeReapsIdleConnections
          "
          # consul 那五条里，后两条是 consul 后端独有的语义，只有真 agent 能判：
          # 心跳按实例隔离（注销一个不该带走其余实例）与「发现只返回 passing 实例」。
          #
          # etcd 那七条：这个套件按 `go test ./...`（非 -short）整包跑，所以四条
          # 「-short 下跳过」的用例（Missing*IsRejected / GetService_NotFound /
          # NamespacePrefix）以前只是顺带跑过了，没有判据盯着。docscheck 的
          # `TestAcceptanceTableCoversShortSkippedTests` 不接受「顺带跑过」——它要求每条
          # -short 跳过的用例要么进 scripts/acceptance-gate.sh 的判据表，要么被作业点名。
          # 这四条的真 etcd 依赖不适合进表（表里的腿在 test 作业跑，无 etcd），
          # 所以走「点名」这条路，同时让它们从这里开始真的被断言而不是被记录。
          miss=0
          for row in $EXPECTED; do
            [ "$row" = "" ] && continue
            case "$row" in
              *"|"*) ;;
              *)
                echo "::error::EXPECTED 里有非 <日志>|<测试名> 的项：「$row」——注释别写进这个字符串"
                miss=$((miss + 1))
                continue
                ;;
            esac
            log=${row%%|*}
            name=${row##*|}
            if grep -q -- "--- PASS: $name" "$log"; then
              echo "PASS  $name  ($log)"
            else
              echo "::error::判据 $name 没有 PASS 记录（Skip / 改名 / 未编译都会落到这里）"
              miss=$((miss + 1))
            fi
          done
          if [ "$miss" != 0 ]; then
            echo "--- 留档输出（便于看是 Skip 还是没跑）---"
            grep -E '^(--- (SKIP|FAIL|PASS)|ok|FAIL)' /tmp/int/*.log | tail -60
            exit 1
          fi

      - name: 上传集成腿覆盖率 profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cov-integration
          path: /tmp/int-cov/
          if-no-files-found: warn

  # kubernetes 注册中心真机腿（风险 §7.1）。四个 registry 后端里，etcd/consul 由
  # `integration` 作业的真服务判，kubernetes 要真 apiserver + kubelet 所以独立成这条；
  # nacos 的服务容器已经进 `integration`（判注销与 cleanup 两条机制）。
  #
  # 为什么不并进 `integration`：本作业要下载并启动真 kube-apiserver + kubelet（kind），
  # 失败面是「Docker Hub 拉不到 kindest/node」「runner 上集群起不来」这类平台问题，
  # 与四条服务腿无关。两种失败面放进同一个作业，第一次平台抖动就让整个作业的结论
  # 作废，etcd/consul/redis/mongo 那四条腿得重跑一遍才能取证——而这种「不是我们的
  # 代码坏了」的红最难维护：下一个接手人加的是 `continue-on-error`，不是修集群。
  # 拆开后两边的判据都还是硬门，谁红查谁。
  #
  # 为什么非真集群不可（fake clientset 判不出这三条）：
  #   1. `Deregister` 靠 strategic merge patch 的「值为 null 即删键」摘标签，
  #      fake 的 fixture tracker 不实现这套合并语义——键删不掉，但测试照样绿。
  #   2. 发现侧只列 `Phase == Running` 的 Pod；phase 是 kubelet 写回的状态，
  #      fake 里由测试自己 set，判不出「真跑起来的才可发现」。
  #   3. `Watch` 依赖真 watch 的事件序列（informer 缓存不与已存在的对象重放）。
  # 这三条正是这个后端的产品语义，所以证据只能来自真 apiserver。
  integration-kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
      # 版本与本机取证一致（kind v0.27.0 + kindest/node:v1.31.0）。该组合下
      # registry/kubernetes 三条真机判据全绿，且五条变异各自把对应判据打红。
      KIND_VERSION: "v0.27.0"
      K8S_NODE_IMAGE: "kindest/node:v1.31.0"
      K8S_CLUSTER: "bald-e2e"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"

      - name: 起 kind 集群（kubernetes 后端要真 apiserver + kubelet）
        run: |
          set -e
          bindir="${RUNNER_TEMP}/bin"
          mkdir -p "$bindir"
          curl -fsSL -o "${bindir}/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          chmod +x "${bindir}/kind"
          echo "$bindir" >> "$GITHUB_PATH"
          # --wait 180s 等控制面就绪；失败时打出控制面容器日志再退出——集群没起来
          # 时这是唯一线索，否则只能看到「kind create failed」一句话。
          if ! "${bindir}/kind" create cluster --name "${K8S_CLUSTER}" \
              --image "${K8S_NODE_IMAGE}" --wait 180s; then
            echo "--- 控制面容器日志（集群没起来时唯一的线索）---"
            docker logs "${K8S_CLUSTER}-control-plane" 2>&1 | tail -40
            exit 1
          fi
          "${bindir}/kind" get kubeconfig --name "${K8S_CLUSTER}" > "${RUNNER_TEMP}/kubeconfig"
          echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig" >> "$GITHUB_ENV"

      - name: API 探活（探不到即失败，不放行成 Skip）
        run: |
          set -e
          # kubernetes 没有明文 TCP 端口可探：apiserver 是 HTTPS 且自签证书。
          # /version 允许匿名读（本机 kind 实测），拿它当就绪探针正好——kind --wait
          # 已等过 Ready，这一条防的是「集群起来了但 API 打不通」那类半死状态。
          # 这一条不能省：测试的形状是「连不上即 Skip」，没有它整个作业会在
          # 零证据的情况下变绿。
          k8s_api=$(kind get kubeconfig --name "${K8S_CLUSTER}" | sed -n 's/.*server: //p' | head -1)
          tries=60
          while [ "$tries" -gt 0 ]; do
            if curl -fsSk --max-time 3 "${k8s_api}/version" >/dev/null; then
              echo "READY kubernetes (${k8s_api})"
              break
            fi
            tries=$((tries - 1))
            sleep 2
          done
          if [ "$tries" = 0 ]; then
            echo "::error::kubernetes 未就绪（${k8s_api}）"
            exit 1
          fi

      - name: 集成套件（非 -short，逐条判据留档）
        run: |
          set -e
          mkdir -p /tmp/int
          mkdir -p /tmp/int-cov
          # registry/kubernetes/contract 不是独立 module（无自己的 go.mod），
          # 父模块的 ./... 已把它带上
          (cd registry/kubernetes && go mod download && go test -count=1 -timeout 10m -covermode=atomic -coverprofile=/tmp/int-cov/registry-kubernetes.out -v ./... > /tmp/int/registry-kubernetes.log 2>&1) || { cat /tmp/int/registry-kubernetes.log; exit 1; }
          cat /tmp/int/registry-kubernetes.log

      - name: 判据必须真的跑过（Skip 不算通过）
        run: |
          set -e
          # 每条格式 <日志>|<测试名>；名字来自上一步的 -v 输出。同 §7.1 的
          # integration 作业：**这个字符串里只能放判据行**，注释写在外面。
          EXPECTED="
          /tmp/int/registry-kubernetes.log|TestRegister_WritesPodIdentityAndDiscovery
          /tmp/int/registry-kubernetes.log|TestDeregister_RemovesPodFromDiscovery
          /tmp/int/registry-kubernetes.log|TestGetService_ExcludesNonRunningPod
          "
          # 三条各钉一件只有真 apiserver 能判的事：
          #   Register → 标签/注解/端点往返 + Watch 收到（注册方向）
          #   Deregister → 标签与注解真的被删掉、发现侧随后列不到（注销方向；
          #     这条是 §7.1 那个「自校验闸门类起就没生效过」缺陷的回归）
          #   非 Running Pod 被 phase 过滤（不依赖测试自己伪造的 phase 也要成立）
          miss=0
          for row in $EXPECTED; do
            [ "$row" = "" ] && continue
            case "$row" in
              *"|"*) ;;
              *)
                echo "::error::EXPECTED 里有非 <日志>|<测试名> 的项：「$row」——注释别写进这个字符串"
                miss=$((miss + 1))
                continue
                ;;
            esac
            log=${row%%|*}
            name=${row##*|}
            if grep -q -- "--- PASS: $name" "$log"; then
              echo "PASS  $name  ($log)"
            else
              echo "::error::判据 $name 没有 PASS 记录（Skip / 改名 / 未编译都会落到这里）"
              miss=$((miss + 1))
            fi
          done
          if [ "$miss" != 0 ]; then
            echo "--- 留档输出（便于看是 Skip 还是没跑）---"
            grep -E '^(--- (SKIP|FAIL|PASS)|ok|FAIL)' /tmp/int/*.log | tail -60
            exit 1
          fi

      - name: 上传 kubernetes 集成腿覆盖率 profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cov-integration-kubernetes
          path: /tmp/int-cov/
          if-no-files-found: warn

  # 示例应用的端到端腿（风险登记册 §7.1 里最后一条「只在本地跑」的判据）。
  # `integration` 作业的头注释原先写的是「要做就是独立一个 `example` 作业」，理由当时有两条，
  # 现在都还成立：
  #   1. 失败面不同。这一条要先装 buf、再 `buf generate` 出 gitignore 的 `_example/bald/api/gen`
  #      才编译得了——红的时候是「BSR 拉不到 / 插件版本漂」，与核心模块的代码红是两件事。
  #      混进 `integration` 就等于让平台抖动定期作废 etcd/consul/redis/mongo 那四条腿的取证。
  #   2. 覆盖面上它是空白。`_example` 以下划线开头且是独立 module，Go 工具链不发现它，
  #      `scripts/list-modules.sh`（test/race/lint/vuln 四条主循环的唯一清单出处）也按设计排除它，
  #      所以这个 module 此前**一条远端证据都没有**——`task example-e2e` 只在作者本机跑。
  #
  # buf 从哪来：与 `proto-contract` 作业同一把、同一个脚本（版本读 `bconf/buf.version`、
  # 摘要读 `bconf/buf.sha256`）。装两次内联逻辑时「一处改了摘要另一处没改」不会报错，
  # 只会让某条作业在错误的二进制上跑绿。
  #
  # 为什么 `buf generate` 前面不加 `buf dep update`（Taskfile 的 proto-example 有）：`dep update`
  # 是给本地「刚改 buf.yaml 想立刻重解析」用的，它会重写受版本管理的 `buf.lock`。CI 要的是
  # 「按已锁定的依赖生成」，而 buf.lock 已入库，所以只跑 generate；紧接着判一条
  # `git diff --quiet -- _example/bald/api`——生成这步若动到任何受管理文件（第一个可能就是
  # buf.lock），说明 pin 在没人决定的情况下漂了，先响在这里而不是响在后面某条用例的错误里。
  #
  # 三态构建与各自的判据（本机实测 2026-11-04，名字取自各步 `-v` 原文）：
  #   默认态    13 条（两个角色的 e2e + etcd/nacos 服务发现 + 契约限流/超时 + env 覆盖）
  #   grpcgw    10 条（转码面那一套：register_grpcgw.go 只在带这个 tag 时参与编译）
  #   nacos      1 条（装配真机判据，见下面那条单独的注释）
  # `internal/apiserver` 的 `TestBizLayerImportsAreBusinessOnly` **不进 EXPECTED**：它的 Skip
  # 条件是「`internal/apiserver/biz` 目录不存在」（gen domain 才会种它），与服务和工具链无关，
  # 本地和 CI 一样 Skip——把它写进判据表等于造一条永远红的行。
  #
  # 三档防「静默失效」与 `integration` 作业同构：服务探活失败即作业失败（这批用例的写法是
  # 「不可达即 Skip」）；逐套件 `-v` 留档；末尾按 EXPECTED 逐条断言真的出现 `--- PASS`。
  # nacos 那条的探活除 8848 外还判 **9848**：SDK v2 的 naming 走 gRPC（8848+1000），只映射
  # HTTP 口时服务看着活着、注册却静默上不去，红点会落在「注册后 N 秒内不可见」这种看着像
  # 时序问题的地方。
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
      # 两个后端地址显式给（测试里的默认值恰好也是这两个，但作业不靠默认值成立）。
      # 装配那条用例不吃 BALD_E2E_NACOS_ADDR——它跟着契约文件 `registry.nacos.server_addrs`
      # 走，另有漂移判据，见 _example/bald/internal/bootstrap/nacos_assembly_e2e_test.go。
      BALD_E2E_ETCD_ADDR: "127.0.0.1:2379"
      BALD_E2E_NACOS_ADDR: "127.0.0.1:8848"
    services:
      etcd:
        # 与 `integration` 作业同一镜像、同一 env 形状（命令行参数不能写成 `args`，
        # services 只认 credentials/env/image/options/ports/volumes，多任何键整个文件被拒）。
        image: quay.io/coreos/etcd:v3.5.14
        ports: ["2379:2379"]
        env:
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2379
      nacos:
        image: nacos/nacos-server:v2.3.2
        ports: ["8848:8848", "9848:9848"]
        env:
          MODE: standalone
          NACOS_AUTH_ENABLE: "false"
          JVM_XMS: 256m
          JVM_XMX: 512m
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"

      - name: 装 pin 的 buf（与 proto-contract 作业同源，摘要按 bconf/buf.sha256 校验）
        run: |
          set -e
          sh scripts/install-buf.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: 生成示例的 proto 产物（api/gen 是 gitignore 的，干净检出没有）
        run: |
          set -e
          export PATH="$RUNNER_TEMP/bin:$PATH"
          buf --version
          (cd _example/bald/api && buf generate)
          # 生成不该动任何受版本管理的文件：动了 = buf.lock / buf.yaml 这层 pin 漂了。
          if ! git diff --quiet -- _example/bald/api; then
            echo "::error::buf generate 改动了受版本管理的文件——先看 git status，多半是 buf.lock 被重解析了"
            git status --porcelain -- _example/bald/api
            git diff --stat -- _example/bald/api
            exit 1
          fi
          ls _example/bald/api/gen >/dev/null

      - name: 服务探活（探不到即失败，不放行成 Skip）
        run: |
          set -e
          wait_tcp() { # host port 名称 [尝试次数，默认 60 次 ×2s]
            local host="$1" port="$2" name="$3" tries="${4:-60}"
            while [ "$tries" -gt 0 ]; do
              if (echo > "/dev/tcp/$host/$port") 2>/dev/null; then
                echo "READY $name ($host:$port)"
                return 0
              fi
              tries=$((tries - 1))
              sleep 2
            done
            echo "::error::$name 未就绪（$host:$port）"
            return 1
          }
          wait_tcp 127.0.0.1 2379 etcd
          wait_tcp 127.0.0.1 8848 nacos 90
          # 9848 单独判一次：nacos v2 SDK 的 naming 走 gRPC（8848+1000）。这一条是
          # 「半死的 nacos」唯一的线索——8848 活着而 9848 不通时，注册静默失败。
          wait_tcp 127.0.0.1 9848 nacos-grpc

      - name: 示例套件（三态构建，逐条判据留档）
        run: |
          set -e
          mkdir -p /tmp/ex
          # -tags nacos 那一态只跑装配那条，形状取自用例文件头注释里的命令。整包（或
          # `-run 'TestE2E_|TestGateway|^TestNacosDiscovery|…Assembly'` 这种并集）不拆的理由是
          # nacos-sdk-go 自己的**进程内**令牌桶（config_client/limiter.go:42-56：`rate.NewLimiter(5, 5)`，
          # 按 `dataId@@group@@namespace` 分键，`checker` 是包级变量 ⇒ 同进程所有 ConfigClient 共用）。
          # 超出桶的查询**不发包**就被本地拒掉，串是 `ConfigQueryRequest is limited`；同一构建形态里
          # 每条用例起的应用都带一个 nacos 配置 client，一次启动就是一次查询。实测：整包 13 用例共
          # 9 次 Load 全落在同一个键上，最密一段是 300ms 里 5 次——正卡在桶容量上，没有余量；同键
          # 并发 10 次 Load 的对照里，无重试时 10 个有 5 个直接判错（§7.13）。
          # 归因错过两次：先前记的「服务端按请求类型限流」和「SDK 按 ip:port 复用连接」都不成立——
          # 拒绝在客户端本地（纯调 IsLimited、零网络也能复现），连接也各用各的（uid 每 client 一个随机
          # UUID）。`bconfig/nacos.Load` 现已带上界重试，但重试把突发摊开而不是消掉它，故形态照旧。
          # 这不是把判据调窄到能过：现状（task example-e2e）根本不含 nacos 态，这一条是净增。
          (cd _example/bald && go mod download \
            && go test ./... -count=1 -timeout 10m -v > /tmp/ex/default.log 2>&1) || { cat /tmp/ex/default.log; exit 1; }
          (cd _example/bald && go test -tags grpcgw ./... -count=1 -timeout 10m -v > /tmp/ex/grpcgw.log 2>&1) || { cat /tmp/ex/grpcgw.log; exit 1; }
          (cd _example/bald && go test -tags nacos ./internal/bootstrap -run '^TestNacosAssemblyRegistersIntoBackend$' -count=1 -timeout 10m -v > /tmp/ex/nacos.log 2>&1) || { cat /tmp/ex/nacos.log; exit 1; }
          grep -E '^(--- (SKIP|FAIL|PASS)|ok|FAIL)' /tmp/ex/*.log

      - name: 判据必须真的跑过（Skip 不算通过）
        run: |
          set -e
          # 每条格式 <日志>|<测试名>；同 integration 作业的口径——**这个字符串里只能放判据行**，
          # 注释写在外面（按空白拆词，注释混进来会被当成假判据，整个作业判红且报错难懂）。
          EXPECTED="
          /tmp/ex/default.log|TestGreet_REST_GeneratedBinding
          /tmp/ex/default.log|TestGatewayBackendViaDiscovery
          /tmp/ex/default.log|TestGatewayDiscoveryEtcdWatchPush
          /tmp/ex/default.log|TestGatewayDiscoveryNacosWatchPush
          /tmp/ex/default.log|TestNacosDiscoveryNameCarriesSchemeSuffix
          /tmp/ex/default.log|TestE2E_HTTPContractRateLimit
          /tmp/ex/default.log|TestE2E_HTTPContractTimeout
          /tmp/ex/default.log|TestE2E_GRPCContractRateLimit
          /tmp/ex/default.log|TestE2E_GRPCContractTimeout
          /tmp/ex/default.log|TestE2E_HTTPContractCircuitBreaker
          /tmp/ex/default.log|TestE2E_HTTPCircuitBreakerAbsentDoesNotTrip
          /tmp/ex/default.log|TestE2E_GRPCContractCircuitBreaker
          /tmp/ex/default.log|TestE2E_EnvOverridesContractCircuitBreaker
          /tmp/ex/default.log|TestE2E_EnvOverridesContractRateLimit
          /tmp/ex/default.log|TestE2E_EnvOverridesContractGRPCRateLimit
          /tmp/ex/default.log|TestClientGRPCSegmentReachesSelf
          /tmp/ex/default.log|TestPlan_ReferenceProject
          /tmp/ex/default.log|TestLoggerProviderMasksAttrAndTagsServiceName
          /tmp/ex/grpcgw.log|TestWorkerRoleServesGRPCOnly
          /tmp/ex/grpcgw.log|TestUnknownRoleFailsToAssemble
          /tmp/ex/grpcgw.log|TestGreet_ValidRequest
          /tmp/ex/grpcgw.log|TestGreet_ProtoAnnotationRules
          /tmp/ex/grpcgw.log|TestGreet_CustomValidator
          /tmp/ex/grpcgw.log|TestGreet_REST_SharesSameRules
          /tmp/ex/grpcgw.log|TestGreet_ErrorMessageIsStructured
          /tmp/ex/grpcgw.log|TestHealthProbesE2E
          /tmp/ex/grpcgw.log|TestPlan_ReferenceProject
          /tmp/ex/grpcgw.log|TestLoggerProviderMasksAttrAndTagsServiceName
          /tmp/ex/nacos.log|TestNacosAssemblyRegistersIntoBackend
          "
          miss=0
          for row in $EXPECTED; do
            [ "$row" = "" ] && continue
            case "$row" in
              *"|"*) ;;
              *)
                echo "::error::EXPECTED 里有非 <日志>|<测试名> 的项：「$row」——注释别写进这个字符串"
                miss=$((miss + 1))
                continue
                ;;
            esac
            log=${row%%|*}
            name=${row##*|}
            if grep -q -- "--- PASS: $name" "$log"; then
              echo "PASS  $name  ($log)"
            else
              echo "::error::判据 $name 没有 PASS 记录（Skip / 改名 / 未编译都会落到这里）"
              miss=$((miss + 1))
            fi
          done
          if [ "$miss" != 0 ]; then
            echo "--- 留档输出（便于看是 Skip 还是没跑）---"
            grep -E '^(--- (SKIP|FAIL|PASS)|ok|FAIL)' /tmp/ex/*.log | tail -80
            exit 1
          fi

  # 声明式装配验收（设计 §7.2 的主门；登记册 §8 最后半条「acceptance 没有任何 CI
  # 作业调用它」的收口）。本地与 CI 同一条脚本、同一份判据表，只有 scope 不同。
  #
  # 为什么不把原来那五条 `go test -run` 直接搬进来：`-run` 命中 0 个测试**返回 0**。
  # 用例改名/被删/正则写错时作业照样绿——本仓库被这类静默失效咬过两次（§7.1 的
  # 「不可达即 Skip」、§8 的 per-command `dir`）。脚本改成先 `go test -list` 取
  # 清单、再逐条断言顶层 `--- PASS`，判据来自清单而不是手写表格，增删用例不用改这里。
  #
  # scope=ci 刻意不含两条本地腿：`_example/bald` 的计划两态要编译 gitignore 的
  # proto 产物；`bconf` 的产物字节一致判据绑工具链——具体是**编译 protoc-gen-go 用的
  # Go**（go1.26.5 给中文注释补空格、go1.27.x 不补；buf 版本号实测对字节中性）。
  # 后者**不是「没有远端证据」**：装工具链这件事由下面的 `proto-contract` 作业专职做，
  # 本作业不重复装第二遍。理由逐条写在 scripts/acceptance-gate.sh 头。
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"

      - name: 声明式装配验收（清单来自 -list，判据必须出现顶层 PASS）
        run: bash scripts/acceptance-gate.sh ci

  # 契约层字节判据进 CI（风险登记册 §7.9 未闭合①，第五轮落地）。这条腿判的是「用登记
  # 过的工具链重出 bconf/proto 的产物，与入库的 gen/go 逐字节一致」。它此前只在本机跑，而
  # 「buf 不在 PATH 即 t.Skip」使 CI 永远看不见它——正是 §7.12 记的那类「本地腿没有
  # 远端证据」的形状。
  #
  # 为什么三把 pin 现在只需要 runner 装一把：§7.9 第四轮把进字节的变量收窄到**编译
  # protoc-gen-go 用的那把 Go**（go1.26.5 给中文注释补空格、go1.27.x 不补；buf 的版本号
  # 与来源实测对字节中性），第六轮又把另两把从 PATH 搬进仓内——插件由 `bconf/go.mod`
  # 现编（`selfBuiltPlugin`），于是判据读的三把工具全是仓内可审的出处：
  # ① buf 版本 = `bconf/buf.version`（本作业用 `scripts/install-buf.sh` 按 `bconf/buf.sha256` 装）；
  # ② 插件 module 版本 = 那把自编译二进制自报的 v，比入库产物头部的 `protoc-gen-go v…` 行；
  # ③ 编译插件的 Go major.minor = 同一把二进制的 `go version -m`，比 `bconf/protoc-gen-go.goversion`。
  # ②③ 旧形状读的是 PATH 上**已安装**的那把插件，所以「本机 PATH 里那把哪年装的」能
  # 冒充判据通过或判红（§7.9 前四轮都栽在这上面）；改成自编译后 PATH 里的插件不再参与。
  # 判据在字节比对之前先逐轴比，任何一把不符先响在那把工具上，不是「用工具链换一条绿」。
  #
  # 本机同形状的取证（2026-11-04）：`go test -C bconf -run TestGeneratedMatchesProto` 三轮
  # `ok`；三条变异各只打中一轴——PATH 放一把假版本插件 → 照样 `ok`（证明 PATH 已出局）、
  # `bconf/go.mod` 的 protobuf 退回 v1.36.11 → 红在第二轴（v1.36.11 编出的插件自报版本
  # 与产物头部 v1.36.12 不符）、`bconf/protoc-gen-go.goversion` 改成 9.99 → 红在第三轴。
  # 第二轴那条是改造前**根本测不到**的洞：旧腿读 PATH 上 v1.36.12 的插件，仓内 pin 与
  # 产物头部不一致时会静默通过。
  #
  # 远端绿证（2026-11-04 的 main push run 41862216627，本作业 job 126686830899 = success）：
  # 这条腿在这个作业里的结构就是「runner 只有 Go 和 buf，PATH 上没有 protoc-gen-go」，所以
  # 它绿不可能来自 PATH——上面那条「假版本插件照样 ok」的变异在远端等价成立。判据日志给出
  # 真 `--- PASS: TestGeneratedMatchesProto (3.02s)`；那 3.02s 里含测试自己 `go build` 插件的
  # 一次编译（第六轮前由作业步预装、同一处 0.15s），删掉预装步后这个时长本身就是插件出自仓内的旁证。
  proto-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"

      # 装 buf 的口径都收在 scripts/install-buf.sh 里：版本读 bconf/buf.version（与判据
      # 同一出处，不在这里抄第二份），完整性读 bconf/buf.sha256，架构由 uname 选 asset。
      # 这个脚本同时被下面的 `example` 作业用——两处装的 buf 必须同源同摘要，内联两份时
      # 「一处改了摘要另一处没改」不会报错，只会让某个作业在错误的二进制上跑绿。
      # 判据本身不校验来源——本机怎么装（Homebrew、源码、官方发行）不该被一条字节判据
      # 绑死（§7.9 未闭合③）；但 runner 下载的是公网资产，所以必须校验摘要而不是「下到就算装好」。
      - name: 装 pin 的 buf（官方发行二进制，按 bconf/buf.sha256 校验）
        run: |
          set -e
          sh scripts/install-buf.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # 与 `integration` 作业同一条口径：跑完还要断言「这条判据真的产生了顶层 PASS」。
      # 只 `go test` 不看日志的话，工具链没装上（→ Skip）或用例改名都会留下一片绿。
      # 插件不在这一步装：判据自己在 `bconf` 模块里 `go build` 出 protoc-gen-go，
      # 并把它的目录前置进 `buf generate` 的 PATH——所以这里只需要装 buf。
      - name: 字节判据必须真的跑过（Skip 不算通过）
        run: |
          set -e
          export PATH="$RUNNER_TEMP/bin:$PATH"
          if ! (cd bconf && go mod download && go test . -run TestGeneratedMatchesProto -count=1 -timeout 10m -v) \
            > /tmp/proto-contract.log 2>&1; then
            cat /tmp/proto-contract.log
            echo "::error::bconf 的契约层字节判据失败（三把 pin 不符 / 产物与 proto 不一致）"
            exit 1
          fi
          if ! grep -qE '^--- PASS: TestGeneratedMatchesProto \(' /tmp/proto-contract.log; then
            echo "::error::TestGeneratedMatchesProto 没有顶层 PASS 记录（Skip / 改名 / 用例被删都会落到这里）"
            grep -E '^(    )?(--- )?(SKIP|FAIL|PASS|BENCH|RESULT): TestGeneratedMatchesProto' /tmp/proto-contract.log || true
            tail -20 /tmp/proto-contract.log
            exit 1
          fi
          cat /tmp/proto-contract.log

  # 静态检查：golangci-lint 逐模块运行（清单来自 scripts/list-modules.sh，零维护）。配置在根
  # .golangci.yml，子模块目录会向上发现；新增模块无需改本 job。
  lint:
    runs-on: ubuntu-latest
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"

      # 版本 pin：升级 lint 规则集是显式动作，避免上游新检查静默漂移。
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: golangci-lint all modules
        run: |
          # 不 fail-fast：与 test/race/vuln 作业同形（§7.40）。lint 的失败常常
          # 是规则升级或新代码把同一模式复制到多个模块，第一个红即停会让
          # 「这次要改几处」无从得知。
          # 派生为空即失败：清单吐空时循环零次并 exit 0——静默绿。
          failed=""
          failed_count=0
          mods=$(sh scripts/list-modules.sh)
          if [ -z "$mods" ]; then
            echo "::error::lint 闸门失败：模块清单派生为空，一个字都没扫"
            exit 1
          fi
          for mod in $mods; do
            echo "=== lint: $mod ==="
            # 下载与 lint 分开记账：runner 网络瞬断不能被读成代码缺陷。
            n=0
            downloaded=0
            while true; do
              if (cd "$mod" && go mod download); then downloaded=1; break; fi
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "::error::$mod 依赖下载失败"; break; fi
              echo "::warning::$mod 依赖下载瞬断，15s 后重试（第 $n/2 次）"
              sleep 15
            done
            if [ "$downloaded" -ne 1 ]; then failed="$failed $mod:download"; failed_count=$((failed_count+1)); continue; fi
            if ! (cd "$mod" && golangci-lint run ./...); then
              failed="$failed $mod:lint"; failed_count=$((failed_count+1))
            fi
          done
          if [ -n "$failed" ]; then
            # 计数用显式累加器，理由同 vuln 作业（SC2086 + wc 读数的平台差）。
            echo "### FAILED MODULES ($failed_count):$failed"
            echo "::error::lint 闸门失败：$failed_count 个模块判红:$failed"
            exit 1
          fi

  # 漏洞门禁：govulncheck 只报告「代码真正可达」的漏洞（非模块级清单），
  # 因此可以 fail-closed；标准库漏洞由 setup-go 的补丁版本修复。
  vuln:
    runs-on: ubuntu-latest
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: govulncheck all modules
        run: |
          # 不 fail-fast：一个模块判红就把后面几十个模块都不跑，等于把「这次发布的 CVE 波及几个模块」
          # 这个信息整个丢掉（实测 2026-11-06：闸门停在 broker/kafka，另外 6 个模块没被跑过）。
          # 下载失败与真漏洞分开记账，免得 runner 网络瞬断被读成 CVE。
          # 派生为空即失败：清单脚本一旦吐空，下面这个循环跑零个模块并 exit 0——静默绿。
          # （实测踩出来过：桩脚本写成数据文件而非 echo 脚本时，整轮访问 0 个模块、闸门仍然绿。）
          failed=""
          failed_count=0
          mods=$(sh scripts/list-modules.sh)
          if [ -z "$mods" ]; then
            echo "::error::vuln 闸门失败：模块清单派生为空，一个字都没扫"
            exit 1
          fi
          for mod in $mods; do
            echo "=== vuln: $mod ==="
            n=0
            downloaded=0
            while true; do
              if (cd "$mod" && go mod download); then downloaded=1; break; fi
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "::error::$mod 依赖下载失败"; break; fi
              echo "::warning::$mod 依赖下载瞬断，15s 后重试（第 $n/2 次）"
              sleep 15
            done
            if [ "$downloaded" -ne 1 ]; then failed="$failed $mod:download"; failed_count=$((failed_count+1)); continue; fi
            if ! (cd "$mod" && govulncheck ./...); then failed="$failed $mod:vuln"; failed_count=$((failed_count+1)); fi
          done
          if [ -n "$failed" ]; then
            # 计数用显式累加器，不用 `printf '%s\n' $failed | wc -l`：后者依赖词分割，
            # 会被 actionlint 的 shellcheck 腿按 SC2086 判红（实测 2026-11-06 的
            # workflow-lint 作业——本机没装 shellcheck 时那条腿静默缺席，见 §7.30），
            # 而且 `wc` 的左补空还要分 BSD/GNU 两种读数。
            echo "### FAILED MODULES ($failed_count):$failed"
            echo "::error::vuln 闸门失败：$failed_count 个模块判红:$failed"
            exit 1
          fi

  # 覆盖率并集（advisory——100% 计划的闸门地基，本阶段不阻断）。
  # 把 test(-short) / integration / integration-kubernetes 三处各腿的 coverprofile
  # 合并成「全腿并集」，逐包出表 + 聚合（口径同 scripts/coverage.sh：手写代码，排除
  # 生成物/main/mocks；同一 block 跨腿取命中最大值，不是求和）。
  # 为什么本地测不出这个数：多数集成强相关包要真后端才跑用例，且 transport/* 那批
  # 非 -short 是等信号手动例会（本地去掉 -short 会挂）——所以「100%」的真相只能在
  # CI 的多腿并集里读。
  # 为什么整条作业不判红：地基阶段先攒趋势与逐包缺口；逐包补到 100% 后，再把下面
  # coverage.sh 的调用加上 `--gate 100` 翻成硬门（届时 remove continue-on-error）。
  # checkout 之外的步全设 continue-on-error——下载/artifact 缺失属平台面，不该把 main 弄红。
  coverage:
    needs: [test, integration, integration-kubernetes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 下载三处覆盖率 profile 并合并到同目录
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: cov-*
          path: /tmp/cov-all
          merge-multiple: true

      - name: 覆盖率并集报表（advisory，不判红）
        continue-on-error: true
        run: |
          {
            echo "## 覆盖率并集（advisory，手写代码，排除生成物/main/mocks）"
            echo '```'
            bash scripts/coverage.sh --merge /tmp/cov-all
            echo '```'
          } | tee "$GITHUB_STEP_SUMMARY"
