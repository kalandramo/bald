# ci：全模块 build + vet + test + tidy + lint + vuln 闸门（模块自动发现，零维护）。
# 说明：
# - 多模块仓库：模块清单只有一条派生 —— `scripts/list-modules.sh`（本地 Taskfile
#   的 lint/vuln/race/verify 消费同一个脚本，两侧覆盖范围不可能漂移）。清单为空
#   时脚本自身非零退出，闸门不会静默失效。`_example` 是验证用独立 module
#   （GOFLAGS=-mod=mod 特殊装载），由脚本排除、由 Taskfile 的 example-* 任务覆盖。
# - 根模块 vet 降级 -copylocks=false：appkit hotReload 的 `*cfg = *candidate`
#   proto 顶层浅拷贝是既定设计（字段皆指针、无别名问题，见 bootstrap.go
#   注释），MessageState 含 Mutex 属 vet 误报区。
# - go test -short + -timeout 5m：-short 跳过集成测试（各模块
#   testing.Short() 惯例）；超时防挂死测试拖垮整个 job。
#   「-short 之外」不是没人管：integration 作业按套件点名注入 etcd/consul/redis/mongo
#   跑非 -short 用例，integration-kubernetes 作业另起真 kind 集群跑 registry 的第三条
#   后端腿，两侧都以「判据必须出现 PASS」兜住不可达即 Skip 的静默失效（见各 job 注释）。
# - 基准冒烟：每模块追加 go test -bench . -benchtime=1x -run '^$'——编译
#   并单迭代跑一轮基准，拦「基准编译坏/基准 panic」回归；无基准 module
#   空跑零成本。分配剖面回归由各包 alloc_guard_test.go 随 -short 主循环
#   守卫，不经 CI 解析基准输出。
# - 端到端计时（TestTree_EndToEndTimed / TestTree_AuthzClosedLoop：
#   gen→tidy→build→serve→停机）分钟级墙钟且起真实服务，不适合 -short
#   主循环：测试内 testing.Short 跳过，循环后独立 step 全跑。
# - 依赖面闸门：循环内 go mod tidy -diff，go.mod/go.sum 与代码 import
#   漂移即红；-diff 只报告不落盘，不影响后续 build。
# - lint 门禁：golangci-lint 按模块循环（配置在根 .golangci.yml，子模块
#   目录自动向上发现）；只拦正确性/死代码，风格交给 gofmt。
# - 漏洞门禁：govulncheck 按模块扫描「代码可达」漏洞（stdlib 漏洞随
#   setup-go 的补丁版本修复；依赖漏洞升到 fixed 版本）。
# - 依赖预下载 + 3 次重试：proxy.golang.org 偶发 HTTP/2 中流 INTERNAL_ERROR，
#   下载完成后 build/vet/test 全程离线稳定。
# - GOPROXY 主源 goproxy.io：proxy.golang.org 在 GitHub runner（Azure US）
#   上对大依赖包的中流 HTTP/2 错误持续复现，且 | 故障转移不覆盖该错误类；
#   保留 proxy.golang.org 为备源（连接级错误可转移）。sumdb 校验不受
#   proxy 切换影响。
# - 改本文件后先跑 `task ci-workflow-lint`：GitHub 在编译期解析作业文件，未
#   登记的键（如 services 下的 args）整个文件被拒，只留「workflow file
#   issue」+ 0 个 job，通用 YAML 解析器看不出问题。同内容闸门在
#   .github/workflows/workflow-lint.yml（独立文件才可能报告本文件的失败）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 逐模块的 tidy/build/vet/test 全部必须是「发布形态」判据。go.work 会把同仓依赖
# 改吃磁盘代码（§3.3 那类 published-form 判据随之失效），而 B-iii 允许本地放一个
# 不入库的 go.work 用于 cli+bconf 联合开发。这里显式关死：CI 的判据不受工作区影响。
# 检出里没有 go.work 时 GOWORK=off 是无害 no-op。
env:
  GOWORK: "off"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 主源 goproxy.io、备源 proxy.golang.org（理由见文件头）
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: build + vet + test all modules
        run: |
          set -e
          # 失败时在日志中打出所在模块（自诊断）
          trap 'echo "### FAILED AT MODULE: $mod"; echo "::error::FAILED AT MODULE: $mod"' ERR
          for mod in $(sh scripts/list-modules.sh); do
            echo "=== $mod ==="
            # 预下载依赖（重试 3 次防 proxy 瞬断），之后构建/测试离线稳定
            n=0
            while true; do
              if (cd "$mod" && go mod download); then break; fi
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "::error::$mod 依赖下载失败"; exit 1; fi
              echo "::warning::$mod 依赖下载瞬断，15s 后重试（第 $n/2 次）"
              sleep 15
            done
            # 依赖面闸门：漂移即红（前置依赖已 download，解析全图不额外拉网）
            (cd "$mod" && go mod tidy -diff)
            if [ "$mod" = "." ]; then
              (cd . && go build ./... && go vet -copylocks=false ./... && go test -short -timeout 5m ./... && go test -bench . -benchtime=1x -run '^$' ./...)
            else
              (cd "$mod" && go build ./... && go vet ./... && go test -short -timeout 5m ./... && go test -bench . -benchtime=1x -run '^$' ./...)
            fi
          done

      - name: TestTree_EndToEndTimed / TestTree_AuthzClosedLoop (outside -short)
        # codegen 自 B-iii（risk-review.md §3.4）起住在 cli module 里，须在该目录执行。
        working-directory: cli
        run: go test ./internal/codegen/ -run 'TestTree_(EndToEndTimed|AuthzClosedLoop)' -count=1 -timeout 15m

      - name: 真实示例的装配骨架与声明不漂移（gen app --check）
        # 上面那步吃的是合成声明；这条钉的是 _example/bald 这份**真实**声明。
        # 判据是逐字节比对（含清单的 spec 摘要），改声明忘了重生成会当场红。
        # --check 不写文件、不跑 proto 阶段，因此不需要 buf/protoc。
        # 域那半边（gen domain --check）**不在这里**：bind 文件的前置是 proto 的
        # Go 产物，而 _example/bald/api/gen 已 gitignore，干净检出里没有——实跑
        # 红在 `bindings import proto Go package ..., but its generated Go files
        # are missing`。--no-bind 也不是替代（它改期望文件集合，已入库的 bind/路由
        # 被判 stale）。该面拆成两处：清单与磁盘字节的比对在
        # cli/internal/codegen/example_manifest_test.go（随上面的 go test 跑），
        # 重算级校验在需要 buf 的 task acceptance-example-domain-check。见 §8。
        working-directory: cli
        run: go run ./cmd/bald gen app --spec ../_example/bald/appspec.json --out ../_example/bald --check

  # 竞态门禁：普通 test 不启用 race detector，session manager / 热重载 /
  # 计划缓存 / 限流器等并发路径的竞争只能在这里被发现（代码注释里的
  # 「-race 可检出」不是保险）。
  # 范围 = `scripts/list-modules.sh` 派生的全部 module 减去 .github/race-skip.txt，
  # 与 test / lint / vuln 作业同源、与本地 `task race` 同一条派生 + 同一份排除清单。
  # 默认值是「跑」而不是「不跑」：新增 module 无需改这里，也不再维护第二份清单。
  # 零测试文件的 module 只多付一次竞态化构建的成本（go test 打 no test files）。
  race:
    runs-on: ubuntu-latest
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: go test -race (all modules)
        run: |
          set -e
          trap 'echo "### FAILED AT MODULE: $mod"; echo "::error::FAILED AT MODULE: $mod"' ERR
          mods=$(sh scripts/list-modules.sh | grep -vxF -f .github/race-skip.txt)
          # 派生为空 = 这个闸门静默失效（find 谓词或排除清单被改坏），必须响。
          if [ -z "$mods" ]; then echo "::error::race 清单派生为空，闸门未覆盖任何 module"; exit 1; fi
          for mod in $mods; do
            echo "=== race: $mod ==="
            (cd "$mod" && go mod download && go test -short -race -timeout 10m ./...)
          done

  # 集成作业（风险 §7.1）：注入真服务，跑「非 -short」的那批用例——registry / store /
  # 队列三条接缝各至少一条（registry 现为 etcd + consul + kubernetes 三个后端；前两个
  # 由本作业的 `services:` 注入，第三个要真 apiserver，独立成 `integration-kubernetes`，
  # 理由见那个作业的注释）。
  #
  # 为什么不是把 test 作业改成非 -short：`transport/{redis,kafka,rabbitmq,rocketmq,tcp,webrtc}`
  # 的 `TestServer`/`TestClient` 是等信号的手动用例（非 -short 会挂到 timeout），主循环必须
  # 留在 -short。这里按套件点名跑，清单外的包一概不碰。
  #
  # 刻意不含 `_example/bald`：那里的 etcd/nacos 服务发现端到端**只在本地跑**（README 有可复制
  # 命令）。原先挡住它的第一条原因（go.mod 把两个 kratos contrib 模块 replace 到**仓库外**的同级
  # 检出，干净检出连模块图都装载不出来）已在 2026-11-04 撤除——示例现在只用仓内模块，实测干净
  # 检出 `go mod download` 与 `go list -m all` 都通过。剩下的两条是真的：
  #   1. `_example/bald/api/gen` 是 gitignore 的 proto 产物，干净检出里没有；要先 `buf dep update`
  #      + `buf generate` 才编译得了（本机实测：产物生成后 `go test ./...` 默认构建全绿）。
  #      也就是要 pin buf 版本并放开到 BSR 的网络——与 §7.9 的工具链 pin 同一件事。
  #   2. 那几条用例要真 etcd/真 nacos 才有意义。这一半已经动过刀：nacos 的**机制**判据
  #      （注销走对服务名、契约 cleanup 真关 client）不依赖 proto 产物，已下沉到
  #      registry/nacos/contract 并由本作业的 nacos 服务容器判；留在示例里的只有装配那条
  #      （要起整个 api 角色），它判的是终态，且两条摘除路径是「或」，见 §7.10。
  # 要做就是独立一个 `example` 作业（失败面与核心模块隔离），那是独立一件事。
  #
  # 三档防「静默失效」（这是新增闸门最容易自欺的地方）：
  #   1. **服务探活失败 = 作业失败**。这批用例的写法是「不可达即 Skip」，不探活的话服务起不
  #      来作业照样绿，等于白加一个 job。
  #   2. 逐套件 `-v` 全量输出留档，末尾按 EXPECTED 逐条断言真的出现 `--- PASS`：Skip、改名、
  #      被删都拦得住。EXPECTED 只列「非真服务不可证」的判据，普通单测不在里面（它们已由
  #      -short 主循环覆盖）。
  #   3. EXPECTED 与套件一一对应写在同一个 step 里，加套件忘加判据时至少肉眼在同一屏能看见。
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
      # 四个后端的地址都显式给：测试里的默认值恰好也是这些，但作业不靠默认值成立
      BALD_E2E_ETCD_ADDR: "127.0.0.1:2379"
      BALD_E2E_CONSUL_ADDR: "127.0.0.1:8500"
      BALD_TEST_REDIS_URI: "redis://127.0.0.1:6379"
      BALD_MONGO_URI: "mongodb://127.0.0.1:27017"
      BALD_E2E_NACOS_ADDR: "127.0.0.1:8848"
    services:
      etcd:
        image: quay.io/coreos/etcd:v3.5.14
        ports: ["2379:2379"]
        # 命令行参数不走 `args`：GitHub 的作业解析器只认 services 的
        # credentials/env/image/options/ports/volumes，多出任何键都在编译期
        # 拒掉整个文件（表现为「0 个 job、瞬间失败」，本地 Psych 看不出来）。
        # etcd 同名的 ETCD_* 环境变量与 flag 等价，镜像 entrypoint 直接读它们。
        env:
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2379
      consul:
        # 镜像默认 CMD 已经是 `agent -dev -client 0.0.0.0`（本地
        # `docker image inspect hashicorp/consul:1.19.2` 实测 CMD/ENTRYPOINT），
        # 所以这里不需要 args/options——dev agent 自带单节点集群，8500 直接可查。
        # 版本 pin 到 1.19.2 与本地取证用的那一个一致。
        image: hashicorp/consul:1.19.2
        ports: ["8500:8500"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      nacos:
        # 注册中心的第四个后端。版本与本地取证那台一致（v2.3.2）。
        #
        # **9848 必须一起映射**：nacos SDK v2 的 naming 走 gRPC，端口是
        # `8848 + 1000`；只映射 8848 时 HTTP 口活着、注册却静默上不去，
        # 判据会红在「注册后 20s 内不可见」这种看起来像时序问题的地方。
        # MODE=standalone 用内嵌 derby 单库；NACOS_AUTH_ENABLE=false 关掉鉴权，
        # 与用例不带用户名密码的写法一致。
        image: nacos/nacos-server:v2.3.2
        ports: ["8848:8848", "9848:9848"]
        env:
          MODE: standalone
          NACOS_AUTH_ENABLE: "false"
          JVM_XMS: 256m
          JVM_XMX: 512m
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      # kubernetes 后端不是「服务容器」能表达的形状（要真 apiserver + kubelet），那条腿
      # 独立成下面的 `integration-kubernetes` 作业；不在这里起集群的理由见那个作业的头注释。
      - name: 服务探活（探不到即失败，不放行成 Skip）
        run: |
          set -e
          wait_tcp() { # host port 名称 [尝试次数，默认 60 次 ×2s]
            local host="$1" port="$2" name="$3" tries="${4:-60}"
            while [ "$tries" -gt 0 ]; do
              if (echo > "/dev/tcp/$host/$port") 2>/dev/null; then
                echo "READY $name ($host:$port)"
                return 0
              fi
              tries=$((tries - 1))
              sleep 2
            done
            echo "::error::$name 未就绪（$host:$port）"
            return 1
          }
          wait_tcp 127.0.0.1 2379 etcd
          wait_tcp 127.0.0.1 8500 consul
          wait_tcp 127.0.0.1 6379 redis
          wait_tcp 127.0.0.1 27017 mongo
          # nacos 是 Java 起的，比另外四个慢一个量级；探不到照样判红（这批用例的写法
          # 是「不可达即 Skip」，不探活就等于白加一个服务）。
          wait_tcp 127.0.0.1 8848 nacos 90

      - name: 集成套件（非 -short，逐条判据留档）
        run: |
          set -e
          mkdir -p /tmp/int
          # 两个 registry/*/contract（etcd、consul）都不是独立 module（无自己的
          # go.mod），各自父模块的 ./... 已把它们带上；kubernetes 那个 contract 同理由
          # `integration-kubernetes` 作业的 ./... 带上
          (cd registry/etcd       && go mod download && go test -count=1 -timeout 10m -v ./... > /tmp/int/registry-etcd.log 2>&1) || { cat /tmp/int/registry-etcd.log; exit 1; }
          (cd registry/consul     && go mod download && go test -count=1 -timeout 10m -v ./... > /tmp/int/registry-consul.log 2>&1) || { cat /tmp/int/registry-consul.log; exit 1; }
          (cd contrib/store-mongo && go mod download && go test -count=1 -timeout 10m -v ./... > /tmp/int/store-mongo.log 2>&1) || { cat /tmp/int/store-mongo.log; exit 1; }
          (cd transport/asynq     && go mod download && go test -count=1 -timeout 10m -v ./... > /tmp/int/asynq.log 2>&1) || { cat /tmp/int/asynq.log; exit 1; }
          (cd registry/nacos      && go mod download && go test -count=1 -timeout 10m -v ./... > /tmp/int/registry-nacos.log 2>&1) || { cat /tmp/int/registry-nacos.log; exit 1; }
          cat /tmp/int/*.log

      - name: 判据必须真的跑过（Skip 不算通过）
        run: |
          set -e
          # 每条格式 <日志>|<测试名>；名字来自上面各套件的 -v 输出。
          # **这个字符串里只能放判据行**：循环按空白拆词，注释混进来会被当成一堆
          # 假判据（实测把 `grep` 指到不存在的文件上），整个作业判红且报错难懂。
          # 下面那条 case 分支是给这种写法兜底的：它直接点名「非判据项」。
          EXPECTED="
          /tmp/int/registry-etcd.log|TestRegisterDiscoverDeregister
          /tmp/int/registry-etcd.log|TestWatch_ReceivesChanges
          /tmp/int/registry-etcd.log|TestProvider_BuildsUsableRegistrar
          /tmp/int/registry-consul.log|TestRegisterDiscoverDeregister
          /tmp/int/registry-consul.log|TestWatch_ReceivesChanges
          /tmp/int/registry-consul.log|TestHeartbeat_DeregisterKeepsOtherInstances
          /tmp/int/registry-consul.log|TestGetService_HealthCheckFiltersNonPassing
          /tmp/int/registry-consul.log|TestProvider_BuildsUsableRegistrar
          /tmp/int/store-mongo.log|TestMongoCRUD
          /tmp/int/asynq.log|TestTaskSubscribe
          /tmp/int/registry-nacos.log|TestNacosDeregisterRemovesInstanceWithClientOpen
          /tmp/int/registry-nacos.log|TestNacosContractCleanupClosesClient
          "
          # consul 那五条里，后两条是 consul 后端独有的语义，只有真 agent 能判：
          # 心跳按实例隔离（注销一个不该带走其余实例）与「发现只返回 passing 实例」。
          miss=0
          for row in $EXPECTED; do
            [ "$row" = "" ] && continue
            case "$row" in
              *"|"*) ;;
              *)
                echo "::error::EXPECTED 里有非 <日志>|<测试名> 的项：「$row」——注释别写进这个字符串"
                miss=$((miss + 1))
                continue
                ;;
            esac
            log=${row%%|*}
            name=${row##*|}
            if grep -q -- "--- PASS: $name" "$log"; then
              echo "PASS  $name  ($log)"
            else
              echo "::error::判据 $name 没有 PASS 记录（Skip / 改名 / 未编译都会落到这里）"
              miss=$((miss + 1))
            fi
          done
          if [ "$miss" != 0 ]; then
            echo "--- 留档输出（便于看是 Skip 还是没跑）---"
            grep -E '^(--- (SKIP|FAIL|PASS)|ok|FAIL)' /tmp/int/*.log | tail -60
            exit 1
          fi

  # kubernetes 注册中心真机腿（风险 §7.1）。四个 registry 后端里，etcd/consul 由
  # `integration` 作业的真服务判，kubernetes 要真 apiserver + kubelet 所以独立成这条；
  # nacos 的服务容器已经进 `integration`（判注销与 cleanup 两条机制）。
  #
  # 为什么不并进 `integration`：本作业要下载并启动真 kube-apiserver + kubelet（kind），
  # 失败面是「Docker Hub 拉不到 kindest/node」「runner 上集群起不来」这类平台问题，
  # 与四条服务腿无关。两种失败面放进同一个作业，第一次平台抖动就让整个作业的结论
  # 作废，etcd/consul/redis/mongo 那四条腿得重跑一遍才能取证——而这种「不是我们的
  # 代码坏了」的红最难维护：下一个接手人加的是 `continue-on-error`，不是修集群。
  # 拆开后两边的判据都还是硬门，谁红查谁。
  #
  # 为什么非真集群不可（fake clientset 判不出这三条）：
  #   1. `Deregister` 靠 strategic merge patch 的「值为 null 即删键」摘标签，
  #      fake 的 fixture tracker 不实现这套合并语义——键删不掉，但测试照样绿。
  #   2. 发现侧只列 `Phase == Running` 的 Pod；phase 是 kubelet 写回的状态，
  #      fake 里由测试自己 set，判不出「真跑起来的才可发现」。
  #   3. `Watch` 依赖真 watch 的事件序列（informer 缓存不与已存在的对象重放）。
  # 这三条正是这个后端的产品语义，所以证据只能来自真 apiserver。
  integration-kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
      # 版本与本机取证一致（kind v0.27.0 + kindest/node:v1.31.0）。该组合下
      # registry/kubernetes 三条真机判据全绿，且五条变异各自把对应判据打红。
      KIND_VERSION: "v0.27.0"
      K8S_NODE_IMAGE: "kindest/node:v1.31.0"
      K8S_CLUSTER: "bald-e2e"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: 起 kind 集群（kubernetes 后端要真 apiserver + kubelet）
        run: |
          set -e
          bindir="${RUNNER_TEMP}/bin"
          mkdir -p "$bindir"
          curl -fsSL -o "${bindir}/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          chmod +x "${bindir}/kind"
          echo "$bindir" >> "$GITHUB_PATH"
          # --wait 180s 等控制面就绪；失败时打出控制面容器日志再退出——集群没起来
          # 时这是唯一线索，否则只能看到「kind create failed」一句话。
          if ! "${bindir}/kind" create cluster --name "${K8S_CLUSTER}" \
              --image "${K8S_NODE_IMAGE}" --wait 180s; then
            echo "--- 控制面容器日志（集群没起来时唯一的线索）---"
            docker logs "${K8S_CLUSTER}-control-plane" 2>&1 | tail -40
            exit 1
          fi
          "${bindir}/kind" get kubeconfig --name "${K8S_CLUSTER}" > "${RUNNER_TEMP}/kubeconfig"
          echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig" >> "$GITHUB_ENV"

      - name: API 探活（探不到即失败，不放行成 Skip）
        run: |
          set -e
          # kubernetes 没有明文 TCP 端口可探：apiserver 是 HTTPS 且自签证书。
          # /version 允许匿名读（本机 kind 实测），拿它当就绪探针正好——kind --wait
          # 已等过 Ready，这一条防的是「集群起来了但 API 打不通」那类半死状态。
          # 这一条不能省：测试的形状是「连不上即 Skip」，没有它整个作业会在
          # 零证据的情况下变绿。
          k8s_api=$(kind get kubeconfig --name "${K8S_CLUSTER}" | sed -n 's/.*server: //p' | head -1)
          tries=60
          while [ "$tries" -gt 0 ]; do
            if curl -fsSk --max-time 3 "${k8s_api}/version" >/dev/null; then
              echo "READY kubernetes (${k8s_api})"
              break
            fi
            tries=$((tries - 1))
            sleep 2
          done
          if [ "$tries" = 0 ]; then
            echo "::error::kubernetes 未就绪（${k8s_api}）"
            exit 1
          fi

      - name: 集成套件（非 -short，逐条判据留档）
        run: |
          set -e
          mkdir -p /tmp/int
          # registry/kubernetes/contract 不是独立 module（无自己的 go.mod），
          # 父模块的 ./... 已把它带上
          (cd registry/kubernetes && go mod download && go test -count=1 -timeout 10m -v ./... > /tmp/int/registry-kubernetes.log 2>&1) || { cat /tmp/int/registry-kubernetes.log; exit 1; }
          cat /tmp/int/registry-kubernetes.log

      - name: 判据必须真的跑过（Skip 不算通过）
        run: |
          set -e
          # 每条格式 <日志>|<测试名>；名字来自上一步的 -v 输出。同 §7.1 的
          # integration 作业：**这个字符串里只能放判据行**，注释写在外面。
          EXPECTED="
          /tmp/int/registry-kubernetes.log|TestRegister_WritesPodIdentityAndDiscovery
          /tmp/int/registry-kubernetes.log|TestDeregister_RemovesPodFromDiscovery
          /tmp/int/registry-kubernetes.log|TestGetService_ExcludesNonRunningPod
          "
          # 三条各钉一件只有真 apiserver 能判的事：
          #   Register → 标签/注解/端点往返 + Watch 收到（注册方向）
          #   Deregister → 标签与注解真的被删掉、发现侧随后列不到（注销方向；
          #     这条是 §7.1 那个「自校验闸门类起就没生效过」缺陷的回归）
          #   非 Running Pod 被 phase 过滤（不依赖测试自己伪造的 phase 也要成立）
          miss=0
          for row in $EXPECTED; do
            [ "$row" = "" ] && continue
            case "$row" in
              *"|"*) ;;
              *)
                echo "::error::EXPECTED 里有非 <日志>|<测试名> 的项：「$row」——注释别写进这个字符串"
                miss=$((miss + 1))
                continue
                ;;
            esac
            log=${row%%|*}
            name=${row##*|}
            if grep -q -- "--- PASS: $name" "$log"; then
              echo "PASS  $name  ($log)"
            else
              echo "::error::判据 $name 没有 PASS 记录（Skip / 改名 / 未编译都会落到这里）"
              miss=$((miss + 1))
            fi
          done
          if [ "$miss" != 0 ]; then
            echo "--- 留档输出（便于看是 Skip 还是没跑）---"
            grep -E '^(--- (SKIP|FAIL|PASS)|ok|FAIL)' /tmp/int/*.log | tail -60
            exit 1
          fi

  # 声明式装配验收（设计 §7.2 的主门；登记册 §8 最后半条「acceptance 没有任何 CI
  # 作业调用它」的收口）。本地与 CI 同一条脚本、同一份判据表，只有 scope 不同。
  #
  # 为什么不把原来那五条 `go test -run` 直接搬进来：`-run` 命中 0 个测试**返回 0**。
  # 用例改名/被删/正则写错时作业照样绿——本仓库被这类静默失效咬过两次（§7.1 的
  # 「不可达即 Skip」、§8 的 per-command `dir`）。脚本改成先 `go test -list` 取
  # 清单、再逐条断言顶层 `--- PASS`，判据来自清单而不是手写表格，增删用例不用改这里。
  #
  # scope=ci 刻意不含两条本地腿：`_example/bald` 的计划两态要编译 gitignore 的
  # proto 产物；`bconf` 的产物字节一致判据绑 buf 版本形态（1.50 零差异、1.57 给
  # 中文注释补空格 → 未改 proto 也红）。理由逐条写在 scripts/acceptance-gate.sh 头。
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: 声明式装配验收（清单来自 -list，判据必须出现顶层 PASS）
        run: bash scripts/acceptance-gate.sh ci

  # 静态检查：golangci-lint 逐模块运行（清单来自 scripts/list-modules.sh，零维护）。配置在根
  # .golangci.yml，子模块目录会向上发现；新增模块无需改本 job。
  lint:
    runs-on: ubuntu-latest
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      # 版本 pin：升级 lint 规则集是显式动作，避免上游新检查静默漂移。
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: golangci-lint all modules
        run: |
          set -e
          trap 'echo "### FAILED AT MODULE: $mod"; echo "::error::FAILED AT MODULE: $mod"' ERR
          for mod in $(sh scripts/list-modules.sh); do
            echo "=== lint: $mod ==="
            n=0
            while true; do
              if (cd "$mod" && go mod download); then break; fi
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "::error::$mod 依赖下载失败"; exit 1; fi
              echo "::warning::$mod 依赖下载瞬断，15s 后重试（第 $n/2 次）"
              sleep 15
            done
            (cd "$mod" && golangci-lint run ./...)
          done

  # 漏洞门禁：govulncheck 只报告「代码真正可达」的漏洞（非模块级清单），
  # 因此可以 fail-closed；标准库漏洞由 setup-go 的补丁版本修复。
  vuln:
    runs-on: ubuntu-latest
    env:
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: govulncheck all modules
        run: |
          set -e
          trap 'echo "### FAILED AT MODULE: $mod"; echo "::error::FAILED AT MODULE: $mod"' ERR
          for mod in $(sh scripts/list-modules.sh); do
            echo "=== vuln: $mod ==="
            n=0
            while true; do
              if (cd "$mod" && go mod download); then break; fi
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "::error::$mod 依赖下载失败"; exit 1; fi
              echo "::warning::$mod 依赖下载瞬断，15s 后重试（第 $n/2 次）"
              sleep 15
            done
            (cd "$mod" && govulncheck ./...)
          done
