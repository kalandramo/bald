# ci：全模块 build + vet + test（模块自动发现，85 module 零维护）。
# 说明：
# - 多模块仓库：shell 循环 find go.mod，模块增删零维护；_example 是
#   验证用独立 module（GOFLAGS=-mod=mod 特殊装载），排除。
# - 根模块 vet 降级 -copylocks=false：appkit hotReload 的 `*cfg = *candidate`
#   proto 顶层浅拷贝是既定设计（字段皆指针、无别名问题，见 bootstrap.go
#   注释），MessageState 含 Mutex 属 vet 误报区。
# - go test -short + -timeout 5m：-short 跳过集成测试（各模块
#   testing.Short() 惯例）；超时防挂死测试拖垮整个 job。
# - 依赖预下载 + 3 次重试：proxy.golang.org 偶发 HTTP/2 瞬断
#   （stream INTERNAL_ERROR，2026-09-12 log/aliyun 即此挂掉），
#   下载完成后 build/vet/test 全程离线稳定。
# - GOPROXY 主源 goproxy.io：aliyun-log-go-sdk v0.1.117.zip 经
#   proxy.golang.org 在 GitHub runner（Azure US）网络上中流 HTTP/2
#   INTERNAL_ERROR 持续失败（三轮同点位复现）；| 故障转移对该错误
#   类不生效（本地容器实测连接级错误可转移，故保留 proxy.golang.org
#   为备源）。goproxy.io 全球 CDN，容器内实测可完整服务本仓依赖；
#   sumdb 校验不受 proxy 切换影响。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # goproxy.io 主源（proxy.golang.org 对 aliyun sdk zip 在 runner
      # 网络上持续中流失败且 | 转移不覆盖该错误类），| 后接备源
      GOPROXY: "https://goproxy.io|https://proxy.golang.org,direct"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: build + vet + test all modules
        run: |
          set -e
          # 失败时在日志中打出所在模块（自诊断）
          trap 'echo "### FAILED AT MODULE: $mod"; echo "::error::FAILED AT MODULE: $mod"' ERR
          # test 已知红清零（2026-09-12 六模块修复：手工测试加 Short 守卫、
          # codec nil 显式报错、http3 跨用例连接合并），全部恢复 test
          for mod in $(find . -name go.mod -not -path "./.git/*" -not -path "./_example*" | xargs -n1 dirname | sort); do
            echo "=== $mod ==="
            # 预下载依赖（重试 3 次防 proxy 瞬断），之后构建/测试离线稳定
            n=0
            while true; do
              if (cd "$mod" && go mod download); then break; fi
              n=$((n+1))
              if [ $n -ge 3 ]; then echo "::error::$mod 依赖下载失败"; exit 1; fi
              echo "::warning::$mod 依赖下载瞬断，15s 后重试（第 $n/2 次）"
              sleep 15
            done
            if [ "$mod" = "." ]; then
              (cd . && go build ./... && go vet -copylocks=false ./... && go test -short -timeout 5m ./...)
            else
              (cd "$mod" && go build ./... && go vet ./... && go test -short -timeout 5m ./...)
            fi
          done
