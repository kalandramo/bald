syntax = "proto3";

package go.bald.admin.tenant.v1;

option go_package = "github.com/kalandramo/bald/examples/go-bald-admin/api/gen/tenant/v1;tenantv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// TenantService 租户管理服务（T2，自 go-wind-admin identity/tenant.proto 精简搬运）。
//
// 双层语义（移植计划 §6 D2）：
//   1. 业务层——本服务管理租户本身（租户即业务实体，对应源 sys_tenants；
//      platform 为平台租户，对应源 PlatformTenantID=0）；
//   2. 框架层——bald P8 pkg/store 对其他业务表（users/secrets/…）自动注入
//      tenant_id 读过滤与写注入，与本服务无关。
// 租户管理是平台侧操作：REST/gRPC 路由仅授予 platform:admin 角色（casbin 策略）。
service TenantService {
  // GetTenant 取租户。
  //   REST: GET /v1/tenant/{id}
  // 注意 REST 用单数段：DefaultHTTPObject 取首资源段（"tenant"），与 gRPC
  // DefaultGRPCObject("TenantService/...")="tenant" 同源（P9 归一化，策略单写）。
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse) {
    option (google.api.http) = {
      get: "/v1/tenant/{id}"
    };
  }

  // ListTenants 列出租户（平台上下文，跨租户全量）。
  //   REST: GET /v1/tenant
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse) {
    option (google.api.http) = {
      get: "/v1/tenant"
    };
  }

  // CreateTenant 创建租户。
  //   REST: POST /v1/tenant
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse) {
    option (google.api.http) = {
      post: "/v1/tenant"
      body: "*"
    };
  }

  // UpdateTenant 更新租户。
  //   REST: PUT /v1/tenant/{id}
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse) {
    option (google.api.http) = {
      put: "/v1/tenant/{id}"
      body: "*"
    };
  }

  // DeleteTenant 删除租户。
  //   REST: DELETE /v1/tenant/{id}
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse) {
    option (google.api.http) = {
      delete: "/v1/tenant/{id}"
    };
  }
}

// Tenant 租户。ID 即租户编码（business code，如 "platform"、"t-acme"），
// 与 bald P8 的 tenant_id 同一命名空间——业务租户创建后即作为 P8 隔离维度使用。
message Tenant {
  enum Status {
    STATUS_UNSPECIFIED = 0; // 未指定
    STATUS_ON = 1;          // 启用（源 Status.ON）
    STATUS_OFF = 2;         // 禁用（源 Status.OFF）
    STATUS_FREEZE = 3;      // 冻结（源 Status.FREEZE）
  }

  string id = 1;      // 租户编码（= P8 tenant_id，如 "t-acme"）
  string name = 2;    // 租户名称（展示名）
  Status status = 3;  // 租户状态
  string remark = 4;  // 备注

  google.protobuf.Timestamp created_at = 100; // 创建时间
  google.protobuf.Timestamp updated_at = 101; // 更新时间
}

message GetTenantRequest {
  string id = 1; // 租户编码
}

message GetTenantResponse {
  Tenant tenant = 1;
}

message ListTenantsRequest {
  // 预留：源项目 List 走 pagination.PagingRequest（BSR 自有模块），T2 精简为全量列表；
  // 租户量级小，分页列入后续迭代。
}

message ListTenantsResponse {
  repeated Tenant items = 1;
  // 注意用 uint32：proto3 JSON 把 int64/uint64 编码为字符串，会破坏常规 JSON 客户端。
  uint32 total = 2;
}

message CreateTenantRequest {
  string id = 1;      // 租户编码（客户端指定，唯一键）
  string name = 2;    // 租户名称
  string remark = 3;  // 备注
}

message CreateTenantResponse {
  Tenant tenant = 1;
}

message UpdateTenantRequest {
  string id = 1;              // 租户编码（定位）
  string name = 2;            // 新名称（空=不改）
  Tenant.Status status = 3;   // 新状态（UNSPECIFIED=不改）
  string remark = 4;          // 新备注（空=不改）
}

message UpdateTenantResponse {
  Tenant tenant = 1;
}

message DeleteTenantRequest {
  string id = 1; // 租户编码
}

message DeleteTenantResponse {
  string deleted = 1; // 被删除的租户编码
}
