syntax = "proto3";

package go.bald.admin.file.v1;

option go_package = "github.com/kalandramo/bald/examples/go-bald-admin/api/gen/file/v1;filev1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// FileService 文件管理服务（T5，自 go-wind-admin storage 域精简移植）。
//
// 文件是租户级业务数据（源 mixin TenantID）：查询自动经 P8 隔离。上传校验
// 大小上限（50MiB）与 MIME 白名单（源 pkg/oss 语义），对象按内容类型分桶并
// 兜底创建桶；元数据含 SHA256 内容哈希与长度。上传/下载为二进制流：gateway
// 转码（bytes→base64 JSON）可用，推荐经 gin 主服务的 multipart/流式 REST。
service FileService {
  // UploadFile 上传文件：校验后写入 MinIO 并登记元数据。
  //   REST(gateway): POST /v1/files/upload（JSON body，content 为 base64）
  //   REST(gin):     POST /v1/files/upload（multipart form：file + directory）
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse) {
    option (google.api.http) = {
      post: "/v1/files/upload"
      body: "*"
    };
  }

  // DownloadFile 下载文件内容（bytes）。
  //   REST(gateway): GET /v1/files/{id}/download（JSON）
  //   REST(gin):     GET /v1/files/{id}/download（流式，Content-Disposition）
  rpc DownloadFile(DownloadFileRequest) returns (DownloadFileResponse) {
    option (google.api.http) = {
      get: "/v1/files/{id}/download"
    };
  }

  // GetFile 取文件元数据。
  //   REST: GET /v1/files/{id}
  rpc GetFile(GetFileRequest) returns (GetFileResponse) {
    option (google.api.http) = {
      get: "/v1/files/{id}"
    };
  }

  // ListFiles 列出文件（租户过滤自动；原始文件名/内容类型过滤）。
  //   REST: GET /v1/files
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse) {
    option (google.api.http) = {
      get: "/v1/files"
    };
  }

  // DeleteFile 删除文件（先删对象，再删元数据）。
  //   REST: DELETE /v1/files/{id}
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse) {
    option (google.api.http) = {
      delete: "/v1/files/{id}"
    };
  }
}

// File 文件元数据。字段对齐源 storage/service/v1 的 File（recordFile）。
message File {
  string id = 1;              // 保存文件名去扩展名的 uuid（32 位无横线）
  string provider = 2;        // 存储提供者（"minio"）
  string bucket_name = 3;     // 实际落桶（按内容类型分桶）
  string save_file_name = 4;  // 对象键（含目录与扩展名）
  string file_directory = 5;  // 业务目录
  string file_name = 6;       // 原始文件名
  string extension = 7;       // 扩展名（含点，小写）
  string content_hash = 8;    // SHA256 hex
  uint32 size = 9;            // 字节数（≤50MiB；uint32 避免 JSON 字符串化）
  string link_url = 10;       // 访问 URL（预签名后续迭代，上传时留空）
  string mime_type = 11;      // 嗅探出的内容类型
  string created_by = 12;     // 上传者（UserID）

  google.protobuf.Timestamp created_at = 100;
  google.protobuf.Timestamp updated_at = 101;
}

message UploadFileRequest {
  string file_name = 1;      // 原始文件名（用于扩展名推断）
  string file_directory = 2; // 业务目录（可空；路径安全校验）
  bytes content = 3;         // 文件内容（≤50MiB）
}

message UploadFileResponse {
  File file = 1;
}

message DownloadFileRequest {
  string id = 1; // 文件 ID
}

message DownloadFileResponse {
  bytes content = 1;    // 文件内容
  string file_name = 2; // 原始文件名（Content-Disposition 用）
  string mime_type = 3; // 内容类型
}

message GetFileRequest {
  string id = 1;
}

message GetFileResponse {
  File file = 1;
}

message ListFilesRequest {
  string file_name = 1; // 非空 = 原始文件名前缀过滤
  string mime_type = 2; // 非空 = 内容类型过滤
}

message ListFilesResponse {
  repeated File items = 1;
  uint32 total = 2;
}

message DeleteFileRequest {
  string id = 1;
}

message DeleteFileResponse {
  string deleted = 1; // 被删除的文件 ID
}
