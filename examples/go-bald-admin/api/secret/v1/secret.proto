syntax = "proto3";

package go.bald.admin.v1;

option go_package = "github.com/kalandramo/bald/examples/go-bald-admin/api/gen/secret/v1;secretv1";

import "google/api/annotations.proto";

// SecretService 受限资源服务（M5：经 grpc-gateway 同时暴露 gRPC 与 REST）。
//
// T2 起 proto 全部收敛到 api/ 目录（buf 模块根=api/）；本文件的 ListUsers 演示 RPC
// 已由 UserService.ListUsers（api/user/v1）接管 GET /v1/users（对象列表版本）。
service SecretService {
  // GetSecret 取机密。
  //   REST: GET /v1/secrets/{id}
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse) {
    option (google.api.http) = {
      get: "/v1/secrets/{id}"
    };
  }

  // DeleteSecret 删机密。
  //   REST: DELETE /v1/secrets/{id}
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse) {
    option (google.api.http) = {
      delete: "/v1/secrets/{id}"
    };
  }
}

message GetSecretRequest {
  string id = 1;
}

message GetSecretResponse {
  string id = 1;
  string content = 2;
  string viewer = 3;
}

message DeleteSecretRequest {
  string id = 1;
}

message DeleteSecretResponse {
  string deleted = 1;
}
