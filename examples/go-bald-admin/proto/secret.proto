syntax = "proto3";

package go.bald.admin.v1;

option go_package = "github.com/kalandramo/bald/examples/go-bald-admin/gen/secretv1;secretv1";

import "google/api/annotations.proto";

// SecretService 受限资源服务（M5：经 grpc-gateway 同时暴露 gRPC 与 REST）。
service SecretService {
  // GetSecret 取机密。
  //   REST: GET /v1/secrets/{id}
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse) {
    option (google.api.http) = {
      get: "/v1/secrets/{id}"
    };
  }

  // DeleteSecret 删机密。
  //   REST: DELETE /v1/secrets/{id}
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse) {
    option (google.api.http) = {
      delete: "/v1/secrets/{id}"
    };
  }

  // ListUsers 列出当前租户用户（M3 多租户隔离验证点）。
  //   REST: GET /v1/users
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users"
    };
  }
}

message GetSecretRequest {
  string id = 1;
}

message GetSecretResponse {
  string id = 1;
  string content = 2;
  string viewer = 3;
}

message DeleteSecretRequest {
  string id = 1;
}

message DeleteSecretResponse {
  string deleted = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  // 用户 ID 列表（仅当前租户可见，tenant_id 由 pkg/store 自动注入）。
  repeated string users = 1;
}
