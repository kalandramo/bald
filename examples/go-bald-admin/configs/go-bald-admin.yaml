http:
  addr: ":8080"
  # M6 生产化：TLS 采用 Smart Mode。enabled=true 时 http 段切换为 HTTPS，
  # ca/cert/key 可为文件路径 | 原始 PEM | Base64(PEM)。gateway 共用同一 tls 段。
  tls:
    enabled: false
    # ca: ""            # 可选：校验客户端证书的 CA
    # cert: ""          # 服务端证书（与 http/gateway 共用）
    # key: ""           # 服务端私钥
grpc:
  addr: ":9090"
# M6 生产化：gateway（REST→gRPC 转码）监听地址，与 http.addr 分开避免端口冲突。
# 也可用 env BALD_GATEWAY_ADDR 覆盖。
gateway:
  addr: ":8081"
logger:
  level: "info"
  format: "json"

# R1-2 期望态协调：声明审计后端「期望集合」（逗号/空格分隔，取值 log|store|stream）。
# 框架读取该键作为期望态，与当前生效后端 diff，自动 Mount/Unmount 收敛（幂等）。
# 运行时改此键经 WatchConfigFile 触发 OnConfigChange→reconcile，无需重启即可热切换
# 审计后端组合（如从 [store] 变更为 [store,stream] 实时加流）。
audit:
  backends: "store,stream"
