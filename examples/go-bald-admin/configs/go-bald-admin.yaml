server:
  http:
    addr: ":8080"
    # M6 生产化：TLS 段（bootstrapv1.Server_TLS）非 nil 即启用 HTTPS；
    # file（证书路径）或 config（原始 PEM）二选一，gateway 共用同一 tls 段。
    # tls:
    #   file:
    #     cert_path: /etc/certs/tls.crt
    #     key_path: /etc/certs/tls.key
  grpc:
    addr: ":9090"
# M6 生产化：gateway（REST→gRPC 转码）监听地址，与 server.http.addr 分开避免端口冲突。
# 也可用 env BALD_GATEWAY_ADDR 覆盖。
gateway:
  addr: ":8081"
# log.Options（CLI Options 层，Bind("", logOpts)）的键路径。
log:
  level: "info"
  format: "json"

# R1-2 期望态协调：声明审计后端「期望集合」（逗号/空格分隔，取值 log|store|stream）。
# 框架读取该键作为期望态，与当前生效后端 diff，自动 Mount/Unmount 收敛（幂等）。
# 运行时改此键经 WatchConfigFile 触发 OnConfigChange→reconcile，无需重启即可热切换
# 审计后端组合（如从 [store] 变更为 [store,stream] 实时加流）。
audit:
  backends: "store,stream"
