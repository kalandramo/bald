version: 1

# 前置干预：给知识中心的 Repo Wiki / 知识卡规划器读。
# 只放「LLM 从代码推不出来或容易推错」的事实与禁用模式；改完需在知识中心
# 重新生成才生效（进行中的 run 不受影响）。
# 本期不支持文件范围过滤（scope），故不写该块。

repowiki:
  template: architecture
  notes:
    - text: 本仓是 93 个 go.mod 的多模块仓库（无 go.work），子模块靠相对 replace 组成可编译闭包。`scripts/list-modules.sh` 是全仓唯一模块清单派生（92 条，排除 `_example/bald`），CI 与 Taskfile 都消费它——不要按「一个 module」叙事。
    - text: 模块划分口径：`*/contract` 包只放契约装配、不 import 具体后端；具体后端在适配器包。根 module 不得 require 任何适配器（曾构成模块环，已按「删重复机制」收口），写文档时不要把适配器画成根的依赖。
    - text: 页面目录需覆盖三个主题：服务发现与网关出站、CI 质量闸门、Broker 订阅者生命周期。
    - text: 网关出站只有 target 写成 `discovery:///<服务名>` 才走注册中心，直连仍是默认。解析器三条既定语义必须写清并给出用例名：`Build` 返回错误 gRPC 不会重试（所以只 `cc.ReportError`、靠 `Watch` 推进）、空快照不推 `UpdateState`、只取 `grpc://` 端点。
    - text: nacos 把一个实例的多个端点拆成 `<Name>.<scheme>` 形式的多个服务，目标必须写 `discovery:///<服务名>.grpc`；内存与 etcd 用注册时填的 `ServiceInstance.Name` 原样。少这个后缀解析到的通常是 HTTP 面或空集。
    - text: CI 有五个作业：test / race / integration / lint / vuln。主循环必须留 `go test -short`——`transport/{redis,kafka,rabbitmq,rocketmq,tcp,webrtc}` 的 `TestServer`/`TestClient` 是等信号的手动用例，去掉 `-short` 会挂到 timeout。非 `-short` 的集成覆盖由 `integration` 作业按套件点名注入真 etcd/redis/mongo。
    - text: 禁用模式：GitHub 作业文件的 `services` 只接受 credentials/env/image/options/ports/volumes。写 `args` 会让整份文件在编译期被拒、且只留「workflow file issue」+ 0 个 job（本地 YAML 解析器看不出问题）。容器参数改用同名环境变量（etcd 即 `ETCD_LISTEN_CLIENT_URLS`/`ETCD_ADVERTISE_CLIENT_URLS`）。改作业文件先跑 `task ci-workflow-lint`。
    - text: 注入真后端的用例一律写成「不可达即 `t.Skip`」，所以集成作业必须两档兜底：先 TCP 探活、末尾逐条断言判据真的出现 `--- PASS`。只跑套件那一步会静默绿（实测 exit=0、23 条 SKIP）。
    - text: 禁用模式：概率式组件的测试不得直接对统计量断言阈值。`circuitbreaker/sres` 是唯一用随机源的 breaker，其 `accept = requests/(requests+1)` 里的 `requests` 是已 MarkSuccess 条数，并发下放行数取决于 Allow 与 Mark 的交错——正确做法是先构造有界前置状态（灌满窗口使单次拒绝率 ≤ 1/(requests+1)）再断言。
    - text: broker 订阅者致命退出后不自行摘除 `SubscriberSyncMap` 条目：摘除是调用方或 `Disconnect` 的责任，重订阅是覆盖而非累积。代价要如实写出——`Topics()/Len()/Has()` 会高报死订阅者；口径由 `broker/kafka/subscriber_test.go` 钉住。
    - text: 以下面没被覆盖，文档不得写成「已支持/已验证」：consul 与 kubernetes 注册中心后端；`_example` 在 CI 的可装载性（它的 go.mod 把两个 kratos contrib 模块 replace 到仓库外的同级检出）；外部消费方 bald-admin 的实际采用面（要切 `discovery:///…` 还依赖模块 tag 发布）。
    - text: 工具链事实：本地 Go 1.27.1、CI 1.27.3；task / golangci-lint / govulncheck / buf / actionlint 装在 `$(go env GOPATH)/bin`，版本 pin 的唯一真相源是 Taskfile 的 `vars`。

knowledgecard:
  notes:
    - text: 按「契约 vs 适配器」切卡：`*/contract` 与 `pkg/appkit` 的 provider 属契约面，`registry/*`、`transport/*`、`contrib/*` 属适配器面；同一后端的两张卡要互相 link，别让读者在两张卡之间自己找边。
    - text: 模块边界以 `scripts/list-modules.sh` 的 92 条派生为准；`_example/bald` 单列为验证用模块（不在 CI 清单，因其 go.mod replace 到仓库外的 kratos 检出）。
    - text: 根 module（`github.com/kalandramo/bald`）承载 appkit / bconf / bconfig / bootstrap / `pkg/*`；它不 require 任何适配器，适配器单向 require 根。22 个适配器对根的扇入耦合是既定状态，不是待修缺陷。
    - text: 闸门类知识卡要写「同源」关系：模块清单 `scripts/list-modules.sh`、race 排除清单 `.github/race-skip.txt`、lint 配置根 `.golangci.yml`、作业文件校验 `task ci-workflow-lint` ↔ `.github/workflows/workflow-lint.yml`。
