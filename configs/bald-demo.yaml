# bald-demo 完整配置示例
#
# 优先级（高 → 低，viper 默认语义）：
#   命令行 flag > 环境变量 > 本地文件(本文件) > 远程配置中心
#
# 键名即 Protobuf 配置契约（api/proto/bald/config/v1/）中的字段路径：
#   - http   : confv1.Http   （明文 + TLS 一体）
#   - grpc   : confv1.Grpc
#   - log    : confv1.Logger （proto 字段名为 logger，json_name = "log"）
#
# 同一套键路径同时适用于四种配置源：
#   --http.addr  ⇔  http.addr  ⇔  BALD_DEMO_HTTP_ADDR  ⇔  本文件的 http.addr

# ---------------------------------------------------------------------------
# HTTP 服务（SecureServingOptions，默认明文；Enabled=true 时切换为 HTTPS）
# ---------------------------------------------------------------------------
http:
  addr: ":8080"          # 监听地址；":0" 可让系统分配空闲端口
  timeout: 10s           # 连接超时（如 ReadHeaderTimeout）
  # TLS（Smart Mode）：ca/cert/key 可为 文件路径 / 原始 PEM / Base64(PEM)
  # 三者都支持，框架自动识别。仅客户端 mTLS 可只配 ca。
  tls:
    enabled: false       # true → 启用 HTTPS（同时需提供 cert + key）
    skip-verify: false   # 仅客户端场景跳过校验（不安全，慎用）
    ca: ""               # CA 路径 | PEM | Base64(PEM)；mTLS 校验客户端证书用
    cert: ""             # 服务端证书 路径 | PEM | Base64(PEM)
    key: ""              # 服务端私钥 路径 | PEM | Base64(PEM)
    # 示例（任选一种写法）：
    #   cert: /etc/certs/tls.crt            # 1) 文件路径
    #   cert: |                             # 2) 原始 PEM（含 -----BEGIN CERTIFICATE-----）
    #     -----BEGIN CERTIFICATE-----
    #     MIIC...
    #     -----END CERTIFICATE-----
    #   cert: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0t...   # 3) Base64(PEM)

# ---------------------------------------------------------------------------
# gRPC 服务（GRPCOptions）
# ---------------------------------------------------------------------------
grpc:
  network: "tcp"         # 网络类型，默认 tcp
  addr: ":9090"          # 监听地址；":0" 可让系统分配空闲端口
  timeout: 30s           # 连接超时（客户端侧使用）

# ---------------------------------------------------------------------------
# 日志（pkg/log.Options）
# ---------------------------------------------------------------------------
log:
  level: "info"          # debug | info | warn | error
  format: "console"      # console | json
  output-paths:          # 输出目标，支持 stdout / stderr 或文件路径，可多目标
    - "stdout"
    # - "/var/log/bald.log"   # 追加文件目标时取消注释
