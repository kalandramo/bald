version: v2
plugins:
  - local: protoc-gen-go
    # 相对 buf.gen.yaml 所在目录（api/proto）解析：../../ 回到仓库根。
    out: ../../pkg/conf/gen/go
    opt:
      - paths=source_relative
  - local: protoc-gen-defaults
    # 由 protoc-gen-defaults 插件（https://github.com/onexstack/protoc-gen-defaults）
    # 依据 proto 字段的 (defaults.value) 注解生成 Defaulter.Default() 方法。
    # 二进制由 `task tools-protoc-gen-defaults` 按需安装（PATH 缺失时 go install），
    # 版本 pin 见 Taskfile.yml 的 PROTOC_GEN_DEFAULTS_VERSION，
    # 不进入 bald 核心 go.mod（与 P5 治理原则一致）。
    out: ../../pkg/conf/gen/go
    opt:
      - paths=source_relative
clean: true
