syntax = "proto3";

package bald.config.v1;

import "defaults/defaults.proto";

option go_package = "github.com/kalandramo/bald/pkg/conf/gen/go/bald/config/v1";

// Logger 描述日志系统配置。
//
// 对应配置文件中的 log 段，映射到 pkg/log.Options。
message Logger {
  // 日志级别：debug | info | warn | error。
  string level = 1 [(defaults.value).string = "info"];

  // 输出格式：console | json。
  string format = 2 [(defaults.value).string = "console"];

  // 输出目标，支持 "stdout" / "stderr" 或文件路径，可多目标。
  // 注意：repeated 字段 protoc-gen-defaults 不支持注解注入（见插件 README），
  // 默认 ["stdout"] 在 conf.NewBootstrap 的 post-process 中兜底。
  repeated string output_paths = 3;
}
