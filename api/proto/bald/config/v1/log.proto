syntax = "proto3";

package bald.config.v1;

import "defaults/defaults.proto";

option go_package = "github.com/kalandramo/bald/pkg/conf/gen/go/bald/config/v1";

// RotateOptions 描述日志文件轮转配置（基于 lumberjack）。
//
// 仅当 OutputPaths 含文件路径且 Enabled=true 时，对应文件按大小/时间切割、
// 清理并可选 gzip 压缩。对应 pkg/log.Options.Rotate。
message RotateOptions {
  // 是否启用文件轮转；关闭时文件路径按 os.OpenFile 直写（不切割）。
  bool enabled = 1;

  // 单个日志文件最大体积（MB），超过即触发切割，默认 100。
  int32 max_size = 2 [(defaults.value).int32 = 100];

  // 保留的历史文件份数（不含当前），默认 7。
  int32 max_backups = 3 [(defaults.value).int32 = 7];

  // 历史文件最长保留天数，默认 30。
  int32 max_age = 4 [(defaults.value).int32 = 30];

  // 是否对历史文件 gzip 压缩，默认 true。
  bool compress = 5 [(defaults.value).bool = true];
}

// Logger 描述日志系统配置。
//
// 对应配置文件中的 log 段，映射到 pkg/log.Options。
message Logger {
  // 日志级别：debug | info | warn | error。
  string level = 1 [(defaults.value).string = "info"];

  // 输出格式：console | json。
  string format = 2 [(defaults.value).string = "console"];

  // 输出目标，支持 "stdout" / "stderr" 或文件路径，可多目标。
  // 注意：repeated 字段 protoc-gen-defaults 不支持注解注入（见插件 README），
  // 默认 ["stdout"] 在 conf.NewBootstrap 的 post-process 中兜底。
  repeated string output_paths = 3;

  // 文件轮转配置；仅当某 OutputPath 为文件路径且 Enabled=true 时生效。
  RotateOptions rotate = 4 [(defaults.value).message = {initialize: true, defaults: true}];
}
