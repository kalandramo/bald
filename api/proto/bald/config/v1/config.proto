syntax = "proto3";

package bald.config.v1;

import "bald/config/v1/app.proto";
import "bald/config/v1/server.proto";
import "bald/config/v1/log.proto";
import "defaults/defaults.proto";

option go_package = "github.com/kalandramo/bald/pkg/conf/gen/go/bald/config/v1";

// Bootstrap 是 bald 框架级配置的顶层契约。
//
// 它是「配置契约（schema）」的唯一事实源：YAML / JSON 只是载体，viper 只是
// 合并器，最终都反序列化为本消息。由此获得编译期可查的字段名、显式类型，
// 以及可由 proto 直接导出的 JSON Schema（供配置中心做变更校验与灰度）。
//
// 消息形状严格镜像配置文件结构（顶层 http / grpc / log），因此键路径与
// viper 键、环境变量、命令行 flag 完全一致：
//
//	http.addr        ⇔  viper "http.addr"  ⇔  NAME_HTTP_ADDR  ⇔  --http.addr
//
// 覆盖范围：仅框架级配置。业务配置不在此约束内，仍可用 viper 的动态 key 能力。
message Bootstrap {
  // 应用元数据（可选段）。
  App app = 1;

  // HTTP 服务器配置。
  Http http = 2 [(defaults.value).message = {initialize: true, defaults: true}];

  // gRPC 服务器配置。
  Grpc grpc = 3 [(defaults.value).message = {initialize: true, defaults: true}];

  // 日志配置。json_name 指定为 "log"，与现有配置文件中的 log 段保持一致
  // （proto 字段名与配置键名可以不同，由 json_name 建立映射）。
  Logger logger = 4 [json_name = "log", (defaults.value).message = {initialize: true, defaults: true}];
}
