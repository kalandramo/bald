syntax = "proto3";

package bald.config.v1;

import "google/protobuf/duration.proto";
import "defaults/defaults.proto";

option go_package = "github.com/kalandramo/bald/pkg/conf/gen/go/bald/config/v1";

// Tls 描述 TLS 传输配置，采用 Smart Mode：
// root_ca / client_ca / cert / key 均可为文件路径、原始 PEM 或 Base64 编码的 PEM。
//
// 对应配置文件中的 http.tls 段。
message Tls {
  // 是否启用 TLS。true 时 http 段切换为 HTTPS。
  bool enabled = 1;

  // 是否跳过服务端证书链与主机名校验（仅客户端场景，不安全）。
  bool skip_verify = 2;

  // 信任的 CA 证书（验证对端证书链）：文件路径 | 原始 PEM | Base64(PEM)。
  // 服务端用它校验出站/对端链，客户端用它校验服务端——仅设置本字段不强制 mTLS。
  string root_ca = 6;

  // mTLS 专用：要求客户端出示由本 CA 签发的证书（ClientAuth=
  // RequireAndVerifyClientCert）。与服务端校验对端链的 root_ca 语义分离，
  // 不再由 ca 非空隐式触发 mTLS（D10 评审修正）。
  string client_ca = 7;

  // 弃用（D10）：旧字段，语义等同 root_ca，仅作向后兼容别名，后续版本移除。
  string ca = 3;

  // 服务端证书：文件路径 | 原始 PEM | Base64(PEM)。
  string cert = 4;

  // 服务端私钥：文件路径 | 原始 PEM | Base64(PEM)。
  string key = 5;
}

// Http 描述 HTTP 服务器配置（明文 + TLS 一体的 serving 形态）。
//
// 对应配置文件中的 http 段，映射到 options.SecureServingOptions。
message Http {
  // 监听地址，如 ":443"。":0" 让系统分配空闲端口。
  string addr = 1 [(defaults.value).string = ":443"];

  // 连接超时（如 ReadHeaderTimeout）。配置文件中写 "10s" 这类 Go duration 串。
  google.protobuf.Duration timeout = 2 [(defaults.value).duration = "10s"];

  // TLS 配置。注意是显式子段（http.tls.*），不参与字段平铺。
  Tls tls = 3 [(defaults.value).message = {initialize: true, defaults: true}];
}

// Grpc 描述 gRPC 服务器配置。
//
// 对应配置文件中的 grpc 段，映射到 options.GRPCOptions。
message Grpc {
  // 网络类型，默认 "tcp"。
  string network = 1 [(defaults.value).string = "tcp"];

  // 监听地址，如 ":9090"。":0" 让系统分配空闲端口。
  string addr = 2 [(defaults.value).string = ":9090"];

  // 连接超时（客户端侧使用）。
  google.protobuf.Duration timeout = 3;
}
